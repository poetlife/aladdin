          description: 请求在哪个范围上登记。仅用于鉴权。
        path:
          type: string
          title: path
          description: 要登记（或改显示名）的路径。路径为空表示全局，而全局不可登记，因此会被拒绝。
        displayName:
          type: string
          title: display_name
          description: 展示名。留空则界面回落到显示路径本身。
      title: PutScopeRequest
      additionalProperties: false
    aladdin.rbac.v1.PutScopeResponse:
      type: object
      properties:
        scope:
          allOf:

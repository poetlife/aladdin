        开始一次封面上传：签发一份直传凭证。

         **字节不经过服务端**（见 docs/design/objectstore/README.md）：服务端在这里
         校验**声明的**类型在白名单内、按声明的大小早退，然后把"只许写这个技能的封面
         这一个键、类型与大小受条件约束"的策略交给对象存储执行。

         一个技能一个键，替换即原地覆盖：它与头像同属**"当前这一张"**那类对象，
         而不是内容对象那种按摘要寻址、不可变、共享的字节（见
         docs/design/skill/catalog.md 的"封面"）。
      operationId: aladdin.skill.v1.SkillAdminService.BeginSkillCoverUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.skill.v1.BeginSkillCoverUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.skill.v1.BeginSkillCoverUploadResponse'
  /aladdin.skill.v1.SkillAdminService/CommitSkillCoverUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: skill.catalog.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.skill.v1.SkillAdminService
      summary: CommitSkillCoverUpload
      description: |-
        **鉴权**：需要权限 `skill.catalog.write`；作用域取自凭证的默认作用域。

        提交一次封面上传：核对字节确实到了，把技能指向它。

         签发之后客户端传了什么、传没传完，服务端都不知道，因此提交要对那个键做一次
         Head：不存在即失败，字节数超过上限即失败并删除对象。
      operationId: aladdin.skill.v1.SkillAdminService.CommitSkillCoverUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.skill.v1.CommitSkillCoverUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.skill.v1.CommitSkillCoverUploadResponse'
  /aladdin.skill.v1.SkillAdminService/DeleteSkillCover:
    post:
      x-aladdin-auth:
        kind: requires
        permission: skill.catalog.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.skill.v1.SkillAdminService
      summary: DeleteSkillCover
      description: |-
        **鉴权**：需要权限 `skill.catalog.write`；作用域取自凭证的默认作用域。

        移除封面。没有封面时也成功（幂等）。

         它删的是**对象**：这个键由这一个技能独占，不像内容对象那样可能被别处引用。
      operationId: aladdin.skill.v1.SkillAdminService.DeleteSkillCover
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.skill.v1.DeleteSkillCoverRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.skill.v1.DeleteSkillCoverResponse'
  /aladdin.telemetry.v1.TelemetryService/ReportEvents:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.telemetry.v1.TelemetryService
      summary: ReportEvents
      description: |-
        **鉴权**：公开接口，无需认证。

        上报一批客户端事件。

         **公开方法**（无权限注解族里的 public）：登录页失败、CLI 未登录退出都发生在
         拿到会话之前，要求先认证才能上报是循环依赖。由此带来的两条义务写在实现一侧：

           - 只有清单里标记为「允许匿名」的动作在无主体时被接受，其余**丢弃**并在
             DEBUG 级留一行——它是一次上报，绝不能被当成业务错误打回给客户端；
           - 限流按主体（已识别时）或来源地址（匿名时）双重有界，防止它被当成一条
             免费的自由日志通道。

         它**不是** `authenticated_only`，也不是 `required_permission`：前者会让匿名
         动作彻底进不来，后者要为遥测凭空造一个权限码。这是公开白名单里刻意增加的
         一员，理由与代价登记在 docs/design/rbac/server-permissions.md。

         **不标 idempotency_level**：那个注解只对 unary 注册，且它决定"只读 ⇒ 额外
         接受 GET"。上报是写副作用（它写日志），不是只读查询，标上它会让文档说出
         一句不成立的话。
      operationId: aladdin.telemetry.v1.TelemetryService.ReportEvents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.telemetry.v1.ReportEventsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.telemetry.v1.ReportEventsResponse'
  /aladdin.telemetry.v1.TelemetryAdminService/ListEventStats:
    post:
      x-aladdin-auth:
        kind: requires
        permission: telemetry.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.telemetry.v1.TelemetryAdminService
      summary: ListEventStats
      description: |-
        **鉴权**：需要权限 `telemetry.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        按 `client × action × result` 统计时间窗内的事件条数。

         它是"Web/CLI 最近在干什么、失败或被拦多不多"这一眼的直接答案：三个维度
         都是写侧的有界取值，因此结果行数有上界（端 × 动作 × 结局），不需要分页。
      operationId: aladdin.telemetry.v1.TelemetryAdminService.ListEventStats
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.telemetry.v1.ListEventStatsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.telemetry.v1.ListEventStatsResponse'
  /aladdin.telemetry.v1.TelemetryAdminService/ListRecentEvents:
    post:
      x-aladdin-auth:
        kind: requires
        permission: telemetry.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.telemetry.v1.TelemetryAdminService
      summary: ListRecentEvents
      description: |-
        **鉴权**：需要权限 `telemetry.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出时间窗内**最新的一页**事件明细。

         只给最新的一页、条数有上限，不提供游标翻页：这一页要回答的是"刚才发生了什么"，
         而不是"把三个月的事件翻完"。要翻完就该去日志系统，那里的检索没有上限。
      operationId: aladdin.telemetry.v1.TelemetryAdminService.ListRecentEvents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.telemetry.v1.ListRecentEventsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.telemetry.v1.ListRecentEventsResponse'
components:
  schemas:
    aladdin.events.v1.Control:
      type: string
      title: Control
      enum:
        - CONTROL_UNSPECIFIED
        - CONTROL_RESYNC
        - CONTROL_HEARTBEAT
      description: |-
        Control 是通道自己的控制类别，与任何业务无关。

         两个取值都不是"某个资源发生了变化"，它们是这条长连接本身的机制。
    aladdin.events.v1.Event:
      type: object
      properties:
        topic:
          type: string
          title: topic
          description: 这条事件是关于哪个主题的。**控制事件（心跳）不带主题**：它是连接级的。
        control:
          allOf:
            - title: control
              description: 控制类别。UNSPECIFIED 表示"这个主题变了"——普通事件。
            - $ref: '#/components/schemas/aladdin.events.v1.Control'
      title: Event
      additionalProperties: false
      description: |-
        Event 是这条流上推给调用方的一条**小事件**。

         **它不含内容**：没有正文、没有字节、没有短时地址，也没有"变了什么"。载荷只有
         "哪个主题"与"这是不是一条控制事件"——因此它的大小与资源的内容体积无关，也不会
         过期。
    aladdin.events.v1.WatchRequest:
      type: object
      properties:
        topics:
          type: array
          items:
            type: string
          title: topics
          description: |-
            主题，形如 `<类型>/<资源标识>`，例如 `galaxy.project/prj_3fK9…`。

             类型名由**属主模块**注册（谁提供这个资源谁定义它），通道只按前缀查表。
             重复的主题会被忽略；空集合是合法的（只收心跳），虽然少有正当理由。
      title: WatchRequest
      additionalProperties: false
      description: WatchRequest 要订阅的主题集合。
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
    aladdin.galaxy.v1.ContentSlot:
      type: string
      title: ContentSlot
      enum:
        - CONTENT_SLOT_UNSPECIFIED
        - CONTENT_SLOT_SITE
        - CONTENT_SLOT_DOCS
      description: |-
        ContentSlot 是工程的一块独立内容。

         一个工程有一到两个槽，**创建时至少选一个，此后只增不删**。每个槽各有自己的
         草稿、版本、发布指针与地址，**两个槽互不影响**：在一个槽上的任何动作都不改变
         另一个槽。两种槽的差别落在入口、渲染与扩展名白名单三处（见
         docs/design/galaxy/site-model.md），**没有一处在对象存储的键上**。
    aladdin.galaxy.v1.MediaKind:
      type: string
      title: MediaKind
      enum:
        - MEDIA_KIND_UNSPECIFIED
        - MEDIA_KIND_IMAGE
        - MEDIA_KIND_VIDEO
        - MEDIA_KIND_AUDIO
        - MEDIA_KIND_FONT
      description: |-
        MediaKind 是资产按媒体分出的类别。

         它决定的是**用哪一档大小上限**：一张图与一段视频的合理体积差两个数量级，
         用同一个上限卡两者，要么放过一张过大的图，要么拒掉一段正常的视频。它同时
         是对象键里的一段（见 docs/design/galaxy/asset-library.md）。
    aladdin.galaxy.v1.AddProjectSlotRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 要加的槽。**必填**：没有"随便加一个"这个形状。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: AddProjectSlotRequest
      additionalProperties: false
    aladdin.galaxy.v1.AddProjectSlotResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
              description: 加完之后完整的工程状态（含两个槽各自的发布状态）。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: AddProjectSlotResponse
      additionalProperties: false
    aladdin.galaxy.v1.Asset:
      type: object
      properties:
        id:
          type: string
          title: id
        mediaType:
          type: string
          title: media_type
          description: |-
            媒体类型。**上传方声明的**，服务端只校验它在白名单内，并把它作为此后
             下发时回给浏览器的内容类型。声明不等于验证（见 objectstore）。
        kind:
          allOf:
            - title: kind
              description: 类别。它决定大小上限，也是对象键里的一段。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.MediaKind'
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: 字节数。它取自提交时对对象的核对，不是声明值。
        filename:
          type: string
          title: filename
          description: 原始文件名。**仅供展示与排障**：它不进对象键，不参与任何判断。
        uploadedAt:
          type: string
          title: uploaded_at
        url:
          type: string
          title: url
          description: |-
            **短时有效**的预签名读取地址，客户端直接放进 <img src>。

             这个地址在有效期内谁拿到都能用，它是一份短期凭证。这正是"未发布的资产
             里不得承载秘密"这条约束的来源。过期后重新调用 ListAssets 即得到新地址。

             未配置私有桶时为空。
        title:
          type: string
          title: title
          description: |-
            展示标题。**与 filename 分离**：文件名常是工具生成的乱码或不可信，
             而标题是给人看的。空表示没有标题，此时界面回退到 filename 展示。
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            标签。工程内的自由字符串，不是全局字典，也不是权限资源。

             **值已归一化**（trim、小写、去重并升序、长度与数量受限，见
             asset-library.md）：拿到的是唯一的那一份形式，调用方不必也不得自己再归一化
             或再排序一次。
        notes:
          type: string
          title: notes
          description: 备注。纯文本，不是 Markdown。**不进对象键、不进发布产物、不进日志原文**。
      title: Asset
      additionalProperties: false
      description: |-
        Asset 是工程资产库里的一个媒体文件。

         字节在对象存储，这里只有元数据与一个短时读取地址。

         元数据分**两层**（见 docs/design/galaxy/asset-library.md）：字节层
         （media_type、kind、size_bytes）**不可变**；说明层（title、tags、notes）
         **可改**，改它们不动字节层的任何一项，也不进发布产物。
    aladdin.galaxy.v1.AssetKindLimit:
      type: object
      properties:
        kind:
          allOf:
            - title: kind
            - $ref: '#/components/schemas/aladdin.galaxy.v1.MediaKind'
        maxBytes:
          type: integer
          title: max_bytes
      title: AssetKindLimit
      additionalProperties: false
      description: |-
        AssetKindLimit 是某一类资产的字节上限。

         它随能力下发，让客户端在选文件时就早退，免得把一个几十 MB 的文件整个传
         上来只为了被拒。**服务端仍然是权威**：客户端这一判断只是省一次往返，
         不是一条安全边界。
    aladdin.galaxy.v1.BeginAssetUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        contentType:
          type: string
          title: content_type
          description: '**声明**的内容类型。服务端只校验它在白名单内。'
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: |-
            **声明**的字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
             大小上限由存储侧按内容类型执行。
      title: BeginAssetUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.BeginAssetUploadResponse:
      type: object
      properties:
        assetId:
          type: string
          title: asset_id
          description: 本次上传的资产标识。提交时要把它带回来。
        upload:
          allOf:
            - title: upload
              description: 直传凭证。**只允许写、只对这一个键有效、短时有效。**
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginAssetUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.BeginContentUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        digest:
          type: string
          title: digest
          description: |-
            **声明的**内容摘要（SHA-256 十六进制）。服务端用它和工程标识组成私有区
             对象键（不跨工程共享）。已存在则不必再传。
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: |-
            **声明的**字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
             大小上限由存储侧按策略执行。
      title: BeginContentUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.BeginContentUploadResponse:
      type: object
      properties:
        alreadyExists:
          type: boolean
          title: already_exists
          description: |-
            为真表示这个内容对象已经存在，客户端无需上传（也无需提交）。

             这正是"同一份未改动的文件在多个版本之间共享一个对象"在接口上的样子：
             改一个字只产生一个新对象，没改的文件一次上传都不用做。
        upload:
          allOf:
            - title: upload
              description: |-
                直传凭证。**只允许写、只对这一个键有效、短时有效、且不允许覆盖已有
                 对象。** already_exists 为真时为空。
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginContentUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.Capabilities:
      type: object
      properties:
        assetUploadEnabled:
          type: boolean
          title: asset_upload_enabled
          description: 是否配置了对象存储桶。为假时不渲染上传入口与资产区。
        publishEnabled:
          type: boolean
          title: publish_enabled
          description: 是否可用发布。为假时不渲染发布入口。
        previewEnabled:
          type: boolean
          title: preview_enabled
          description: |-
            是否可用预览。为假时不渲染预览：预览走发布域上的一条通道，没有发布域的
             部署就没有预览（如实缺席，而不是给一份解析不了自己引用的文档）。
        maxTextBytes:
          type: integer
          title: max_text_bytes
          description: 单份文本条目的字节上限。
        maxFileSetBytes:
          type: integer
          title: max_file_set_bytes
          description: 整组文件（清单里所有文本条目之和）的字节上限。
        maxFiles:
          type: integer
          title: max_files
          description: 整组的文件数上限。
        assetLimits:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.AssetKindLimit'
          title: asset_limits
          description: 各类资产的字节上限。
      title: Capabilities
      additionalProperties: false
      description: |-
        Capabilities 是当前部署下创作能力的边界。

         两个布尔项是**部署形态**的公开事实，不因调用者而异：未配置对象存储时
         素材传不了，未配置发布域时页面发不出去，而工程与版本照常可用。
    aladdin.galaxy.v1.CommitAssetUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
        contentType:
          type: string
          title: content_type
          description: |-
            **声明**的内容类型。**两次调用之间服务端不保留任何状态**（那正是"未提交
             的上传不留痕迹"的实现方式），因此它在这里被再次声明并重新校验。
        digest:
          type: string
          title: digest
          description: |-
            **声明**的内容摘要（SHA-256 的十六进制）。

             它是公开区地址的键，而服务端没有字节可以算它。**它在被使用之前会被核对**：
             提交时核对它是不是那份字节的摘要（让存储侧算，或读回自己算），不一致即
             删除对象并拒绝——因此一条假的摘要不会把公开区的地址指向别人的内容。
        filename:
          type: string
          title: filename
          description: |-
            展示用的原始文件名。**不进对象键，不参与任何判断**：它可能含路径分隔符、
             控制字符以及别人的名字，把它拼进存储路径就是把一段不可信输入拼进路径。
        title:
          type: string
          title: title
          description: |-
            初始的说明层元数据，都可空（见 Asset 的 title / tags / notes）。

             与"提交之后再调 UpdateAsset"结果相同，区别只是少一次往返。
        tags:
          type: array
          items:
            type: string
          title: tags
        notes:
          type: string
          title: notes
      title: CommitAssetUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.CommitAssetUploadResponse:
      type: object
      properties:
        asset:
          allOf:
            - title: asset
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
      title: CommitAssetUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.CommitContentUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        digest:
          type: string
          title: digest
          description: |-
            与服务端核对的那个摘要。**两次调用之间服务端不保留任何状态**（那正是
             "未提交的上传不留痕迹"的实现方式），因此它在这里被再次声明。
      title: CommitContentUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.CommitContentUploadResponse:
      type: object
      title: CommitContentUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        slots:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
          title: slots
          description: 创建时要启用的内容槽。**至少一个、不重复**，此后只增不删（见 AddProjectSlot）。
      title: CreateProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.CreateProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: CreateProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteAssetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
      title: DeleteAssetRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteAssetResponse:
      type: object
      title: DeleteAssetResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: DeleteProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteProjectResponse:
      type: object
      title: DeleteProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        slot:
          allOf:
            - title: slot
              description: 该版本所属的内容槽。版本按槽隔离，因此要给。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: DeleteVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteVersionResponse:
      type: object
      title: DeleteVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.Draft:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
        updatedAt:
          type: string
          title: updated_at
          description: 最后一次推送的时间。从未推送过草稿时为空。
        slot:
          allOf:
            - title: slot
              description: 这是哪个槽的草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: Draft
      additionalProperties: false
      description: |-
        Draft 是**某个内容槽**当前正在编辑的文件清单。

         它不是版本：随时可改，改它不产生版本，不参与发布，也不保证可退回。
    aladdin.galaxy.v1.FileEntry:
      type: object
      allOf:
        - anyOf:
            - required:
                - assetId
            - required:
                - digest
            - not:
                anyOf:
                  - required:
                      - assetId
                  - required:
                      - digest
      anyOf:
        - required:
            - assetId
        - required:
            - digest
        - not:
            anyOf:
              - required:
                  - assetId
              - required:
                  - digest
      properties:
        path:
          type: string
          title: path
          description: |-
            相对路径。它是**公开地址的一部分**，因此字符集受 URL 安全字符集约束，
             不含 `..`、不以 `/` 开头或结尾、不含空段。
        digest:
          type: string
          title: digest
          description: |-
            文本条目：字节的内容摘要（SHA-256 十六进制）。私有区对象键由工程标识与
             它共同构成（`galaxy/<工程标识>/text/<摘要>`），不跨工程共享。
        assetId:
          type: string
          title: asset_id
          description: 资产条目：资产库里的一个资产标识。
        url:
          type: string
          title: url
          description: |-
            读取地址，客户端直接取字节。**取值随调用它的方法而不同**：

               - GetDraft / GetVersion 填的是**编辑态的短时凭证**——它是一份短期凭证，
                 因此未发布的资产里不得承载秘密，过期后重新读取清单即得到新地址；
               - GetPublication 填的是**发布态的那条访客地址**（文本条目就是内容地址，
                 资产条目由它重定向到公开区）——那条地址本来就是公开的，不是凭证。

             写入路径（PushDraft）忽略这个字段。
      title: FileEntry
      additionalProperties: false
      description: |-
        FileEntry 是文件组里的一条条目：一个路径，加上它的字节从哪来。

         两类条目恰好对应"字节在哪"的两种答案（见 docs/design/galaxy/site-model.md）：
         文本条目的字节是按**内容摘要**寻址的内容对象；资产条目的字节是资产库里的
         一个媒体文件。**清单里没有字节本身**，因此同一个工程内、同一份未改动文件在
         多个版本、多次发布之间共享同一个对象。不跨工程共享。
    aladdin.galaxy.v1.GetCapabilitiesRequest:
      type: object
      title: GetCapabilitiesRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetCapabilitiesResponse:
      type: object
      properties:
        capabilities:
          allOf:
            - title: capabilities
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Capabilities'
      title: GetCapabilitiesResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 要读哪个内容槽的草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: GetDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetDraftResponse:
      type: object
      properties:
        draft:
          allOf:
            - title: draft
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Draft'
      title: GetDraftResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: GetProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: GetProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetPublicationRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 要读哪个内容槽**当前发布**的那一份。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: GetPublicationRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetPublicationResponse:
      type: object
      properties:
        publication:
          allOf:
            - title: publication
              description: 这个槽当前发布的记录。**未发布时为空**——那是这个槽的一种正常状态，不是错误。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Publication'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: |-
            这一份产物的清单：路径是**产物路径**（`docs` 槽的 markdown 是 `.html`，与
             发布域上那条地址同形），`url` 是访客走的读取地址。未发布时为空。
      title: GetPublicationResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        slot:
          allOf:
            - title: slot
              description: 该版本所属的内容槽。版本按槽隔离，因此要给。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: GetVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetVersionResponse:
      type: object
      properties:
        version:
          allOf:
            - title: version
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
      title: GetVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListAssetsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            按标签筛选：精确匹配、多值取**交集**（同时带上这些标签的资产才列出）。

             取值会按同一套归一化规则处理（trim、小写），因此客户端给 "Cover" 与
             "cover" 是同一个筛选。空表示不筛。
      title: ListAssetsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListAssetsResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
          title: assets
        projectTags:
          type: array
          items:
            type: string
          title: project_tags
          description: '**整个工程**已有的标签，升序。用于筛选界面的候选，**不随本次筛选收窄**。'
      title: ListAssetsResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListProjectsRequest:
      type: object
      title: ListProjectsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
          title: projects
      title: ListProjectsResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListVersionsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 列出哪个内容槽的版本。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: ListVersionsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
          title: versions
      title: ListVersionsResponse
      additionalProperties: false
    aladdin.galaxy.v1.PreviewDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        path:
          type: string
          title: path
          description: |-
            要预览的那一份文件；为空表示入口。按**该槽**文件组里的路径给——
             `docs` 槽的页面由服务端渲染，因此这里也可以给它的产物路径。
        slot:
          allOf:
            - title: slot
              description: 预览哪个内容槽的草稿。凭证绑在（工程，槽）上，换一个槽要重新开一次。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: PreviewDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.PreviewDraftResponse:
      type: object
      properties:
        url:
          type: string
          title: url
          description: |-
            草稿整站在发布域上的入口地址，带短时凭证。**iframe 的 `src` 就是它**，
             页内的其余文件由浏览器按同一个地址空间自己取。

             为空表示**草稿里还没有可预览的入口**：那不是错误，而是"还没内容"。
      title: PreviewDraftResponse
      additionalProperties: false
    aladdin.galaxy.v1.Project:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |-
            工程标识。由服务端分配，不可猜、不可改、不复用。

             它是**发布地址的一部分**，而发布态是公开匿名的：拿到地址的人能看，
             猜不出地址的人看不到（见 docs/design/galaxy/README.md 的"发布即公开"）。
        name:
          type: string
          title: name
          description: 名称。可改。**仅用于本人识别**，不是查找键，不进发布地址。
        description:
          type: string
          title: description
          description: 简介。为空表示未填写。
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
        slots:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ProjectSlot'
          title: slots
          description: |-
            启用的内容槽，每个带它自己的发布状态与地址。**至少一个**。

             槽只增不删（见 AddProjectSlot），因此这个列表只会在后面追加。**每个槽的
             发布状态都属于它自己**：发布或撤回一个槽不改变另一个槽的任何字段。
      title: Project
      additionalProperties: false
      description: |-
        Project 是一个创作单元的元数据。

         **不带草稿清单、版本清单与资产字节。** 列表接口会读这一行，把清单挂上来
         是一笔与列表无关的代价；整张表也不含任何字节。
    aladdin.galaxy.v1.ProjectSlot:
      type: object
      properties:
        slot:
          allOf:
            - title: slot
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
        published:
          type: boolean
          title: published
          description: 这个槽当前是否处于发布态。
        publishedVersionId:
          type: string
          title: published_version_id
          description: 这个槽当前发布指向的版本标识。未发布时为空。
        publishedUrl:
          type: string
          title: published_url
          description: |-
            这个槽的**分享地址**：site 槽形如 <主站>/g/<工程标识>，docs 槽形如
             <主站>/g/<工程标识>/docs。未发布时为空。

             **它落在主站，不落在发布域**：贴给别人的是这一条，打开它由主站壳用跨源沙箱
             iframe 取发布域上的同一条路径（见 docs/design/galaxy/publication.md 的"主站
             壳"）。发布域上的内容地址由 ResolveSharedPage 给出，默认不展示。

             **地址由服务端算好**，客户端不拼：记号解析生成的地址、内容安全策略里的
             允许来源与这条分享地址都从同一批配置值派生，客户端再拼一份就是又一个来源。
        publishedAt:
          type: string
          title: published_at
          description: 这个槽当前发布的生效时间。未发布时为空。
        baseUrl:
          type: string
          title: base_url
          description: |-
            这个槽的**发布根**，形如 <发布域>/g/<工程标识>/（docs 槽到 `docs/`），
             供构建命令使用（vite 的 --base）。

             配置了发布域时始终有值，与是否已发布无关：构建产物里的绝对路径要成立，
             靠的是它，而不是"页面已经发出去"。未配置发布域时为空。
      title: ProjectSlot
      additionalProperties: false
      description: |-
        ProjectSlot 是工程的一个内容槽，以及它当前的发布状态。

         一个槽一条。**行存在即槽启用**——"这个工程有哪些内容"只有这一处回答，
         工程行上不重复存一份。
    aladdin.galaxy.v1.Publication:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        publishedAt:
          type: string
          title: published_at
        url:
          type: string
          title: url
          description: '**分享地址**（主站包装），与对应 ProjectSlot.published_url 同一处派生。'
        slot:
          allOf:
            - title: slot
              description: 这次发布的是哪个内容槽。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: Publication
      additionalProperties: false
      description: |-
        Publication 是一次发布的产物记录。

         发布域上的**内容地址**按产物清单分派：文本条目由服务端在它自己的路径上给出，
         资产条目重定向到公开区；对外**分享**给访问者的是主站上的包装地址。
    aladdin.galaxy.v1.PublishRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
          description: 要发布的版本。**必填**：没有"发布当前草稿"这种形状。
        slot:
          allOf:
            - title: slot
              description: 发布哪个内容槽的版本。版本按槽隔离，因此要给。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: PublishRequest
      additionalProperties: false
    aladdin.galaxy.v1.PublishResponse:
      type: object
      properties:
        publication:
          allOf:
            - title: publication
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Publication'
        project:
          allOf:
            - title: project
              description: 生效之后的工程状态，含新的发布地址。前端据此刷新而不必再查一次。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: PublishResponse
      additionalProperties: false
    aladdin.galaxy.v1.PushDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: 期望的完整清单。条目只引用已经上传好的对象，因此这里的 url 被忽略。
        slot:
          allOf:
            - title: slot
              description: 要替换哪个内容槽的整组草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: PushDraftRequest
      additionalProperties: false
      description: PushDraftRequest 表达的是草稿的**期望完整状态**，不是增量。
    aladdin.galaxy.v1.PushDraftResponse:
      type: object
      properties:
        draft:
          allOf:
            - title: draft
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Draft'
      title: PushDraftResponse
      additionalProperties: false
      description: |-
        返回推送之后的草稿，而不是一个成功标志：客户端刚做过一次会改变现状的
         操作，让它在同一次往返里拿到新现状，比再发一次查询更省事。
    aladdin.galaxy.v1.ResolveSharedPageRequest:
      type: object
      properties:
        path:
          type: string
          title: path
          description: |-
            主站上的分享路径，以 `/g/` 开头，形如 `/g/<工程标识>`、`/g/<工程标识>/docs`
             或 `/g/<工程标识>/docs/guide`。

             给整条路径而不是（工程，槽，路径）三元组：**槽的判定只有服务端一处**，客户端
             再解析一份就是第二个形状来源。
      title: ResolveSharedPageRequest
      additionalProperties: false
    aladdin.galaxy.v1.ResolveSharedPageResponse:
      type: object
      properties:
        contentUrl:
          type: string
          title: content_url
          description: |-
            这条路径在**发布域**上的内容地址，形如
             `<发布域>/g/<工程标识>[/docs][/路径]`。壳把它放进 iframe 的 src。

             **空表示"没有这一页"**，且六种情形同此一答（未发布 / 已撤回 / 该槽未启用 /
             工程不存在 / 标识没被猜中 / 路径不在集合里）。它不是错误：调用方据此渲染
             与发布态相同的"不存在"。
      title: ResolveSharedPageResponse
      additionalProperties: false
    aladdin.galaxy.v1.SaveVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 把哪个内容槽的草稿存成版本。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: SaveVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.SaveVersionResponse:
      type: object
      properties:
        version:
          allOf:
            - title: version
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
      title: SaveVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.UnpublishRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 撤回哪个内容槽的发布。**另一个槽不受影响**。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: UnpublishRequest
      additionalProperties: false
    aladdin.galaxy.v1.UnpublishResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: UnpublishResponse
      additionalProperties: false
    aladdin.galaxy.v1.UpdateAssetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
        title:
          type: string
          title: title
          description: 期望的展示标题。空串表示没有标题。
        tags:
          type: array
          items:
            type: string
          title: tags
          description: 期望的标签集合，**整体替换**（不在集合里的标签就是删掉）。空集表示清空。
        notes:
          type: string
          title: notes
          description: 期望的备注。空串表示清空。
      title: UpdateAssetRequest
      additionalProperties: false
      description: UpdateAssetRequest 表达的是说明层元数据的**期望完整状态**，不是增量。
    aladdin.galaxy.v1.UpdateAssetResponse:
      type: object
      properties:
        asset:
          allOf:
            - title: asset
              description: 改完之后的资产（含短时读取地址）。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
      title: UpdateAssetResponse
      additionalProperties: false
    aladdin.galaxy.v1.UpdateProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
          description: 期望的完整状态，空串表示清空。
        description:
          type: string
          title: description
      title: UpdateProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.UpdateProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: UpdateProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.ValidateDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 校验哪个内容槽的草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: ValidateDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.ValidateDraftResponse:
      type: object
      properties:
        problems:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ValidationProblem'
          title: problems
      title: ValidateDraftResponse
      additionalProperties: false
      description: |-
        问题为空表示这份草稿可以发布。**它是发布前置校验的同一份规则**，因此
         "这里通过"与"发布能成功"是同一个结论，不会漂移。
    aladdin.galaxy.v1.ValidationProblem:
      type: object
      properties:
        message:
          type: string
          title: message
        path:
          type: string
          title: path
          description: 出问题的文件路径。与行无关的问题（如整组超限）为空。
        line:
          type: integer
          title: line
          format: int32
          description: 出问题的行号（从 1 开始）。0 表示与行无关。
      title: ValidationProblem
      additionalProperties: false
      description: |-
        ValidationProblem 是校验发现的一处问题。

         message 里**带上出问题的文件与位置**：只说"有引用不合法"会让用户在一组
         文件里自己找。
    aladdin.galaxy.v1.Version:
      type: object
      properties:
        id:
          type: string
          title: id
        seq:
          oneOf:
            - type: integer
              title: integer
              format: int64
            - type: string
              title: string
          title: seq
          description: |-
            在**本槽内**递增的序号。**仅用于展示与排序，不是标识。**
             删除一个版本会让后续序号出现空洞，这是可接受的。
        savedAt:
          type: string
          title: saved_at
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: 保存那一刻草稿的清单。**写入后不再修改。** 地址只有 GetVersion 填充。
        renderRulesVersion:
          type: integer
          title: render_rules_version
          format: int32
          description: |-
            保存时所处的渲染规则版本。只有 `docs` 槽使用它，重新发布时按它渲染
             而不是按当前最新的——否则"撤回后重新发布同一版本，产物逐字相同"会在
             渲染器升级的那天悄悄失效。
        slot:
          allOf:
            - title: slot
              description: 这个版本属于哪个槽。**版本按槽隔离**：它只在自己的槽里被列出与发布。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: Version
      additionalProperties: false
      description: Version 是文件清单的一次不可变快照。
    aladdin.objectstore.v1.DirectUploadCredential:
      type: object
      properties:
        bucket:
          type: string
          title: bucket
          description: 桶名（含 APPID），不是地址：客户端 SDK 要的是桶名与地域。
        region:
          type: string
          title: region
          description: 桶所在地域，形如 ap-guangzhou。
        key:
          type: string
          title: key
          description: 这次唯一允许写入的对象键。由服务端分配，客户端改不了。
        secretId:
          type: string
          title: secret_id
          description: 临时凭证三元组。
        secretKey:
          type: string
          title: secret_key
        sessionToken:
          type: string
          title: session_token
        expiresAt:
          type: string
          title: expires_at
          description: 凭证的失效时刻。它是**给客户端的提示值**，实际失效以对象存储的判断为准。
        forbidOverwrite:
          type: boolean
          title: forbid_overwrite
          description: |-
            写入是否**禁止覆盖已存在的对象**。

             内容对象（galaxy 的文本条目）按**内容摘要**寻址，因此"仅当不存在时写入"
             是它成立的前提：一个伪造的摘要若落到另一个版本已经在用的键上，会把那个
             对象改写掉——而那是"版本不可变"的反面。为真时客户端在写入请求上带禁止
             覆盖的条件，由对象存储执行。

             头像与资产按标识寻址、一个标识一个对象，因此它是假。
      title: DirectUploadCredential
      additionalProperties: false
      description: |-
        DirectUploadCredential 是一次直传所需的全部取值。

         它是**一份短时凭证**：在有效期内，拿到它的人可以用它往 key 上写一次。因此
         它只下发给发起上传的那个客户端。

         **它只允许写。** 约束写在换取来的策略里，由对象存储执行：动作只有写入对象，
         资源只有 key 这一个对象，条件限定声明的内容类型与请求体长度上限。

         **它不得进日志。** 把它写进日志等于把一次写入的能力留在了日志文件里。
    aladdin.identity.v1.DeviceLoginState:
      type: string
      title: DeviceLoginState
      enum:
        - DEVICE_LOGIN_STATE_UNSPECIFIED
        - DEVICE_LOGIN_STATE_PENDING
        - DEVICE_LOGIN_STATE_APPROVED
        - DEVICE_LOGIN_STATE_DENIED
        - DEVICE_LOGIN_STATE_EXPIRED
      description: |-
        DeviceLoginState 是一次轮询的结果。

         它是一个**状态**而不是一组错误码：调用方据此决定继续等、停下、还是重新
         发起。四种取值互斥且穷尽——分不出类别的取值会让调用方只能猜。
    aladdin.identity.v1.ApproveDeviceLoginRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
          description: 要批准的短码。**不是归属输入**——目标主体只取当前凭证代表的主体。
      title: ApproveDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.ApproveDeviceLoginResponse:
      type: object
      title: ApproveDeviceLoginResponse
      additionalProperties: false
    aladdin.identity.v1.AuthMethod:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源标识，如 google / github。前端据此决定渲染哪个入口。
        clientId:
          type: string
          title: client_id
          description: |-
            该渠道的公开客户端标识。

             **不是秘密**：它本来就明文出现在浏览器里，这是这类登录方式的设计前提。
      title: AuthMethod
      additionalProperties: false
      description: AuthMethod 是一个已启用的登录渠道。
    aladdin.identity.v1.BindIdentityRequest:
      type: object
      allOf:
        - anyOf:
            - required:
                - google
            - not:
                anyOf:
                  - required:
                      - google
      anyOf:
        - required:
            - google
        - not:
            anyOf:
              - required:
                  - google
      properties:
        google:
          allOf:
            - title: google
            - $ref: '#/components/schemas/aladdin.identity.v1.GoogleCredential'
      title: BindIdentityRequest
      additionalProperties: false
    aladdin.identity.v1.BindIdentityResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
        reclaimed:
          type: boolean
          title: reclaimed
          description: |-
            本次是否认领了一个空主体上的身份。含义与 CompleteIdentityBindingResponse
             的同名字段一致：为 true 表示这个渠道此前单独登录过、已并入当前账号，
             客户端据此给出说明；它不告诉调用方原主体的任何标识。
      title: BindIdentityResponse
      additionalProperties: false
      description: |-
        BindIdentityResponse 返回绑定之后该主体的全部渠道。

         返回整份现状而不是一个"成功"标志：客户端刚做过一次会改变现状的操作，
         让它在同一次往返里拿到新现状，比再多发一次查询更省事，也不会读到
         两次请求之间的中间态。
    aladdin.identity.v1.CompleteIdentityBindingRequest:
      type: object
      properties:
        source:
          type: string
          title: source
          description: |-
            渠道来源，如 github。它只用于与待绑定凭据里记下的来源互相印证；
             **不是归属输入**——目标主体只取当前凭证代表的主体。
      title: CompleteIdentityBindingRequest
      additionalProperties: false
      description: CompleteIdentityBindingRequest 兑换一份已经由回调校验过的重定向型渠道身份。
    aladdin.identity.v1.CompleteIdentityBindingResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
        reclaimed:
          type: boolean
          title: reclaimed
          description: |-
            本次是否认领了一个空主体上的身份。为 true 表示这个渠道此前单独登录过，
             客户端据此给出"已并入当前账号"的说明。

             它只说明"发生过认领"，不告诉调用方原主体的任何标识。
      title: CompleteIdentityBindingResponse
      additionalProperties: false
      description: CompleteIdentityBindingResponse 返回绑定之后该主体的全部渠道。
    aladdin.identity.v1.DenyDeviceLoginRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
      title: DenyDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.DenyDeviceLoginResponse:
      type: object
      title: DenyDeviceLoginResponse
      additionalProperties: false
    aladdin.identity.v1.GetAuthMethodsRequest:
      type: object
      title: GetAuthMethodsRequest
      additionalProperties: false
    aladdin.identity.v1.GetAuthMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.AuthMethod'
          title: methods
          description: |-
            已启用的登录渠道，顺序稳定。为空表示没有任何渠道登录方式可用，
             前端据此不渲染任何渠道入口。
        deviceLoginEnabled:
          type: boolean
          title: device_login_enabled
          description: |-
            命令行的设备码登录是否可用。

             它**不是一个渠道**，因此不在 methods 里：它不引入任何渠道身份，只是把
             一个已有主体的会话交给终端。不可用时命令行据此不去发起，而不是发起了
             再收到一次"未实现"。
      title: GetAuthMethodsResponse
      additionalProperties: false
      description: |-
        GetAuthMethodsResponse 描述服务端当前启用了哪些登录方式。

         只承载公开信息：这里出现的一切都会明文送到浏览器，因此不得放入任何
         需要保护的取值。

         返回的是**列表**而不是逐个具名字段：新增一个渠道时这里不该再改一次形状，
         前端也不该为每个渠道多写一个判断分支（见 docs/design/identity/channel-login.md）。
    aladdin.identity.v1.GetSessionPermissionsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 期望的作用域。留空时使用凭证的默认作用域。
      title: GetSessionPermissionsRequest
      additionalProperties: false
    aladdin.identity.v1.GetSessionPermissionsResponse:
      type: object
      properties:
        scope:
          type: string
          title: scope
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: 已展开的最终权限码集合。
      title: GetSessionPermissionsResponse
      additionalProperties: false
    aladdin.identity.v1.GoogleCredential:
      type: object
      properties:
        idToken:
          type: string
          title: id_token
      title: GoogleCredential
      additionalProperties: false
      description: |-
        GoogleCredential 是 Google Identity Services 在浏览器内返回的身份令牌。

         它由前端搬运、由服务端校验，前端的任何字段都不参与信任决策。服务端必须
         校验签名、签发方、受众与有效期，其中**受众必须严格等于本服务配置的客户端
         标识**——漏掉这一条意味着任何 Google 应用的令牌都能登录本服务。

         这份令牌**不得进入日志、错误信息与 --debug 输出**：它与口令同级。
    aladdin.identity.v1.Identity:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源，如 google。
        externalId:
          type: string
          title: external_id
          description: |-
            该渠道上的身份标识。用于发起解绑；它本身不是秘密——拿到它也冒充不了
             谁，登录仍要过渠道自己的校验。
        display:
          type: string
          title: display
          description: 该渠道给出的可读标识（如邮箱），仅供展示。
      title: Identity
      additionalProperties: false
      description: |-
        Identity 是一个已绑定的登录渠道。

         **没有任何一个字段参与判定**，它们只用于展示与解绑时定位。
    aladdin.identity.v1.ListIdentitiesRequest:
      type: object
      title: ListIdentitiesRequest
      additionalProperties: false
    aladdin.identity.v1.ListIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
      title: ListIdentitiesResponse
      additionalProperties: false
    aladdin.identity.v1.LoginRequest:
      type: object
      allOf:
        - anyOf:
            - required:
                - google
            - required:
                - password
            - required:
                - token
            - not:
                anyOf:
                  - required:
                      - google
                  - required:
                      - password
                  - required:
                      - token
      anyOf:
        - required:
            - google
        - required:
            - password
        - required:
            - token
        - not:
            anyOf:
              - required:
                  - google
              - required:
                  - password
              - required:
                  - token
      properties:
        password:
          allOf:
            - title: password
            - $ref: '#/components/schemas/aladdin.identity.v1.PasswordCredential'
        token:
          allOf:
            - title: token
            - $ref: '#/components/schemas/aladdin.identity.v1.TokenCredential'
        google:
          allOf:
            - title: google
            - $ref: '#/components/schemas/aladdin.identity.v1.GoogleCredential'
      title: LoginRequest
      additionalProperties: false
    aladdin.identity.v1.LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
          description: ISO 8601 UTC 时间。CLI 依据它做本地过期预检（见 cli-permissions.md）。
      title: LoginResponse
      additionalProperties: false
    aladdin.identity.v1.PasswordCredential:
      type: object
      properties:
        username:
          type: string
          title: username
        password:
          type: string
          title: password
      title: PasswordCredential
      additionalProperties: false
    aladdin.identity.v1.PollDeviceLoginRequest:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
          description: 服务端在发起时交给终端的设备码。
      title: PollDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.PollDeviceLoginResponse:
      type: object
      properties:
        state:
          allOf:
            - title: state
            - $ref: '#/components/schemas/aladdin.identity.v1.DeviceLoginState'
        accessToken:
          type: string
          title: access_token
          description: 仅 state 为 APPROVED 时存在：会话凭证与它的过期时间。
        expiresAt:
          type: string
          title: expires_at
      title: PollDeviceLoginResponse
      additionalProperties: false
    aladdin.identity.v1.RefreshRequest:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
      title: RefreshRequest
      additionalProperties: false
    aladdin.identity.v1.RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
      title: RefreshResponse
      additionalProperties: false
    aladdin.identity.v1.StartDeviceLoginRequest:
      type: object
      title: StartDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.StartDeviceLoginResponse:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
          description: |-
            设备码：终端保管，用它轮询。不可人工输入，因此没有任何可读性要求。
             **不得进入日志**：它能换来一份会话。
        userCode:
          type: string
          title: user_code
          description: |-
            短码：给人读、给人打。大小写不敏感，连字符可有可无。
             它与设备码同级——能换来一次批准，因此**不得进入日志**。
        verificationUri:
          type: string
          title: verification_uri
          description: |-
            批准页地址。**不含短码**：短码要由人与终端上显示的比对，把短码放进地址
             会消掉这次核对，而那正是"受害者把终端登进攻击者账号"的唯一防线。
        intervalSeconds:
          type: integer
          title: interval_seconds
          format: int32
          description: 建议的轮询间隔（秒）。
        expiresAt:
          type: string
          title: expires_at

                 覆盖（封面是"当前这一张"）。
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginSkillCoverUploadResponse
      additionalProperties: false
    aladdin.skill.v1.CommitSkillCoverUploadRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
      title: CommitSkillCoverUploadRequest
      additionalProperties: false
    aladdin.skill.v1.CommitSkillCoverUploadResponse:

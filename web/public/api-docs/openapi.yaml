  /aladdin.identity.v1.IdentityService/PollDeviceLogin:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: PollDeviceLogin
      description: |-
        **鉴权**：公开接口，无需认证。

        轮询一次设备码登录的结果。

         公开，理由同上。**结果是一个状态，不是一个错误**：把"还没批准"表达成
         一个错误码，会让"这一次轮询没结果"与"你未认证"变成同一个结论，而它们
         该有完全不同的走向——前者该继续等，后者该重新登录。

         已批准时**恰好交付一次**会话凭证，此后再轮询同一份设备码只会得到
         非已批准的状态（见 docs/design/identity/device-login.md）。

         它读起来像只读，实则会推进状态（上面那句"恰好交付一次"），因此**不**标
         idempotency_level——标了就等于同时接受 GET，而 device_code 会随查询串
         落进访问日志，这与它"不得进入日志"的要求冲突。

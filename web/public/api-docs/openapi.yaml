openapi: 3.1.0
info:
  title: aladdin API
  version: v1
  description: |-
    由 `make api-docs` 从 proto 生成，请勿手改。

    每个方法的鉴权要求写在它说明的开头；同一份信息也以 `x-aladdin-auth` 扩展给出，供机器读取。
paths:
  /aladdin.identity.v1.IdentityService/Login:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: Login
      description: |-
        **鉴权**：公开接口，无需认证。

        登录并换取访问凭证。
         这是极少数公开方法之一，必须显式标记 public，否则鉴权拦截器默认拒绝。
      operationId: aladdin.identity.v1.IdentityService.Login
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.LoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.LoginResponse'
  /aladdin.identity.v1.IdentityService/Refresh:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: Refresh
      description: |-
        **鉴权**：公开接口，无需认证。

        刷新访问凭证。
      operationId: aladdin.identity.v1.IdentityService.Refresh
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.RefreshRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.RefreshResponse'
  /aladdin.identity.v1.IdentityService/GetAuthMethods:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: GetAuthMethods
      description: |-
        **鉴权**：公开接口，无需认证。

        返回当前启用的登录方式。前端据此决定渲染哪些登录入口。

         公开是必须的：调用方尚未认证，而这正是它要回答的问题的前提。它之所以
         能公开，是因为返回的内容本来就会出现在浏览器里（客户端标识不是秘密）——
         一个不公开的"有哪些登录方式"不保护任何东西，只会迫使前端硬编码一份
         会漂移的副本。若它将来开始返回需要保护的内容，就必须移出公开清单。
      operationId: aladdin.identity.v1.IdentityService.GetAuthMethods
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetAuthMethodsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetAuthMethodsResponse'
  /aladdin.identity.v1.IdentityService/WhoAmI:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: WhoAmI
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        返回当前凭证对应的主体标识。客户端用它验证凭证是否仍然有效。
      operationId: aladdin.identity.v1.IdentityService.WhoAmI
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.WhoAmIRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.WhoAmIResponse'
  /aladdin.identity.v1.IdentityService/GetSessionPermissions:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: GetSessionPermissions
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        返回当前主体在其可及作用域下展开后的权限码集合。
         这是前端会话权限的唯一来源：前端拿到的是已展开的最终集合，
         因此前端不需要（也不允许）自行实现继承、通配与作用域包含逻辑。
      operationId: aladdin.identity.v1.IdentityService.GetSessionPermissions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetSessionPermissionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetSessionPermissionsResponse'
  /aladdin.identity.v1.IdentityService/BindIdentity:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: BindIdentity
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        把一个登录渠道绑到当前主体上。

         **归属由发起者决定，不由令牌决定。** 令牌只证明"发起者控制着这个身份"，
         因此这里只可能绑到**当前凭证代表的主体**上——不存在"把身份绑到指定主体"
         的形状。若存在，任何持有他人令牌的人都能把身份挂到他人名下。

         该身份已属于另一个主体时拒绝，**不转移、不合并**：转移意味着任何拿到
         该渠道令牌的人都能把别人的进入方式夺走一部分，而这个动作在系统里与一次
         正常绑定没有区别。
      operationId: aladdin.identity.v1.IdentityService.BindIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.BindIdentityRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.BindIdentityResponse'
  /aladdin.identity.v1.IdentityService/UnbindIdentity:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: UnbindIdentity
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        从当前主体上摘掉一个登录渠道。

         同样只作用于当前主体。**不允许摘掉最后一个身份**：那会让这个主体再也
         没有任何进入方式，而它的角色绑定还在，没有人能进来清理。

         摘掉之后该渠道不再通向这个主体，下次用它登录会登记出一个新的、零权限
         的主体——这是预期行为，不是权限丢失，界面必须说明这一点。
      operationId: aladdin.identity.v1.IdentityService.UnbindIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.UnbindIdentityRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.UnbindIdentityResponse'
  /aladdin.identity.v1.IdentityService/ListIdentities:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: ListIdentities
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        列出当前主体已绑定的全部登录渠道。
      operationId: aladdin.identity.v1.IdentityService.ListIdentities
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.ListIdentitiesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.ListIdentitiesResponse'
  /aladdin.profile.v1.ProfileService/GetProfile:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.profile.v1.ProfileService
      summary: GetProfile
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        读取当前主体的档案。
      operationId: aladdin.profile.v1.ProfileService.GetProfile
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.profile.v1.GetProfileRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.profile.v1.GetProfileResponse'
  /aladdin.profile.v1.ProfileService/UpdateProfile:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.profile.v1.ProfileService
      summary: UpdateProfile
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        设置当前主体的昵称与简介。

         请求表达的是**期望的完整状态**，不是一次增量修改：空字符串表示清空
         该项。因为没有"只改一个字段"的形状，也就不需要区分"没传"与"传空"。
      operationId: aladdin.profile.v1.ProfileService.UpdateProfile
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.profile.v1.UpdateProfileRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.profile.v1.UpdateProfileResponse'
  /aladdin.profile.v1.ProfileService/UpdateAvatar:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.profile.v1.ProfileService
      summary: UpdateAvatar
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        上传或替换当前主体的头像。

         **请求里没有"内容类型"这个字段，这是有意的。** 服务端对收到的字节做
         内容嗅探，只接受图片白名单，并以嗅探结果为准。让上传方声明类型等于把
         一个安全属性交给它自证：一段脚本可以顶着 image/png 存进去，之后以一个
         看起来合法的地址被分发。去掉这个字段，也就顺带消掉了"声明与实际不符
         时以谁为准"这个问题。

         一个主体一个对象，替换即原地覆盖。
      operationId: aladdin.profile.v1.ProfileService.UpdateAvatar
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.profile.v1.UpdateAvatarRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.profile.v1.UpdateAvatarResponse'
  /aladdin.profile.v1.ProfileService/DeleteAvatar:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.profile.v1.ProfileService
      summary: DeleteAvatar
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        删除当前主体的头像。没有头像时也成功（幂等）。
      operationId: aladdin.profile.v1.ProfileService.DeleteAvatar
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:

          type: string
          title: change_id
          description: 本次变更的标识，可作为进度查询的键（见 role-model.md 的检查点约定）。
      title: PutRoleResponse
      additionalProperties: false
    aladdin.rbac.v1.PutScopeRequest:
      type: object

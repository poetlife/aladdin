        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.skill.v1.SkillAdminService
      summary: ResyncSkill
      description: |-
        **鉴权**：需要权限 `skill.catalog.write`；作用域取自凭证的默认作用域。

        追远端：解析来源的引用，与已记录的提交比对，有变化则取回、校验、产生新版本
         并切换指针（一个事务）。

         `changed` 为假表示远端没有新提交——此时**不产生版本、不留痕、不动指针**，
         否则"这个技能上次真的更新是什么时候"会变成一个看不出答案的问题。

         失败时当前指针**不动**：校验没过、远端挂了都只是"这一次没同步成功"，对外
         的那一份原样。来源的引用是标签或提交时，同步永远得到"没有变化"——那不是
         缺陷，是这种来源的应有之义。
      operationId: aladdin.skill.v1.SkillAdminService.ResyncSkill
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:

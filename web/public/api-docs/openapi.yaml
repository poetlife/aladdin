      title: GetProfileRequest
      additionalProperties: false
    aladdin.profile.v1.GetProfileResponse:
      type: object
      properties:
        profile:
          allOf:
            - title: profile
            - $ref: '#/components/schemas/aladdin.profile.v1.Profile'
      title: GetProfileResponse
      additionalProperties: false
    aladdin.profile.v1.Profile:
      type: object
      properties:
        nickname:
          type: string
          title: nickname
          description: 主体自己设置的昵称。为空表示未设置——此时 display_name 会回退。
        displayName:
          type: string
          title: display_name
          description: |-
            界面应当显示的名字，由服务端按回退规则算好，客户端**不得**自行拼接。

             规则：昵称非空则用昵称；否则取该主体渠道列表里第一条非空的渠道可读
             标识（如邮箱）；否则用主体标识。回退只有这一处实现——两端各写一份
             必然漂移，表现为页头与服务端日志里这个人叫两个名字。

             它**只用于展示**：不参与判定，也不能被当作身份来查人。
        bio:
          type: string
          title: bio
          description: 简介。为空表示未填写。
        avatarUrl:
          type: string
          title: avatar_url
          description: |-
            头像的**短时有效**预签名读取地址，客户端直接放进 <img src>。

             为空表示"当前没有可显示的头像"：既可能是真的没设，也可能是头像存储
             未启用或暂时取不到地址。

             **这个地址在有效期内谁拿到都能用**，它是一份短期凭证。这正是"头像
             里不得承载任何秘密"这条约束的来源——它本来就是要显示给人看的。
             地址过期后重新调用本服务即可拿到新地址。

             刻意**不给"头像更新时间"**：预签名地址每次生成都不同，缓存失效不需要
             额外的版本字段；而档案行的更新时间是整行的（改昵称也会动它），拿它当
             头像时间会显示一个与头像无关的时间。
        avatarUploadEnabled:
          type: boolean
          title: avatar_upload_enabled
          description: |-
            头像上传功能在当前部署里是否可用（即服务端是否配置了对象存储）。

             为假时客户端**不渲染**上传控件，而不是渲染一个点了报错的按钮——与
             "未配置 Google 客户端标识时不渲染登录入口"同一取向：能力由服务端下发，
             客户端不猜。为假不影响 nickname 与 bio。
        avatarMaxBytes:
          type: integer
          title: avatar_max_bytes
          description: |-
            头像的字节上限。

             它是这条上限的**唯一声明处**：客户端据此在选文件时就早退，免得把一个
             几十 MB 的文件整个传上来只为了被拒。服务端仍然是权威——客户端的这一
             判断只是省一次往返，不是一条安全边界，前端不得把它当成校验。

             取 uint32 而不是 int64：客户端拿到的是一个普通数字，不必为一个几百 KB
             量级的取值去处理大整数。
      title: Profile
      additionalProperties: false
      description: |-
        Profile 是一个主体的展示信息。

         **没有任何一个字段参与判定**，也没有任何一个字段是身份键。它们只影响
         界面上显示什么。
    aladdin.profile.v1.UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          title: nickname
          description: 期望的完整状态。空字符串表示清空该项并回退到展示名的下一条规则。
        bio:
          type: string
          title: bio
          description: 期望的完整状态。空字符串表示清空。
      title: UpdateProfileRequest
      additionalProperties: false
    aladdin.profile.v1.UpdateProfileResponse:
      type: object
      properties:
        profile:
          allOf:
            - title: profile
            - $ref: '#/components/schemas/aladdin.profile.v1.Profile'
      title: UpdateProfileResponse
      additionalProperties: false
      description: |-
        返回更新之后的完整档案，而不是一个"成功"标志。

         客户端刚做过一次会改变现状的操作，让它在同一次往返里拿到新现状，比再多
         发一次查询更省事，也不会读到两次请求之间的中间态。display_name 与
         avatar_url 都按新状态重新计算。
    aladdin.rbac.v1.ScopeSource:
      type: string
      title: ScopeSource
      enum:
        - SCOPE_SOURCE_UNSPECIFIED
        - SCOPE_SOURCE_REQUEST_FIELD
        - SCOPE_SOURCE_METADATA
        - SCOPE_SOURCE_CREDENTIAL
      description: 作用域的解析来源。
    aladdin.rbac.v1.DenialReason:
      type: string
      title: DenialReason
      enum:
        - DENIAL_REASON_UNSPECIFIED
        - DENIAL_REASON_ALLOW
        - DENIAL_REASON_NO_MATCHING_GRANT
        - DENIAL_REASON_SCOPE_MISMATCH
        - DENIAL_REASON_SESSION_EXPIRED
        - DENIAL_REASON_SUBJECT_NOT_FOUND
        - DENIAL_REASON_STORE_UNAVAILABLE
        - DENIAL_REASON_ANNOTATION_MISSING
      description: DenialReason 是一次鉴权结论的固定原因。
    aladdin.rbac.v1.DenialDetail:
      type: object
      properties:
        reason:
          allOf:
            - title: reason
            - $ref: '#/components/schemas/aladdin.rbac.v1.DenialReason'
        detail:
          type: string
          title: detail
          description: |-
            人类可读的补充说明。**客户端不得据此分支**——需要分支的信息
             应当进 reason 或 metadata，而不是靠匹配这句话。
        metadata:
          type: object
          title: metadata
          additionalProperties:
            type: string
            title: value
          description: |-
            结构化补充信息。服务端配置缺陷（注解缺失）时携带
             method / detail 两个键，便于在几秒内定位到是哪个方法漏了声明。
      title: DenialDetail
      additionalProperties: false
      description: |-
        DenialDetail 是附带在 RPC 错误上的结构化拒绝原因。

         它作为 google.protobuf.Any 挂在错误详情里，三端都从同一个
         生成类型读取，不做任何文本匹配。
    aladdin.rbac.v1.DenialDetail.MetadataEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: MetadataEntry
      additionalProperties: false
    aladdin.rbac.v1.AssignRoleRequest:

            包内相对路径。缺失即拒绝（没有"默认取 SKILL.md"这一档：默认值会让一次
             拼错的路径静默地取到另一份东西）。
      title: GetSkillFileRequest
      additionalProperties: false
    aladdin.skill.v1.GetSkillFileResponse:
      type: object
      properties:
        content:
          type: string
          title: content
          format: byte
          description: |-
            文件的文本字节。**平台不写调用方的文件系统**：这是唯一一处把正文交出去的
             地方，落不落盘由调用方决定。
        path:
          type: string
          title: path
          description: 回显这次取的是哪一条，以及它的摘要（供调用方核对）。
        digest:
          type: string
          title: digest
      title: GetSkillFileResponse
      additionalProperties: false
    aladdin.skill.v1.GetSkillRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
      title: GetSkillRequest
      additionalProperties: false
    aladdin.skill.v1.GetSkillResponse:
      type: object
      properties:
        skill:
          allOf:
            - title: skill
            - $ref: '#/components/schemas/aladdin.skill.v1.Skill'
      title: GetSkillResponse
      additionalProperties: false
    aladdin.skill.v1.ImportSkillRequest:
      type: object
      properties:
        repositoryUrl:
          type: string
          title: repository_url
          description: 仓库地址，只接受 https://github.com/<owner>/<repo> 的形状。
        ref:
          type: string
          title: ref
          description: 引用：分支 / 标签 / 提交标识。为空表示仓库的默认分支。
        subPath:
          type: string
          title: sub_path
          description: 包在仓库里的子路径。为空表示仓库根。
        title:
          type: string
          title: title
          description: 可选的说明层初值。留空表示走回退（用 SKILL.md 里的 name / description）。
        summary:
          type: string
          title: summary
        tags:
          type: array
          items:
            type: string
          title: tags
          description: 可选的初始标签。
        coverPath:
          type: string
          title: cover_path
          description: |-
            可选的封面来源：**包内的一条图片路径**（如 `examples/cover.png`）。

             服务端把这一条单独取回来、校验后存成封面。**它不进文件清单**——封面是说明层
             的一项，不是包的内容（见 docs/design/skill/catalog.md 的"封面"）。因此这条
             路径多半正是"被跳过的那类二进制"，那不影响它被取回来当封面。

             取不到、或类型与字节不符时**整次纳管失败**，与别的校验同一条：不留下"技能
             进来了、只是没有封面"这种要人去猜的状态。
      title: ImportSkillRequest
      additionalProperties: false
    aladdin.skill.v1.ImportSkillResponse:
      type: object
      properties:
        skill:
          allOf:
            - title: skill
            - $ref: '#/components/schemas/aladdin.skill.v1.Skill'
      title: ImportSkillResponse
      additionalProperties: false
    aladdin.skill.v1.ListSkillVersionsRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
      title: ListSkillVersionsRequest
      additionalProperties: false
    aladdin.skill.v1.ListSkillVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.skill.v1.SkillVersion'
          title: versions
      title: ListSkillVersionsResponse
      additionalProperties: false
    aladdin.skill.v1.ListSkillsRequest:
      type: object
      properties:
        query:
          type: string
          title: query
          description: |-
            关键词。大小写不敏感的子串匹配，匹配有效标题与有效简介。去首尾空白；
             空表示不筛。
        tags:
          type: array
          items:
            type: string
          title: tags
          description: 标签筛选。多值**取交集**：只列出同时带这些标签的技能。取值会被归一化。
        favoritedOnly:
          type: boolean
          title: favorited_only
          description: 只看当前主体收藏过的。
      title: ListSkillsRequest
      additionalProperties: false
    aladdin.skill.v1.ListSkillsResponse:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.skill.v1.Skill'
          title: skills
        availableTags:
          type: array
          items:
            type: string
          title: available_tags
          description: 整个目录已有的标签（不随当前筛选收窄），供界面给出候选项。
        truncated:
          type: boolean
          title: truncated
          description: 是否因为条数上限而截断。为真时调用方应当用关键词缩小范围。
      title: ListSkillsResponse
      additionalProperties: false
    aladdin.skill.v1.ResyncSkillRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
      title: ResyncSkillRequest
      additionalProperties: false
    aladdin.skill.v1.ResyncSkillResponse:
      type: object
      properties:
        skill:
          allOf:
            - title: skill
            - $ref: '#/components/schemas/aladdin.skill.v1.Skill'
        changed:
          type: boolean
          title: changed
          description: 远端是否有新提交。为假时版本没有变、指针没有动。
      title: ResyncSkillResponse
      additionalProperties: false
    aladdin.skill.v1.SetCurrentSkillVersionRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
        versionId:
          type: string
          title: version_id
          description: 目标版本。必须属于这个技能。
      title: SetCurrentSkillVersionRequest
      additionalProperties: false
    aladdin.skill.v1.SetCurrentSkillVersionResponse:
      type: object
      properties:
        skill:
          allOf:
            - title: skill
            - $ref: '#/components/schemas/aladdin.skill.v1.Skill'
      title: SetCurrentSkillVersionResponse
      additionalProperties: false
    aladdin.skill.v1.SetSkillFavoriteRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
        favorited:
          type: boolean
          title: favorited
          description: 期望的状态：真表示收藏，假表示取消。两个方向都是幂等的。
      title: SetSkillFavoriteRequest
      additionalProperties: false
    aladdin.skill.v1.SetSkillFavoriteResponse:
      type: object
      title: SetSkillFavoriteResponse
      additionalProperties: false
    aladdin.skill.v1.Skill:
      type: object
      properties:
        id:
          type: string
          title: id
          description: 技能标识。由服务端分配、不可猜、不可改、不复用。
        title:
          type: string
          title: title
          description: |-
            **有效标题**：说明层留空时回退到当前版本 SKILL.md 的 name。已经算好，
             客户端不拼。
        summary:
          type: string
          title: summary
          description: '**有效简介**：说明层留空时回退到当前版本 SKILL.md 的 description。'
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            标签。**值已归一化**（trim、小写、去重并升序、长度与数量受限，见
             docs/design/skill/catalog.md）：拿到的是唯一的那一份形式，调用方不必也不得
             自己再归一化或再排序一次。
        favorited:
          type: boolean
          title: favorited
          description: 调用者是否收藏了它。**是调用者自己的状态**，不因别人收藏而变。
        fileCount:
          type: integer
          title: file_count
          description: 当前版本的文件数与字节总数。
        totalBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: total_bytes
        usage:
          allOf:
            - title: usage
              description: |-
                使用量。**只有计数，没有"谁"**：使用明细不是审计数据（见
                 docs/design/skill/catalog.md）。
            - $ref: '#/components/schemas/aladdin.skill.v1.SkillUsage'
        titleOverride:
          type: string
          title: title_override
          description: |-
            说明层的原值。空表示没有覆盖、走回退。

             它与 title / summary 一起给出，是为了让编辑表单既显示"现在叫什么"，也显示
             "清空之后会回到什么"——只给其中一个，编辑界面就只能猜另一个。
        summaryOverride:
          type: string
          title: summary_override
        name:
          type: string
          title: name
          description: 当前版本 SKILL.md 里声明的两项（回退的目标）。
        description:
          type: string
          title: description
          description: |-
            **触发说明**：这个技能什么时候该被用上，取自 SKILL.md 的 description。
             它是 agent 决定要不要用它的唯一依据。
        currentVersionId:
          type: string
          title: current_version_id
          description: 当前版本。
        currentVersionCreatedAt:
          type: string
          title: current_version_created_at
          description: 当前版本产生的时间（即它从远端纳管进来的那一刻）。
        source:
          allOf:
            - title: source
              description: |-
                来源。出现在详情里：**"这份内容是谁写的、从哪一版来的"是一个正当的问题**，
                 而且它让读者能自己去看原仓库。它不参与检索。
            - $ref: '#/components/schemas/aladdin.skill.v1.SkillSource'
        files:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.skill.v1.SkillFile'
          title: files
          description: |-
            当前版本的文件清单（路径 → 字节数 + 内容摘要）。**不含正文**
             （见 GetSkillFile）。
        coverUrl:
          type: string
          title: cover_url
          description: |-
            封面的**短时读取地址**，列表与详情都给。空串表示这个技能没有封面，界面据此
             渲染占位（标题首字 + 中性底），而不是去取一张不存在的图。

             它是**预签名地址**：短时有效，过期后重新读一次就有新的。签名是本地计算、
             不发网络请求，因此列表里 N 条技能不产生 N 次往返。

             **封面不是包的内容**：它属于说明层，不进文件清单、不进版本、不参与取用
             （见 docs/design/skill/catalog.md 的"封面"）。
      title: Skill
      additionalProperties: false
      description: |-
        Skill 是目录里的一条技能。

         **列表只填前八项。** 说明层原值、当前版本信息、来源与文件清单只在详情里给出
         （GetSkill）——列表会读很多行，把清单挂上来是一笔与列表无关的代价。
    aladdin.skill.v1.SkillCapabilities:
      type: object
      properties:
        catalogEnabled:
          type: boolean
          title: catalog_enabled
          description: |-
            是否可用目录。为假表示这个部署没有配置对象存储——技能的字节没有地方放，
             检索与取用都不可用（与 galaxy 的资产同一条降级取向）。
        importEnabled:
          type: boolean
          title: import_enabled
          description: 是否可纳管。它比目录更严一层：还要有可用的远端拉取。
        maxFiles:
          type: integer
          title: max_files
          description: 一个技能包的文件数上限。
        maxFileBytes:
          type: integer
          title: max_file_bytes
          description: 单个文件的字节上限。
        maxPackageBytes:
          type: integer
          title: max_package_bytes
          description: 一个包的字节总数上限。
      title: SkillCapabilities
      additionalProperties: false
      description: SkillCapabilities 是当前部署下技能目录的边界。
    aladdin.skill.v1.SkillFile:
      type: object
      properties:
        path:
          type: string
          title: path
          description: 包内相对路径。
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
        digest:
          type: string
          title: digest
          description: |-
            内容摘要。**同一份字节在目录里只有一个对象**，因此两个技能里内容相同的
             文件有同一个摘要。
      title: SkillFile
      additionalProperties: false
      description: SkillFile 是当前版本里的一条文件。
    aladdin.skill.v1.SkillSource:
      type: object
      properties:
        repositoryUrl:
          type: string
          title: repository_url
          description: |-
            仓库地址，形如 https://github.com/<owner>/<repo>。原样回显调用方纳管时给的
             那个形状（去掉结尾的 `/` 与 `.git`）。
        ref:
          type: string
          title: ref
          description: 引用：分支 / 标签 / 提交标识。为空表示用的是仓库的默认分支。
        subPath:
          type: string
          title: sub_path
          description: 包在仓库里的子路径。为空表示仓库根。
        commit:
          type: string
          title: commit
          description: 当前版本对应的提交标识。它是"这个技能上次真的更新到哪"的唯一答案。
      title: SkillSource
      additionalProperties: false
      description: |-
        SkillSource 是一个技能的内容从哪来。

         它在纳管之后**不可改**：换来源要重新纳管。
    aladdin.skill.v1.SkillUsage:
      type: object
      properties:
        useDays:
          type: integer
          title: use_days
          description: |-
            窗口内有多少个人日用过它（同一个人在同一天算一次）。

             **字段名里不带窗口长度**：窗口是一个常量（30 天），把它写进字段名会让"换一个
             窗口"变成一次破坏性改名，而它本来只是换一个取值。
        userCount:
          type: integer
          title: user_count
          description: 窗口内去重之后的主体数。
        lastUsedAt:
          type: string
          title: last_used_at
          description: 最近一次使用的时间。从未被取用时为空。
      title: SkillUsage
      additionalProperties: false
      description: |-
        SkillUsage 是一个技能的使用量（最近 30 天）。

         **按"人日"计，不按次数计**：一次取用通常连着取好几个文件，按次记的数字主要
         由"这个包有几个文件"决定，与"有没有人在用"无关。按人日记还有一条它没有的
         性质——**它有天然上界**：一个主体对一个技能一天最多贡献 1。
    aladdin.skill.v1.SkillVersion:
      type: object
      properties:
        id:
          type: string
          title: id
        commit:
          type: string
          title: commit
          description: 这一份快照取自哪个提交。
        fileCount:
          type: integer
          title: file_count
        totalBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: total_bytes
        createdAt:
          type: string
          title: created_at
        current:
          type: boolean
          title: current
          description: 是否当前对外服务的那一份。
        skippedFiles:
          type: integer
          title: skipped_files
          description: |-
            **上游有、而平台没收**的条目数。

             平台只分发文本，因此真实仓库里那些示例图一类的东西不进包。这个计数让"平台
             里的包比上游少几个文件"成为一件看得见的事——静默地少才是问题（见
             docs/design/skill/onboarding.md 的"收得下的文件"）。
      title: SkillVersion
      additionalProperties: false
      description: SkillVersion 是一个技能的一份不可变快照。
    aladdin.skill.v1.UpdateSkillMetadataRequest:
      type: object
      properties:
        skillId:
          type: string
          title: skill_id
        title:
          type: string
          title: title
          description: 空串表示清空（回到回退值）。
        summary:
          type: string
          title: summary
        tags:
          type: array
          items:
            type: string
          title: tags
          description: 标签以请求集合**整体替换**，空表示去掉全部标签。
      title: UpdateSkillMetadataRequest
      additionalProperties: false
    aladdin.skill.v1.UpdateSkillMetadataResponse:
      type: object
      properties:
        skill:
          allOf:
            - title: skill
            - $ref: '#/components/schemas/aladdin.skill.v1.Skill'
      title: UpdateSkillMetadataResponse
      additionalProperties: false
    aladdin.telemetry.v1.Action:
      type: string
      title: Action
      enum:
        - ACTION_UNSPECIFIED
        - ACTION_AUTH_LOGIN
        - ACTION_PROJECT_LIST_OPEN
        - ACTION_EDITOR_OPEN
        - ACTION_DRAFT_SAVE
        - ACTION_PUBLISH
        - ACTION_UNPUBLISH
        - ACTION_PROJECT_DELETE
        - ACTION_PREVIEW_TOGGLE
        - ACTION_PREVIEW_OPEN
        - ACTION_ASSETS_OPEN
        - ACTION_VERSIONS_OPEN
        - ACTION_ASSET_META_SAVE
        - ACTION_ASSET_UPLOAD
        - ACTION_CLI_LOCAL_FAIL
      description: |-
        Action 是**动作允许清单**。清单之外的动作一律丢弃。

         允许清单常驻在此处（而不是各端各写一份字符串常量），有三个直接好处：两端
         的动作码由同一次 `buf generate` 派生，不可能拼错或漂移；服务端校验只需比对
         生成常量，不必维护第二张表；新增一个动作必须改 proto 并重新生成，这本身就是
         "无清单内的动作不记"这条约束的执行方式。

         每个动作的**允许匿名**标记不在这里（enum 值带不了策略），在服务端的动作表里：
         internal/telemetry/actions.go。
    aladdin.telemetry.v1.Client:
      type: string
      title: Client
      enum:
        - CLIENT_UNSPECIFIED
        - CLIENT_WEB
        - CLIENT_CLI
      description: |-
        Client 是上报端的标识，与每个出站请求携带的 `x-aladdin-client` 头同源。

         它同时出现在两处，各有用途：请求留痕的 `client` 字段回答"这次 RPC 是谁发的"，
         事件的 `client` 字段回答"这条本地动作是谁报的"。两处取值必须一致，由两端各自
         引用同一份常量保证（见 docs/observability.md）。
    aladdin.telemetry.v1.Result:
      type: string
      title: Result
      enum:
        - RESULT_UNSPECIFIED
        - RESULT_OK
        - RESULT_FAIL
        - RESULT_CANCEL
        - RESULT_BLOCKED
      description: |-
        Result 是一条动作的结局。四个取值互斥，且必须能区分"失败"与"被拦下"：
         前者是动作执行了但没成功，后者是动作根本没被执行——两者的修复方向完全不同。
    aladdin.telemetry.v1.Surface:
      type: string
      title: Surface
      enum:
        - SURFACE_UNSPECIFIED
        - SURFACE_WEB_AUTH
        - SURFACE_WEB_PROJECT_LIST
        - SURFACE_WEB_EDITOR
        - SURFACE_WEB_PREVIEW
        - SURFACE_CLI
      description: |-
        Surface 是一条事件发生在哪个界面/入口上（粗粒度）。

         它与 Action 是两个维度：Surface 回答"在哪"，Action 回答"做了什么"。两者都
         是有界枚举——高基数的取值（页面路径、工程标识）会随时间增长，不允许进入。
    aladdin.telemetry.v1.Event:
      type: object
      properties:
        client:
          allOf:
            - title: client
              description: 上报端。取值必须与本次请求携带的 `x-aladdin-client` 一致。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Client'
        surface:
          allOf:
            - title: surface
              description: 发生在哪个界面。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Surface'
        action:
          allOf:
            - title: action
              description: 做了什么。必须在 Action 允许清单内，否则本条被丢弃。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Action'
        result:
          allOf:
            - title: result
              description: 结局。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Result'
        durationMs:
          type: integer
          title: duration_ms
          description: |-
            耗时（毫秒）。0 表示未提供——proto3 无法区分"未提供"与"恰好 0 毫秒"，
             因此 0 一律按未提供处理。上限由服务端在落盘前收敛。
        traceId:
          type: string
          title: trace_id
          description: |-
            若当时已有链路，带上它以便与 RPC 留痕关联。

             服务端校验形状（32 位小写十六进制），不合规按未提供处理——一个格式非法的
             trace_id 写进日志会破坏所有基于它的检索（同 docs/observability.md 对入站
             traceparent 的校验）。
        attrs:
          type: object
          title: attrs
          additionalProperties:
            type: string
            title: value
          description: |-
            结构化补充信息。**白名单键**，只有服务端登记过的键会保留，取值也必须落在
             该键的取值域内；其余一律剥除。禁止自由文本（见 docs/observability.md）。
      title: Event
      additionalProperties: false
      description: |-
        Event 是一条客户端事件。

         字段全部有界：没有自由文本，没有任何"用户输入"。需要区分"哪一次"时带
         trace_id；需要区分"哪个主体"时由服务端从会话得出，不由请求提供。
    aladdin.telemetry.v1.Event.AttrsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttrsEntry
      additionalProperties: false
    aladdin.telemetry.v1.ReportEventsRequest:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.telemetry.v1.Event'
          title: events
          description: 事件列表。空列表合法（此时什么也不做），服务端仍受调用次数限流约束。
      title: ReportEventsRequest
      additionalProperties: false
      description: |-
        ReportEventsRequest 是一批事件。

         批量而不是一次一条：切预览、开弹层这类 UI 动作会连发，一条一次 RPC 会把请求量
         与弱网失败率一起放大（issue 的补充说明）。单条只是本请求长度为 1 的特例，
         因此不为它另留一个方法。
    aladdin.telemetry.v1.ReportEventsResponse:
      type: object
      title: ReportEventsResponse
      additionalProperties: false
      description: |-
        ReportEventsResponse 刻意为空。

         服务端丢弃一条事件（未知动作、不允许匿名、超限、属性不合规）时**不报错**：
         遥测的数据问题绝不能升级成客户端的业务错误，否则一次清单不一致就会让前端
         弹框、CLI 非零退出。丢弃与否由服务端日志回答，客户端只看得到"这一批被收到了"。
    aladdin.telemetry.v1.TimeWindow:
      type: string
      title: TimeWindow
      enum:
        - TIME_WINDOW_UNSPECIFIED
        - TIME_WINDOW_TODAY
        - TIME_WINDOW_LAST_7_DAYS
        - TIME_WINDOW_LAST_30_DAYS
      description: |-
        TimeWindow 是允许选择的观察窗口。**枚举而不是时间戳对**：有界取值让服务端不必
         校验"这个时间范围是不是过大"，也不会出现"前端算出的 from/to 与服务端的时钟差
         一点点"这类无从对账的偏差。

         三个窗口都以**服务端收到请求的那一刻**为锚：

           - TODAY：服务器本地时区当日零点到此刻；
           - LAST_7_DAYS / LAST_30_DAYS：此刻往前 7 / 30 个 24 小时。

         区间一律是半开的 `[from, to)`。事件保留 30 天（回收比窗口多留一天，见
         docs/observability.md），因此 LAST_30_DAYS 是能被完整回答的最长窗口。
    aladdin.telemetry.v1.EventStat:
      type: object
      properties:
        client:
          allOf:
            - title: client
              description: 上报端。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Client'
        action:
          type: string
          title: action
          description: |-
            动作名。取值来自写侧的动作允许清单（internal/telemetry 的动作表）。

             类型是 string 而不是 Action 枚举：动作清单会随业务扩展，而计数行是**历史
             数据**——用枚举会让"昨天记下的动作"在清单变更后变成一个无法表示的值。
             服务端保证它只会是清单内的名字。
        result:
          allOf:
            - title: result
              description: 结局。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Result'
        count:
          oneOf:
            - type: integer
              title: integer
              format: int64
            - type: string
              title: string
          title: count
          description: 该组合在窗口内的条数。
      title: EventStat
      additionalProperties: false
      description: EventStat 是一个分组维度的计数。
    aladdin.telemetry.v1.ListEventStatsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: |-
            **只用于鉴权**：判断调用方有没有在这个范围上读遥测的权限。

             事件没有归属范围（它是端上的动作，不是某个人或某个范围的资源），因此这个
             字段**不过滤结果**——与 ListRoles 的 scope 同理（见 rbac.proto）。同一主体在
             任意有读权限的范围上调用，拿到的都是同一份计数；变化的是"还能不能读"。
        window:
          allOf:
            - title: window
              description: 观察窗口。TIME_WINDOW_UNSPECIFIED 不是合法取值，会被拒绝。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.TimeWindow'
      title: ListEventStatsRequest
      additionalProperties: false
      description: ListEventStatsRequest 是一次计数查询。
    aladdin.telemetry.v1.ListEventStatsResponse:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.telemetry.v1.EventStat'
          title: stats
          description: |-
            每条是一个 (client, action, result) 组合的计数。**只返回出现过的组合**，
             计数为零的组合不占一行。
      title: ListEventStatsResponse
      additionalProperties: false
      description: ListEventStatsResponse 是分组计数结果。
    aladdin.telemetry.v1.ListRecentEventsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 只用于鉴权，不过滤结果（同 ListEventStatsRequest.scope）。
        window:
          allOf:
            - title: window
              description: 观察窗口。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.TimeWindow'
        limit:
          type: integer
          title: limit
          description: 条数上限。0 表示用服务端默认值；超过服务端上限时按上限处理。
      title: ListRecentEventsRequest
      additionalProperties: false
      description: ListRecentEventsRequest 是一次明细查询。
    aladdin.telemetry.v1.ListRecentEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.telemetry.v1.RecentEvent'
          title: events
          description: 按发生时间**从新到旧**排列。
      title: ListRecentEventsResponse
      additionalProperties: false
      description: ListRecentEventsResponse 是最新的一页明细。
    aladdin.telemetry.v1.RecentEvent:
      type: object
      properties:
        occurredAt:
          type: string
          title: occurred_at
          description: 发生时间，RFC3339（UTC）。由服务端盖章，不由上报端提供。
        client:
          allOf:
            - title: client
              description: 上报端。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Client'
        surface:
          allOf:
            - title: surface
              description: 发生在哪个界面/入口。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Surface'
        action:
          type: string
          title: action
          description: 动作名（取值语义同 EventStat.action）。
        result:
          allOf:
            - title: result
              description: 结局。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Result'
        durationMs:
          type: integer
          title: duration_ms
          description: 耗时（毫秒）。0 表示上报端未提供。
        clientTraceId:
          type: string
          title: client_trace_id
          description: 上报端当时所在链路的 trace_id；空表示未提供。
        subjectId:
          type: string
          title: subject_id
          description: 事件所属主体；空表示匿名（只有允许匿名的动作会是空）。
        attrs:
          type: object
          title: attrs
          additionalProperties:
            type: string
            title: value
          description: 白名单属性，键与取值都在服务端登记过（同写侧）。
      title: RecentEvent
      additionalProperties: false
      description: RecentEvent 是一条事件的明细，字段与写侧落盘的日志字段一一对应。
    aladdin.telemetry.v1.RecentEvent.AttrsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttrsEntry
      additionalProperties: false
tags:
  - name: aladdin.events.v1.EventsService
    description: |-
      EventsService 是**连接级**的事件通道：一条服务端流承载所有主题。

       它回答的问题只有一个：**"某个资源变了，怎么通知到别的客户端。"** 它不认识
       任何具体业务——哪个资源可订阅、订阅它要什么权限、谁算这个资源的属主，全部由
       属主模块注册（见 docs/design/events/README.md 的"主题"一节）。

       三条设计要点，缺一条这个形状就不成立：

         - **一条连接、多个主题。** 下一个要推送的业务只加主题，不再各开一条流、
           各写一遍重连与退避。订阅集合变了就重开一条——连接内改订阅要双向流，而
           双向流要求端到端 HTTP/2，本仓库的部署形态给不了（见设计文档的"为什么不做
           双向流"）。
         - **事件不含内容**：只有"哪个主题"与"是不是控制事件"。收到之后由调用方自己
           去读现状（各业务既有的 unary 入口）。因此事件的大小与资源的内容体积无关，
           也不会过期。**也没有"变了什么"**：客户端要做的事与类别无关，而一旦留下它，
           共享的信封里就要长出各业务的词表。
         - **事件是提示，不是事实。** 交付语义是至多一次、不重放：没收到的事件不会补，
           而正确性不依赖收到任何一条——**订阅成功后的第一条必定是该主题的 RESYNC**，
           任何一次（重）连接之后都必然有一次全量重拉；缓冲满时服务端**结束这条流**
           （而不是静默丢弃），调用方因此会重连、也就必然会重拉。

       由此得到唯一的客户端契约：**收到任何事件、以及任何一次（重）连接成功之后，
       都重拉一次受影响的主题。**

       鉴权：**开流只要已认证，权限是逐主题的**——需要哪个权限取决于请求里订的是哪条
       主题，而那是数据，方法注解表达不了。这是对"权限声明写在方法注解上"那条硬性
       约定的一处刻意例外，边界与代价写在设计文档里；逐主题的权限码仍然取自权限目录，
       判定仍然只有 rbac.Engine 一处实现。
  - name: aladdin.galaxy.v1.GalaxyService
    description: |-
      GalaxyService 是创作面：用户放下一组具名文件与素材，然后把它发布成一个
       别人能打开的站点。

       边界：它不回答"你是谁"（认证）也不回答"你能做什么"（RBAC）。**两把闸门
       各管一件事**：`galaxy.*` 权限码决定这个主体有没有资格创作，工程的拥有者
       决定他能不能碰这一个工程。后者不由 RBAC 表达，也不在本服务的请求里出现
       ——**接口面上没有"指定拥有者"这个形状**，拥有者由凭证决定。

       **"不是你的"与"不存在"返回同一个结论。** 区分它们等于提供一个工程枚举
       接口：拿着别人的工程标识反复调用，"不存在"与"无权访问"的差集就能把一个
       不可猜标识试出来。而工程标识是发布地址的一部分，猜出它就能看到别人的
       页面（见 docs/design/galaxy/project-versioning.md）。

       作用域从**凭证绑定的默认作用域**解析：请求里没有作用域字段，也不该有
       ——工程是资源归属的载体，不是作用域的载体。
  - name: aladdin.identity.v1.IdentityService
    description: |-
      IdentityService 是身份认证面。

       边界：本服务只做认证（你是谁）。判定（你能做什么）由 RBAC 负责。
       认证失败与鉴权失败必须返回不同的状态码，见 grpc-interceptor.md 的拒绝语义。
  - name: aladdin.profile.v1.ProfileService
    description: |-
      ProfileService 是个人档案面：主体自己的展示信息（昵称、简介、头像）。

       边界：它回答"这个主体叫什么、长什么样"，既不回答"你是谁"（认证，
       见 IdentityService），也不回答"你能做什么"（RBAC）。**档案不参与
       任何一次判定**，也不是一条身份路径——不能按昵称查人，昵称也不唯一。

       **每个方法都只作用于调用者自己。** 接口面上刻意不存在任何带目标主体
       标识的方法：归属由凭证决定，不由请求里的字段决定。由此得到的结论是
       准入门槛为"已认证"而非某个权限码——不存在以他人为目标的形状，也就
       不存在可被滥用的授权面。

       若将来要加"管理员查看或编辑他人档案"，那是一个以他人为目标的动作，
       必须带权限码，并且**不得**与本服务的自服务方法混在一个入口里。
  - name: aladdin.rbac.v1.RBACService
    description: |-
      RBACService 是权限体系的管理面。

       注意：本服务只负责**管理**角色与授权关系，不负责判定。
       判定发生在每个业务方法的入口（由鉴权拦截器统一执行），
       因此本服务自身的方法同样受注解约束。
  - name: aladdin.skill.v1.SkillService
    description: |-
      SkillService 是**技能目录的读面**：找到技能、看清它是什么、把正文取走。

       边界：它不回答"你是谁"（认证）也不回答"你能做什么"（RBAC）。**目录是部署级
       的**——技能不属于任何主体，因此这里没有第二把闸门（与 galaxy 正相反：那边
       每一个方法都以"调用者自己的工程"为目标，归属要单独判一次）。谁能看见目录、
       谁不能，全部由 `skill.catalog.read` 表达。

       **平台从不写调用方的文件系统。** 这条在接口上的表现是：没有任何一条方法要求
       一个落点，取正文的那一条只把字节放在响应里（见
       docs/design/skill/agent-access.md）。装了本地副本之后真相源就有两份，而分叉的
       表现不是报错，是"同一条指令在两台机器上得到不同的结果"。
  - name: aladdin.skill.v1.SkillAdminService
    description: |-
      SkillAdminService 是**技能目录的维护面**：从远端纳管、同步、回滚、改说明层、
       删除。

       它与 SkillService 是一件事的两侧，因此拆成两个服务而不是塞进一个：两侧的准入
       条件不同（读是 `skill.catalog.read`，写是 `skill.catalog.write`），写在同一份
       接口里会让"这个服务要不要认证"变成一个需要逐方法去看的问题——那正是注解漏写
       的温床。这与 TelemetryService / TelemetryAdminService 的拆分同源。

       **接口面上没有"改来源"这个方法。** 换仓库、换引用、换子路径都要重新纳管，得到
       一个新的技能：一个技能的历次版本被要求是**同一条来源的不同时间点**，否则
       "回滚"就变成"切到另一个东西的某个版本"（见 docs/design/skill/onboarding.md）。
  - name: aladdin.telemetry.v1.TelemetryService
    description: |-
      TelemetryService 接收**客户端事件**：那些不经过任何 RPC 的本地动作
       （前端拦截、切换预览、本地校验失败、未登录就退出……）。

       它存在的唯一理由，是服务端的请求留痕**看不见没有出站的操作**。只把 RPC
       留痕补全，回答得了"服务端处理了什么"，回答不了"用户想做什么、在哪一步被
       拦住"。本服务补的就是这一层。

       两条边界，写死在这里：

         - **它不是产品分析**。事件只有有界枚举与结果码，没有点击坐标、停留时长、
           页面路径，也没有草稿正文、凭证、本地路径——见 docs/observability.md 的
           「客户端事件」。需要那种粒度的分析，是另一件事。
         - **它不替代请求留痕**。已经打到服务端的 RPC 由服务端中间件记一行（含
           trace_id 与 client），客户端**不重复上报**成功的 RPC；重复只发生在
           "前端拦下、请求根本没发出去"的那些动作上。

       归属：它是**基础设施**，不属于任何业务模块（与 EventsService 同理）。下一个
       要记动作的业务只往动作清单里加一项，不新建服务。
  - name: aladdin.telemetry.v1.TelemetryAdminService
    description: |-
      TelemetryAdminService 是客户端事件的**只读管理面**。

       它与 TelemetryService 是一件事的两侧，因此拆成两个服务而不是塞进一个：

         - TelemetryService 是**公开的写侧**（登录页失败、命令行未登录退出都发生在
           拿到会话之前，要求先认证才能上报是循环依赖），任何人都能调用；
         - 本服务是**受控的读侧**，只有持有 `telemetry.read` 的主体能调用。

       两者的准入条件正相反，写在同一份接口里会让"这个服务要不要认证"变成一个需要
       逐方法去看的问题——那正是注解漏写的温床。

       两条边界同样写死在这里：

         - **读侧不放大字段面**。返回的都是写侧已经脱敏后的字段（有界枚举、服务端从
           会话得出的主体标识、校验过的 trace_id、白名单属性），没有请求体、没有自由
           文本。读侧能看见的东西不会比写侧落盘的多。
         - **它不是第二套观测平台**。查询参数有界——时间窗是一个枚举，条数有上限，
           没有任意过滤表达式。需要那种能力的分析走外部日志系统（见
           docs/observability.md）。

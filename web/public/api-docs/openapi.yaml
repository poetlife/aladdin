            上传方声明的类型。服务端只校验它在白名单内——白名单里没有任何可执行类型，
             而这正是这套链路能成立的原因。
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: 上传方声明的字节数。服务端按它早退（省一次白传），真正的边界由存储侧执行。
      title: BeginSkillCoverUploadRequest
      additionalProperties: false

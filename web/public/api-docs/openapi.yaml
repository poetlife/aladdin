        id:
          type: string
          title: id
          description: 角色标识。一经发布不可更改；标识变更等同于"删除旧角色 + 新建角色"。
        displayName:
          type: string
          title: display_name
          description: 展示名，可修改。
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: 角色直接持有的权限码，取值必须存在于权限目录中。
        inherits:
          type: array
          items:
            type: string
          title: inherits
          description: 被继承的角色标识。
        mutuallyExclusiveWith:
          type: array
          items:
            type: string
          title: mutually_exclusive_with
          description: 静态互斥（SSD）的角色标识：不可与这些角色同时授予同一主体。
        builtin:
          type: boolean
          title: builtin
          description: 是否内置角色。内置角色不可删除，且权限范围不可修改。
      title: Role
      additionalProperties: false
    aladdin.rbac.v1.RoleBinding:
      type: object
      properties:
        subjectId:
          type: string
          title: subject_id
        roleId:
          type: string
          title: role_id
        scope:
          type: string
          title: scope
      title: RoleBinding
      additionalProperties: false
    aladdin.rbac.v1.Scope:
      type: object
      properties:
        path:
          type: string
          title: path
        displayName:
          type: string
          title: display_name
      title: Scope
      additionalProperties: false
      description: |-
        Scope 是一个已登记的范围。

         路径是标识（也是判定的输入），**一经登记不可更改**——与角色标识同构；
         "改路径"因此不是改名，而是"删掉旧范围 + 新建一个"。
         显示名只用于展示，可改，且不参与判定、不参与匹配。

         全局（根）不是一条登记记录：它永远可用、不可创建也不可删除。

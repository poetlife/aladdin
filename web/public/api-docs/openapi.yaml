          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.profile.v1.DeleteAvatarRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.profile.v1.DeleteAvatarResponse'
  /aladdin.rbac.v1.RBACService/GetRole:

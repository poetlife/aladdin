openapi: 3.1.0
info:
  title: aladdin.rbac.v1
paths:
  /aladdin.rbac.v1.RBACService/GetRole:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.role.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: GetRole
      description: |-
        **鉴权**：需要权限 `rbac.role.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取角色定义。
      operationId: aladdin.rbac.v1.RBACService.GetRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.GetRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.GetRoleResponse'
  /aladdin.rbac.v1.RBACService/ListRoles:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.role.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: ListRoles
      description: |-
        **鉴权**：需要权限 `rbac.role.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出角色定义全集。

         请求里的 scope **只用于鉴权**（判断调用方有没有在该范围读角色的权限），
         **不用于过滤结果**：角色定义没有归属范围，全库只有一份。因此同一主体
         在任意有读权限的范围上调用，拿到的都是同一个列表——切换管理范围不会
         让这个列表变化，变化的是"还能不能读"。
      operationId: aladdin.rbac.v1.RBACService.ListRoles
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.ListRolesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.ListRolesResponse'
  /aladdin.rbac.v1.RBACService/PutRole:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.role.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: PutRole
      description: |-
        **鉴权**：需要权限 `rbac.role.write`；作用域取自请求字段。

        创建或更新角色。属于不可逆操作，调用方需二次确认。
      operationId: aladdin.rbac.v1.RBACService.PutRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.PutRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.PutRoleResponse'
  /aladdin.rbac.v1.RBACService/DeleteRole:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.role.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: DeleteRole
      description: |-
        **鉴权**：需要权限 `rbac.role.write`；作用域取自请求字段。

        删除角色。不可逆。
      operationId: aladdin.rbac.v1.RBACService.DeleteRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.DeleteRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.DeleteRoleResponse'
  /aladdin.rbac.v1.RBACService/AssignRole:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.subject.assign
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: AssignRole
      description: |-
        **鉴权**：需要权限 `rbac.subject.assign`；作用域取自请求字段。

        为主体授予或回收角色。
      operationId: aladdin.rbac.v1.RBACService.AssignRole
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.AssignRoleRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.AssignRoleResponse'
  /aladdin.rbac.v1.RBACService/ListSubjectBindings:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.subject.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: ListSubjectBindings
      description: |-
        **鉴权**：需要权限 `rbac.subject.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出某个主体持有的角色绑定。
      operationId: aladdin.rbac.v1.RBACService.ListSubjectBindings
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.ListSubjectBindingsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.ListSubjectBindingsResponse'
  /aladdin.rbac.v1.RBACService/ListScopes:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.scope.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: ListScopes
      description: |-
        **鉴权**：需要权限 `rbac.scope.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出已登记的范围（全局不在其中：它是模型的根，不是一条登记记录）。

         请求里的 scope 只用于鉴权，与结果无关：范围目录是部署级的，不按范围过滤。
      operationId: aladdin.rbac.v1.RBACService.ListScopes
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.ListScopesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.ListScopesResponse'
  /aladdin.rbac.v1.RBACService/PutScope:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.scope.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: PutScope
      description: |-
        **鉴权**：需要权限 `rbac.scope.write`；作用域取自请求字段。

        登记一个范围，或改它的显示名。

         路径是标识，**不可更改**；登记一个已存在的路径等同于改显示名
         （与重复授予同一角色是幂等的重复写入同理）。
      operationId: aladdin.rbac.v1.RBACService.PutScope
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.PutScopeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.PutScopeResponse'
  /aladdin.rbac.v1.RBACService/DeleteScope:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.scope.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: DeleteScope
      description: |-
        **鉴权**：需要权限 `rbac.scope.write`；作用域取自请求字段。

        删除一个范围。不可逆。

         范围内或其后代上仍有角色绑定时拒绝——与"删除仍被持有的角色"同构：
         引用还在，就不允许把被引用的东西抽走。
      operationId: aladdin.rbac.v1.RBACService.DeleteScope
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.DeleteScopeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.DeleteScopeResponse'
  /aladdin.rbac.v1.RBACService/PublishPolicy:
    post:
      x-aladdin-auth:
        kind: requires
        permission: rbac.policy.publish
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.rbac.v1.RBACService
      summary: PublishPolicy
      description: |-
        **鉴权**：需要权限 `rbac.policy.publish`；作用域取自请求字段。

        使一次角色变更正式生效（缓存失效 + 生效确认）。
         对应 docs/design/rbac/role-model.md 的"生效确认"阶段。
      operationId: aladdin.rbac.v1.RBACService.PublishPolicy
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.rbac.v1.PublishPolicyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.rbac.v1.PublishPolicyResponse'
components:
  schemas:
    aladdin.rbac.v1.AssignRoleRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        subjectId:
          type: string
          title: subject_id
          description: 目标主体标识。
        roleId:
          type: string
          title: role_id
        grant:
          type: boolean
          title: grant
          description: true 为授予，false 为回收。
      title: AssignRoleRequest
      additionalProperties: false
      description: |-
        AssignRole 的目标范围必须是**已登记**的范围（全局除外，它是模型的根）。
         这条校验只在授予侧做：回收永远要能做，哪怕目标范围已经不在目录里。
    aladdin.rbac.v1.AssignRoleResponse:
      type: object
      properties:
        changeId:
          type: string
          title: change_id
      title: AssignRoleResponse
      additionalProperties: false
    aladdin.rbac.v1.DeleteRoleRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        roleId:
          type: string
          title: role_id
      title: DeleteRoleRequest
      additionalProperties: false
    aladdin.rbac.v1.DeleteRoleResponse:
      type: object
      properties:
        changeId:
          type: string
          title: change_id
      title: DeleteRoleResponse
      additionalProperties: false
    aladdin.rbac.v1.DeleteScopeRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 请求在哪个范围上删除。仅用于鉴权。
        path:
          type: string
          title: path
          description: 要删除的范围路径。
      title: DeleteScopeRequest
      additionalProperties: false
    aladdin.rbac.v1.DeleteScopeResponse:
      type: object
      title: DeleteScopeResponse
      additionalProperties: false
    aladdin.rbac.v1.GetRoleRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        roleId:
          type: string
          title: role_id
      title: GetRoleRequest
      additionalProperties: false
    aladdin.rbac.v1.GetRoleResponse:
      type: object
      properties:
        role:
          allOf:
            - title: role
            - $ref: '#/components/schemas/aladdin.rbac.v1.Role'
      title: GetRoleResponse
      additionalProperties: false
    aladdin.rbac.v1.ListRolesRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 请求在哪个范围上读角色。仅用于鉴权，不过滤结果——角色定义是全局的。
      title: ListRolesRequest
      additionalProperties: false
    aladdin.rbac.v1.ListRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.rbac.v1.Role'
          title: roles
      title: ListRolesResponse
      additionalProperties: false
    aladdin.rbac.v1.ListScopesRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 请求在哪个范围上读目录。仅用于鉴权，不过滤结果。
      title: ListScopesRequest
      additionalProperties: false
    aladdin.rbac.v1.ListScopesResponse:
      type: object
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.rbac.v1.Scope'
          title: scopes
      title: ListScopesResponse
      additionalProperties: false
    aladdin.rbac.v1.ListSubjectBindingsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: |-
            请求在哪个范围上读绑定。用于鉴权，并作为展开 effective_permissions 的范围；
             返回的 bindings **不按范围过滤**——主体在其它范围上的绑定同样会列出来，
             否则"他在别处还持有什么"就看不到了。
        subjectId:
          type: string
          title: subject_id
      title: ListSubjectBindingsRequest
      additionalProperties: false
    aladdin.rbac.v1.ListSubjectBindingsResponse:
      type: object
      properties:
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.rbac.v1.RoleBinding'
          title: bindings
        effectivePermissions:
          type: array
          items:
            type: string
          title: effective_permissions
          description: 展开后的最终权限码集合。前端会话权限即来源于此（见 frontend-permissions.md）。
      title: ListSubjectBindingsResponse
      additionalProperties: false
    aladdin.rbac.v1.PublishPolicyRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        changeId:
          type: string
          title: change_id
          description: 要发布的变更标识。留空表示发布该作用域下全部未发布的变更。
      title: PublishPolicyRequest
      additionalProperties: false
    aladdin.rbac.v1.PublishPolicyResponse:
      type: object
      properties:
        changeId:
          type: string
          title: change_id
        invalidatedEntries:
          type: integer
          title: invalidated_entries
          format: int32
          description: 实际失效的缓存条目数，用于外部确认"缓存失效"阶段已完成。
      title: PublishPolicyResponse
      additionalProperties: false
    aladdin.rbac.v1.PutRoleRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        role:
          allOf:
            - title: role
            - $ref: '#/components/schemas/aladdin.rbac.v1.Role'
      title: PutRoleRequest
      additionalProperties: false
    aladdin.rbac.v1.PutRoleResponse:
      type: object
      properties:
        role:
          allOf:
            - title: role
            - $ref: '#/components/schemas/aladdin.rbac.v1.Role'
        changeId:
          type: string
          title: change_id
          description: 本次变更的标识，可作为进度查询的键（见 role-model.md 的检查点约定）。
      title: PutRoleResponse
      additionalProperties: false
    aladdin.rbac.v1.PutScopeRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 请求在哪个范围上登记。仅用于鉴权。
        path:
          type: string
          title: path
          description: 要登记（或改显示名）的路径。路径为空表示全局，而全局不可登记，因此会被拒绝。
        displayName:
          type: string
          title: display_name
          description: 展示名。留空则界面回落到显示路径本身。
      title: PutScopeRequest
      additionalProperties: false
    aladdin.rbac.v1.PutScopeResponse:
      type: object
      properties:
        scope:
          allOf:
            - title: scope
            - $ref: '#/components/schemas/aladdin.rbac.v1.Scope'
      title: PutScopeResponse
      additionalProperties: false
    aladdin.rbac.v1.Role:
      type: object
      properties:
        id:
          type: string
          title: id
          description: 角色标识。一经发布不可更改；标识变更等同于"删除旧角色 + 新建角色"。
        displayName:
          type: string
          title: display_name
          description: 展示名，可修改。
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: 角色直接持有的权限码，取值必须存在于权限目录中。
        inherits:
          type: array
          items:
            type: string
          title: inherits
          description: 被继承的角色标识。
        mutuallyExclusiveWith:
          type: array
          items:
            type: string
          title: mutually_exclusive_with
          description: 静态互斥（SSD）的角色标识：不可与这些角色同时授予同一主体。
        builtin:
          type: boolean
          title: builtin
          description: 是否内置角色。内置角色不可删除，且权限范围不可修改。
      title: Role
      additionalProperties: false
    aladdin.rbac.v1.RoleBinding:
      type: object
      properties:
        subjectId:
          type: string
          title: subject_id
        roleId:
          type: string
          title: role_id
        scope:
          type: string
          title: scope
      title: RoleBinding
      additionalProperties: false
    aladdin.rbac.v1.Scope:
      type: object
      properties:
        path:
          type: string
          title: path
        displayName:
          type: string
          title: display_name
      title: Scope
      additionalProperties: false
      description: |-
        Scope 是一个已登记的范围。

         路径是标识（也是判定的输入），**一经登记不可更改**——与角色标识同构；
         "改路径"因此不是改名，而是"删掉旧范围 + 新建一个"。
         显示名只用于展示，可改，且不参与判定、不参与匹配。

         全局（根）不是一条登记记录：它永远可用、不可创建也不可删除。
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: aladdin.rbac.v1.RBACService
    description: |-
      RBACService 是权限体系的管理面。

       注意：本服务只负责**管理**角色与授权关系，不负责判定。
       判定发生在每个业务方法的入口（由鉴权拦截器统一执行），
       因此本服务自身的方法同样受注解约束。

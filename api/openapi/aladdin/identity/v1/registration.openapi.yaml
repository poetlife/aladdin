openapi: 3.1.0
info:
  title: aladdin.identity.v1
paths:
  /aladdin.identity.v1.RegistrationService/GetRegistrationPolicy:
    post:
      x-aladdin-auth:
        kind: requires
        permission: identity.registration.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.identity.v1.RegistrationService
      summary: GetRegistrationPolicy
      description: |-
        **鉴权**：需要权限 `identity.registration.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取当前注册策略。

         标了 NO_SIDE_EFFECTS：只读、请求体小到能放进查询串，因此同一条路径同时
         接受 GET 与 POST（见 AGENTS.md 的「传输方式的既定选择」）。请求里唯一的
         字段是用于鉴权的 scope，它不是秘密。
      operationId: aladdin.identity.v1.RegistrationService.GetRegistrationPolicy
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetRegistrationPolicyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetRegistrationPolicyResponse'
  /aladdin.identity.v1.RegistrationService/PutRegistrationPolicy:
    post:
      x-aladdin-auth:
        kind: requires
        permission: identity.registration.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.identity.v1.RegistrationService
      summary: PutRegistrationPolicy
      description: |-
        **鉴权**：需要权限 `identity.registration.write`；作用域取自请求字段。

        修改注册策略。

         它**只在存储里改一条记录、不授予任何权限**：新主体的默认角色是在登记
         那一刻写进绑定表的，改策略不追溯已登记的主体，也不改变任何一次判定。

         默认角色必须过"不能自我放大"的校验（不得持有 `*` / `rbac.subject.assign` /
         `rbac.policy.publish` / `identity.registration.write`，含经继承得到的）。
      operationId: aladdin.identity.v1.RegistrationService.PutRegistrationPolicy
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.PutRegistrationPolicyRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.PutRegistrationPolicyResponse'
  /aladdin.identity.v1.RegistrationService/ListInvites:
    post:
      x-aladdin-auth:
        kind: requires
        permission: identity.registration.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.identity.v1.RegistrationService
      summary: ListInvites
      description: |-
        **鉴权**：需要权限 `identity.registration.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出已签发的邀请码。

         **没有明文**：库里存的是摘要，明文只在签发那一刻返回过一次。
      operationId: aladdin.identity.v1.RegistrationService.ListInvites
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.ListInvitesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.ListInvitesResponse'
  /aladdin.identity.v1.RegistrationService/CreateInvite:
    post:
      x-aladdin-auth:
        kind: requires
        permission: identity.registration.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.identity.v1.RegistrationService
      summary: CreateInvite
      description: |-
        **鉴权**：需要权限 `identity.registration.write`；作用域取自请求字段。

        签发一份邀请码。

         邀请码**只作准入闸门**：它不带角色、不带范围、不绑定收件人。进来之后拿
         什么，由站点策略那一份决定——否则同一个码既是准入凭证又是权限凭证，泄漏
         一个码就泄漏了它所带的那份权限。
      operationId: aladdin.identity.v1.RegistrationService.CreateInvite
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.CreateInviteRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.CreateInviteResponse'
  /aladdin.identity.v1.RegistrationService/RevokeInvite:
    post:
      x-aladdin-auth:
        kind: requires
        permission: identity.registration.write
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.identity.v1.RegistrationService
      summary: RevokeInvite
      description: |-
        **鉴权**：需要权限 `identity.registration.write`；作用域取自请求字段。

        撤销一份邀请码。

         **只撤销，不删除**：删掉会连用量与留痕一起丢掉，"这个码被谁用过、用过
         几次"就再也答不上来。撤销之后该码立即不可兑换。
      operationId: aladdin.identity.v1.RegistrationService.RevokeInvite
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.RevokeInviteRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.RevokeInviteResponse'
  /aladdin.identity.v1.RegistrationService/CompleteRegistration:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.RegistrationService
      summary: CompleteRegistration
      description: |-
        **鉴权**：公开接口，无需认证。

        完成一次因邀请码而暂停的注册。

         公开是必须的：调用方正是那个还没登录、也还没有账号的人。

         **邀请码不在这里，注册凭据也不在这里。** 渠道凭证由回调校验过之后记成一份
         一次性凭据，只经浏览器不可读的 cookie 交回；本方法只做最后一件事：消费
         邀请码、登记主体、授默认角色、签发会话。请求里**只有码**——没有主体、也没有
         渠道身份，因此不存在"替某个身份注册"的形状（与 CompleteIdentityBinding 同）。

         码放在**请求体**而不是地址里：地址会进访问日志、浏览器历史与跳转来源，而
         邀请码与口令同级。同一条理由，它**不**标 idempotency_level——标了就等于同时
         接受 GET（见 PollDeviceLogin）。
      operationId: aladdin.identity.v1.RegistrationService.CompleteRegistration
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.CompleteRegistrationRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.CompleteRegistrationResponse'
components:
  schemas:
    aladdin.identity.v1.RegistrationMode:
      type: string
      title: RegistrationMode
      enum:
        - REGISTRATION_MODE_UNSPECIFIED
        - REGISTRATION_MODE_OPEN
        - REGISTRATION_MODE_INVITE
        - REGISTRATION_MODE_CLOSED
      description: |-
        RegistrationMode 是站点的准入姿态。**三选一，互斥且穷尽。**

         拆成"允许注册"与"需要邀请码"两个布尔量会造出四种状态，其中两种没有意义，
         而实现必须为它们各写一个分支。
    aladdin.identity.v1.CompleteRegistrationRequest:
      type: object
      properties:
        inviteCode:
          type: string
          title: invite_code
          description: |-
            邀请码的明文。**不是归属输入**：要登记哪个渠道身份，只由服务端在回调时
             记下的那份一次性注册凭据决定（见 registration.proto 的 CompleteRegistration）。
      title: CompleteRegistrationRequest
      additionalProperties: false
    aladdin.identity.v1.CompleteRegistrationResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
          description: ISO 8601 UTC。
      title: CompleteRegistrationResponse
      additionalProperties: false
    aladdin.identity.v1.CreateInviteRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        label:
          type: string
          title: label
        maxUses:
          type: integer
          title: max_uses
          format: int32
          description: 次数上限。0 表示不限次。
        expiresAt:
          type: string
          title: expires_at
          description: ISO 8601 UTC。空表示不过期。
      title: CreateInviteRequest
      additionalProperties: false
    aladdin.identity.v1.CreateInviteResponse:
      type: object
      properties:
        invite:
          allOf:
            - title: invite
            - $ref: '#/components/schemas/aladdin.identity.v1.Invite'
        code:
          type: string
          title: code
          description: |-
            码的明文。**只在这一次返回**，此后任何接口都读不回来——界面上要把这句话
             说出来，否则管理员会以为列表加载失败。
      title: CreateInviteResponse
      additionalProperties: false
    aladdin.identity.v1.GetRegistrationPolicyRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 仅用于鉴权：在哪个范围上有资格读。策略本身是站点级的。
      title: GetRegistrationPolicyRequest
      additionalProperties: false
    aladdin.identity.v1.GetRegistrationPolicyResponse:
      type: object
      properties:
        policy:
          allOf:
            - title: policy
            - $ref: '#/components/schemas/aladdin.identity.v1.RegistrationPolicy'
      title: GetRegistrationPolicyResponse
      additionalProperties: false
    aladdin.identity.v1.Invite:
      type: object
      properties:
        id:
          type: string
          title: id
          description: 邀请码标识。它是撤销时的定位键；**不是码**，拿到它也兑换不了。
        label:
          type: string
          title: label
          description: 管理员自己看的标签。**不参与任何判断。**
        createdBySubjectId:
          type: string
          title: created_by_subject_id
        createdAt:
          type: string
          title: created_at
        maxUses:
          type: integer
          title: max_uses
          format: int32
          description: 次数上限。0 表示不限次。
        usedCount:
          type: integer
          title: used_count
          format: int32
        expiresAt:
          type: string
          title: expires_at
          description: 空表示不过期。
        revokedAt:
          type: string
          title: revoked_at
          description: 空表示未撤销。非空即不可兑换。
      title: Invite
      additionalProperties: false
      description: |-
        Invite 是一份已签发的邀请码。

         **这里没有任何字段能还原出码的明文。** 库里存的是摘要，明文只在签发那一次
         返回过；要收回一份，只能用 revoked_at 撤销它，不能把它读回来。
    aladdin.identity.v1.ListInvitesRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
      title: ListInvitesRequest
      additionalProperties: false
    aladdin.identity.v1.ListInvitesResponse:
      type: object
      properties:
        invites:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Invite'
          title: invites
          description: 顺序稳定：按签发时间倒序（最近的在前）。
      title: ListInvitesResponse
      additionalProperties: false
    aladdin.identity.v1.PutRegistrationPolicyRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        mode:
          allOf:
            - title: mode
            - $ref: '#/components/schemas/aladdin.identity.v1.RegistrationMode'
        defaultRoleId:
          type: string
          title: default_role_id
          description: 与 default_scope 同进同退；两者都空表示不给默认角色。
        defaultScope:
          type: string
          title: default_scope
      title: PutRegistrationPolicyRequest
      additionalProperties: false
    aladdin.identity.v1.PutRegistrationPolicyResponse:
      type: object
      properties:
        policy:
          allOf:
            - title: policy
            - $ref: '#/components/schemas/aladdin.identity.v1.RegistrationPolicy'
      title: PutRegistrationPolicyResponse
      additionalProperties: false
    aladdin.identity.v1.RegistrationPolicy:
      type: object
      properties:
        mode:
          allOf:
            - title: mode
            - $ref: '#/components/schemas/aladdin.identity.v1.RegistrationMode'
        defaultRoleId:
          type: string
          title: default_role_id
          description: 新主体的默认角色。**空表示不给默认角色**（新主体零权限，这是此前的唯一形态）。
        defaultScope:
          type: string
          title: default_scope
          description: |-
            默认角色的作用范围。空表示全局。它同时成为新主体的**默认作用域**——
             主体的默认作用域只能来自绑定关系，因此它取自这条绑定，不另有一个配置项。

             与 default_role_id **同进同退**：要么都给、要么都不给。
        updatedBySubjectId:
          type: string
          title: updated_by_subject_id
          description: 最近一次改动的留痕。**不参与判定**，只回答"这个姿态是谁定的"。
        updatedAt:
          type: string
          title: updated_at
      title: RegistrationPolicy
      additionalProperties: false
      description: |-
        RegistrationPolicy 是站点级的注册策略。

         站点级一份，对全部渠道生效。**没有"按渠道分别设"**：要做的话是策略多一维，
         不是新机制（见 docs/design/identity/registration.md）。
    aladdin.identity.v1.RevokeInviteRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
        id:
          type: string
          title: id
      title: RevokeInviteRequest
      additionalProperties: false
    aladdin.identity.v1.RevokeInviteResponse:
      type: object
      properties:
        invite:
          allOf:
            - title: invite
            - $ref: '#/components/schemas/aladdin.identity.v1.Invite'
      title: RevokeInviteResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: aladdin.identity.v1.RegistrationService
    description: |-
      RegistrationService 是**注册面**：谁进得来、进来拿什么。

       边界只有一句：**它写下的是一条真实的角色绑定，判定路径从不读它。**
       注册策略是一条管理面的记录，不是配置——改它不改变任何一次既有的放行判定，
       删掉它也不撤销任何一条已写下的绑定（见 docs/design/identity/registration.md
       的「与 AGENTS.md 第 7 条的关系」）。

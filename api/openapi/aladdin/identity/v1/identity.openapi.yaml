openapi: 3.1.0
info:
  title: aladdin.identity.v1
paths:
  /aladdin.identity.v1.IdentityService/Login:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: Login
      description: |-
        **鉴权**：公开接口，无需认证。

        登录并换取访问凭证。
         这是极少数公开方法之一，必须显式标记 public，否则鉴权拦截器默认拒绝。
      operationId: aladdin.identity.v1.IdentityService.Login
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.LoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.LoginResponse'
  /aladdin.identity.v1.IdentityService/Refresh:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: Refresh
      description: |-
        **鉴权**：公开接口，无需认证。

        刷新访问凭证。
      operationId: aladdin.identity.v1.IdentityService.Refresh
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.RefreshRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.RefreshResponse'
  /aladdin.identity.v1.IdentityService/GetAuthMethods:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: GetAuthMethods
      description: |-
        **鉴权**：公开接口，无需认证。

        返回当前启用的登录方式。前端据此决定渲染哪些登录入口。

         公开是必须的：调用方尚未认证，而这正是它要回答的问题的前提。它之所以
         能公开，是因为返回的内容本来就会出现在浏览器里（客户端标识不是秘密）——
         一个不公开的"有哪些登录方式"不保护任何东西，只会迫使前端硬编码一份
         会漂移的副本。若它将来开始返回需要保护的内容，就必须移出公开清单。
      operationId: aladdin.identity.v1.IdentityService.GetAuthMethods
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetAuthMethodsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetAuthMethodsResponse'
  /aladdin.identity.v1.IdentityService/WhoAmI:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: WhoAmI
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        返回当前凭证对应的主体标识。客户端用它验证凭证是否仍然有效。
      operationId: aladdin.identity.v1.IdentityService.WhoAmI
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.WhoAmIRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.WhoAmIResponse'
  /aladdin.identity.v1.IdentityService/GetSessionPermissions:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: GetSessionPermissions
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        返回当前主体在其可及作用域下展开后的权限码集合。
         这是前端会话权限的唯一来源：前端拿到的是已展开的最终集合，
         因此前端不需要（也不允许）自行实现继承、通配与作用域包含逻辑。
      operationId: aladdin.identity.v1.IdentityService.GetSessionPermissions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetSessionPermissionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetSessionPermissionsResponse'
  /aladdin.identity.v1.IdentityService/BindIdentity:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: BindIdentity
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        把一个登录渠道绑到当前主体上。

         **归属由发起者决定，不由令牌决定。** 令牌只证明"发起者控制着这个身份"，
         因此这里只可能绑到**当前凭证代表的主体**上——不存在"把身份绑到指定主体"
         的形状。若存在，任何持有他人令牌的人都能把身份挂到他人名下。

         该身份已属于另一个主体时拒绝，**不转移、不合并**：转移意味着任何拿到
         该渠道令牌的人都能把别人的进入方式夺走一部分，而这个动作在系统里与一次
         正常绑定没有区别。唯一的窄口子是"空主体认领"（见 docs/design/identity/
         identity-linking.md）：原主体只有这条身份、且没有任何角色绑定时，
         身份被并入当前主体。

         归属语义与 CompleteIdentityBinding（重定向型）**完全相同**，两者只有
         凭证怎么到达服务端不同——因此共用同一处实现，不得各写一份。
      operationId: aladdin.identity.v1.IdentityService.BindIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.BindIdentityRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.BindIdentityResponse'
  /aladdin.identity.v1.IdentityService/UnbindIdentity:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: UnbindIdentity
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        从当前主体上摘掉一个登录渠道。

         同样只作用于当前主体。**不允许摘掉最后一个身份**：那会让这个主体再也
         没有任何进入方式，而它的角色绑定还在，没有人能进来清理。

         摘掉之后该渠道不再通向这个主体，下次用它登录会登记出一个新的、零权限
         的主体——这是预期行为，不是权限丢失，界面必须说明这一点。
      operationId: aladdin.identity.v1.IdentityService.UnbindIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.UnbindIdentityRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.UnbindIdentityResponse'
  /aladdin.identity.v1.IdentityService/CompleteIdentityBinding:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: CompleteIdentityBinding
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        完成一次重定向型渠道的绑定。

         渠道凭证**不在这里**：它经一次浏览器导航到达服务端，由回调校验过之后
         记成一份一次性的"待绑定凭据"，只经浏览器不可读的 cookie 交回。本方法只
         负责在**当前已认证主体**上兑换它——归属仍然只由当前凭证决定，不由请求
         里的任何字段决定（不存在"把身份绑到指定主体"的形状）。
      operationId: aladdin.identity.v1.IdentityService.CompleteIdentityBinding
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.CompleteIdentityBindingRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.CompleteIdentityBindingResponse'
  /aladdin.identity.v1.IdentityService/ListIdentities:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: ListIdentities
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        列出当前主体已绑定的全部登录渠道。
      operationId: aladdin.identity.v1.IdentityService.ListIdentities
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.ListIdentitiesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.ListIdentitiesResponse'
components:
  schemas:
    aladdin.identity.v1.AuthMethod:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源标识，如 google / github。前端据此决定渲染哪个入口。
        clientId:
          type: string
          title: client_id
          description: |-
            该渠道的公开客户端标识。

             **不是秘密**：它本来就明文出现在浏览器里，这是这类登录方式的设计前提。
      title: AuthMethod
      additionalProperties: false
      description: AuthMethod 是一个已启用的登录渠道。
    aladdin.identity.v1.BindIdentityRequest:
      type: object
      allOf:
        - anyOf:
            - required:
                - google
            - not:
                anyOf:
                  - required:
                      - google
      anyOf:
        - required:
            - google
        - not:
            anyOf:
              - required:
                  - google
      properties:
        google:
          allOf:
            - title: google
            - $ref: '#/components/schemas/aladdin.identity.v1.GoogleCredential'
      title: BindIdentityRequest
      additionalProperties: false
    aladdin.identity.v1.BindIdentityResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
        reclaimed:
          type: boolean
          title: reclaimed
          description: |-
            本次是否认领了一个空主体上的身份。含义与 CompleteIdentityBindingResponse
             的同名字段一致：为 true 表示这个渠道此前单独登录过、已并入当前账号，
             客户端据此给出说明；它不告诉调用方原主体的任何标识。
      title: BindIdentityResponse
      additionalProperties: false
      description: |-
        BindIdentityResponse 返回绑定之后该主体的全部渠道。

         返回整份现状而不是一个"成功"标志：客户端刚做过一次会改变现状的操作，
         让它在同一次往返里拿到新现状，比再多发一次查询更省事，也不会读到
         两次请求之间的中间态。
    aladdin.identity.v1.CompleteIdentityBindingRequest:
      type: object
      properties:
        source:
          type: string
          title: source
          description: |-
            渠道来源，如 github。它只用于与待绑定凭据里记下的来源互相印证；
             **不是归属输入**——目标主体只取当前凭证代表的主体。
      title: CompleteIdentityBindingRequest
      additionalProperties: false
      description: CompleteIdentityBindingRequest 兑换一份已经由回调校验过的重定向型渠道身份。
    aladdin.identity.v1.CompleteIdentityBindingResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
        reclaimed:
          type: boolean
          title: reclaimed
          description: |-
            本次是否认领了一个空主体上的身份。为 true 表示这个渠道此前单独登录过，
             客户端据此给出"已并入当前账号"的说明。

             它只说明"发生过认领"，不告诉调用方原主体的任何标识。
      title: CompleteIdentityBindingResponse
      additionalProperties: false
      description: CompleteIdentityBindingResponse 返回绑定之后该主体的全部渠道。
    aladdin.identity.v1.GetAuthMethodsRequest:
      type: object
      title: GetAuthMethodsRequest
      additionalProperties: false
    aladdin.identity.v1.GetAuthMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.AuthMethod'
          title: methods
          description: |-
            已启用的登录渠道，顺序稳定。为空表示没有任何渠道登录方式可用，
             前端据此不渲染任何渠道入口。
      title: GetAuthMethodsResponse
      additionalProperties: false
      description: |-
        GetAuthMethodsResponse 描述服务端当前启用了哪些登录方式。

         只承载公开信息：这里出现的一切都会明文送到浏览器，因此不得放入任何
         需要保护的取值。

         返回的是**列表**而不是逐个具名字段：新增一个渠道时这里不该再改一次形状，
         前端也不该为每个渠道多写一个判断分支（见 docs/design/identity/channel-login.md）。
    aladdin.identity.v1.GetSessionPermissionsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 期望的作用域。留空时使用凭证的默认作用域。
      title: GetSessionPermissionsRequest
      additionalProperties: false
    aladdin.identity.v1.GetSessionPermissionsResponse:
      type: object
      properties:
        scope:
          type: string
          title: scope
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: 已展开的最终权限码集合。
      title: GetSessionPermissionsResponse
      additionalProperties: false
    aladdin.identity.v1.GoogleCredential:
      type: object
      properties:
        idToken:
          type: string
          title: id_token
      title: GoogleCredential
      additionalProperties: false
      description: |-
        GoogleCredential 是 Google Identity Services 在浏览器内返回的身份令牌。

         它由前端搬运、由服务端校验，前端的任何字段都不参与信任决策。服务端必须
         校验签名、签发方、受众与有效期，其中**受众必须严格等于本服务配置的客户端
         标识**——漏掉这一条意味着任何 Google 应用的令牌都能登录本服务。

         这份令牌**不得进入日志、错误信息与 --debug 输出**：它与口令同级。
    aladdin.identity.v1.Identity:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源，如 google。
        externalId:
          type: string
          title: external_id
          description: |-
            该渠道上的身份标识。用于发起解绑；它本身不是秘密——拿到它也冒充不了
             谁，登录仍要过渠道自己的校验。
        display:
          type: string
          title: display
          description: 该渠道给出的可读标识（如邮箱），仅供展示。
      title: Identity
      additionalProperties: false
      description: |-
        Identity 是一个已绑定的登录渠道。

         **没有任何一个字段参与判定**，它们只用于展示与解绑时定位。
    aladdin.identity.v1.ListIdentitiesRequest:
      type: object
      title: ListIdentitiesRequest
      additionalProperties: false
    aladdin.identity.v1.ListIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
      title: ListIdentitiesResponse
      additionalProperties: false
    aladdin.identity.v1.LoginRequest:
      type: object
      allOf:
        - anyOf:
            - required:
                - google
            - required:
                - password
            - required:
                - token
            - not:
                anyOf:
                  - required:
                      - google
                  - required:
                      - password
                  - required:
                      - token
      anyOf:
        - required:
            - google
        - required:
            - password
        - required:
            - token
        - not:
            anyOf:
              - required:
                  - google
              - required:
                  - password
              - required:
                  - token
      properties:
        password:
          allOf:
            - title: password
            - $ref: '#/components/schemas/aladdin.identity.v1.PasswordCredential'
        token:
          allOf:
            - title: token
            - $ref: '#/components/schemas/aladdin.identity.v1.TokenCredential'
        google:
          allOf:
            - title: google
            - $ref: '#/components/schemas/aladdin.identity.v1.GoogleCredential'
      title: LoginRequest
      additionalProperties: false
    aladdin.identity.v1.LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
          description: ISO 8601 UTC 时间。CLI 依据它做本地过期预检（见 cli-permissions.md）。
      title: LoginResponse
      additionalProperties: false
    aladdin.identity.v1.PasswordCredential:
      type: object
      properties:
        username:
          type: string
          title: username
        password:
          type: string
          title: password
      title: PasswordCredential
      additionalProperties: false
    aladdin.identity.v1.RefreshRequest:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
      title: RefreshRequest
      additionalProperties: false
    aladdin.identity.v1.RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
      title: RefreshResponse
      additionalProperties: false
    aladdin.identity.v1.TokenCredential:
      type: object
      properties:
        token:
          type: string
          title: token
      title: TokenCredential
      additionalProperties: false
    aladdin.identity.v1.UnbindIdentityRequest:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源，如 google。
        externalId:
          type: string
          title: external_id
          description: 该渠道上的身份标识。
      title: UnbindIdentityRequest
      additionalProperties: false
    aladdin.identity.v1.UnbindIdentityResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
      title: UnbindIdentityResponse
      additionalProperties: false
    aladdin.identity.v1.WhoAmIRequest:
      type: object

openapi: 3.1.0
info:
  title: aladdin.identity.v1
paths:
  /aladdin.identity.v1.IdentityService/Login:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: Login
      description: |-
        **鉴权**：公开接口，无需认证。

        登录并换取访问凭证。
         这是极少数公开方法之一，必须显式标记 public，否则鉴权拦截器默认拒绝。
      operationId: aladdin.identity.v1.IdentityService.Login
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.LoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.LoginResponse'
  /aladdin.identity.v1.IdentityService/Refresh:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: Refresh
      description: |-
        **鉴权**：公开接口，无需认证。

        刷新访问凭证。
      operationId: aladdin.identity.v1.IdentityService.Refresh
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.RefreshRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.RefreshResponse'
  /aladdin.identity.v1.IdentityService/GetAuthMethods:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: GetAuthMethods
      description: |-
        **鉴权**：公开接口，无需认证。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        返回当前启用的登录方式。前端据此决定渲染哪些登录入口。

         公开是必须的：调用方尚未认证，而这正是它要回答的问题的前提。它之所以
         能公开，是因为返回的内容本来就会出现在浏览器里（客户端标识不是秘密）——
         一个不公开的"有哪些登录方式"不保护任何东西，只会迫使前端硬编码一份
         会漂移的副本。若它将来开始返回需要保护的内容，就必须移出公开清单。
      operationId: aladdin.identity.v1.IdentityService.GetAuthMethods
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetAuthMethodsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetAuthMethodsResponse'
  /aladdin.identity.v1.IdentityService/WhoAmI:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: WhoAmI
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        返回当前凭证对应的主体标识。客户端用它验证凭证是否仍然有效。
      operationId: aladdin.identity.v1.IdentityService.WhoAmI
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.WhoAmIRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.WhoAmIResponse'
  /aladdin.identity.v1.IdentityService/GetSessionPermissions:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: GetSessionPermissions
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        返回当前主体在其可及作用域下展开后的权限码集合。
         这是前端会话权限的唯一来源：前端拿到的是已展开的最终集合，
         因此前端不需要（也不允许）自行实现继承、通配与作用域包含逻辑。
      operationId: aladdin.identity.v1.IdentityService.GetSessionPermissions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.GetSessionPermissionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.GetSessionPermissionsResponse'
  /aladdin.identity.v1.IdentityService/UnbindIdentity:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: UnbindIdentity
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        从当前主体上摘掉一个登录渠道。

         同样只作用于当前主体。**不允许摘掉最后一个身份**：那会让这个主体再也
         没有任何进入方式，而它的角色绑定还在，没有人能进来清理。

         摘掉之后该渠道不再通向这个主体，下次用它登录会登记出一个新的、零权限
         的主体——这是预期行为，不是权限丢失，界面必须说明这一点。
      operationId: aladdin.identity.v1.IdentityService.UnbindIdentity
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.UnbindIdentityRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.UnbindIdentityResponse'
  /aladdin.identity.v1.IdentityService/CompleteIdentityBinding:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: CompleteIdentityBinding
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        完成一次渠道绑定。

         渠道凭证**不在这里**：所有渠道都是重定向型，凭证经一次浏览器导航到达
         服务端，由回调校验过之后记成一份一次性的"待绑定凭据"，只经浏览器不可读的
         cookie 交回。本方法只负责在**当前已认证主体**上兑换它——归属仍然只由当前
         凭证决定，不由请求里的任何字段决定（不存在"把身份绑到指定主体"的形状）。

         **归属由发起者决定，不由凭证决定。** 凭证只证明"发起者控制着这个身份"，
         因此这里只可能绑到当前凭证代表的主体上。该身份已属于另一个主体时拒绝，
         **不转移、不合并**：转移意味着任何拿到该渠道凭证的人都能把别人的进入方式
         夺走一部分，而这个动作在系统里与一次正常绑定没有区别。唯一的窄口子是
         "空主体认领"（见 docs/design/identity/identity-linking.md）：原主体只有这条
         身份、且没有任何角色绑定时，身份被并入当前主体。
      operationId: aladdin.identity.v1.IdentityService.CompleteIdentityBinding
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.CompleteIdentityBindingRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.CompleteIdentityBindingResponse'
  /aladdin.identity.v1.IdentityService/ListIdentities:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: ListIdentities
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出当前主体已绑定的全部登录渠道。
      operationId: aladdin.identity.v1.IdentityService.ListIdentities
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.ListIdentitiesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.ListIdentitiesResponse'
  /aladdin.identity.v1.IdentityService/StartDeviceLogin:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: StartDeviceLogin
      description: |-
        **鉴权**：公开接口，无需认证。

        发起一次命令行的设备码登录。

         公开是必须的：调用方正是那个还没登录的终端。它拿到一个给人看的短码与
         一个给终端保管的设备码，后者是这台设备在批准之前的唯一凭据来源。

         未配置对外地址时**本路径整体缺席**，返回"未实现"而不是"设备码无效"——
         把配置缺失说成凭证问题，会让排障的人去查终端拿的是什么。
      operationId: aladdin.identity.v1.IdentityService.StartDeviceLogin
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.StartDeviceLoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.StartDeviceLoginResponse'
  /aladdin.identity.v1.IdentityService/PollDeviceLogin:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.identity.v1.IdentityService
      summary: PollDeviceLogin
      description: |-
        **鉴权**：公开接口，无需认证。

        轮询一次设备码登录的结果。

         公开，理由同上。**结果是一个状态，不是一个错误**：把"还没批准"表达成
         一个错误码，会让"这一次轮询没结果"与"你未认证"变成同一个结论，而它们
         该有完全不同的走向——前者该继续等，后者该重新登录。

         已批准时**恰好交付一次**会话凭证，此后再轮询同一份设备码只会得到
         非已批准的状态（见 docs/design/identity/device-login.md）。

         它读起来像只读，实则会推进状态（上面那句"恰好交付一次"），因此**不**标
         idempotency_level——标了就等于同时接受 GET，而 device_code 会随查询串
         落进访问日志，这与它"不得进入日志"的要求冲突。
      operationId: aladdin.identity.v1.IdentityService.PollDeviceLogin
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.PollDeviceLoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.PollDeviceLoginResponse'
  /aladdin.identity.v1.IdentityService/ApproveDeviceLogin:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: ApproveDeviceLogin
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        批准一次设备码登录。

         **归属只由当前凭证决定**：请求里只有短码，没有主体——不存在"替某个主体
         批准"的形状。若存在，任何拿到别人短码的人都能让别人的终端登进自己指定
         的账号（见 docs/design/identity/device-login.md）。

         交付的会话其作用域是**当前主体既有的默认作用域快照**：本方法不为这次
         登录新算作用域，也不接受请求里给的作用域，因此不需要声明作用域来源。
      operationId: aladdin.identity.v1.IdentityService.ApproveDeviceLogin
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.ApproveDeviceLoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.ApproveDeviceLoginResponse'
  /aladdin.identity.v1.IdentityService/DenyDeviceLogin:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.identity.v1.IdentityService
      summary: DenyDeviceLogin
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        拒绝一次设备码登录。

         与批准同一条归属规则。拒绝是**给使用者的出口**：短码被误输入、或这次
         登录不是自己发起的，人需要一个明确的"不"。
      operationId: aladdin.identity.v1.IdentityService.DenyDeviceLogin
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.identity.v1.DenyDeviceLoginRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.identity.v1.DenyDeviceLoginResponse'
components:
  schemas:
    aladdin.identity.v1.DeviceLoginState:
      type: string
      title: DeviceLoginState
      enum:
        - DEVICE_LOGIN_STATE_UNSPECIFIED
        - DEVICE_LOGIN_STATE_PENDING
        - DEVICE_LOGIN_STATE_APPROVED
        - DEVICE_LOGIN_STATE_DENIED
        - DEVICE_LOGIN_STATE_EXPIRED
      description: |-
        DeviceLoginState 是一次轮询的结果。

         它是一个**状态**而不是一组错误码：调用方据此决定继续等、停下、还是重新
         发起。四种取值互斥且穷尽——分不出类别的取值会让调用方只能猜。
    aladdin.identity.v1.ApproveDeviceLoginRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
          description: 要批准的短码。**不是归属输入**——目标主体只取当前凭证代表的主体。
      title: ApproveDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.ApproveDeviceLoginResponse:
      type: object
      title: ApproveDeviceLoginResponse
      additionalProperties: false
    aladdin.identity.v1.AuthMethod:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源标识，如 google / github。前端据此决定渲染哪个入口。
      title: AuthMethod
      additionalProperties: false
      description: |-
        AuthMethod 是一个已启用的登录渠道。

         **只有一个来源标识**：所有渠道都是重定向型，入口是一个指向服务端起点的
         导航，客户端不需要渠道的客户端标识（它由服务端持有并直接交给渠道）。
         下发一个客户端用不上的值，只会多一处"看起来该用它"的地方。
    aladdin.identity.v1.CompleteIdentityBindingRequest:
      type: object
      properties:
        source:
          type: string
          title: source
          description: |-
            渠道来源，如 google。它只用于与待绑定凭据里记下的来源互相印证；
             **不是归属输入**——目标主体只取当前凭证代表的主体。
      title: CompleteIdentityBindingRequest
      additionalProperties: false
    aladdin.identity.v1.CompleteIdentityBindingResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
        reclaimed:
          type: boolean
          title: reclaimed
          description: |-
            本次是否认领了一个空主体上的身份。为 true 表示这个渠道此前单独登录过，
             客户端据此给出"已并入当前账号"的说明。

             它只说明"发生过认领"，不告诉调用方原主体的任何标识。
      title: CompleteIdentityBindingResponse
      additionalProperties: false
      description: CompleteIdentityBindingResponse 返回绑定之后该主体的全部渠道。
    aladdin.identity.v1.DenyDeviceLoginRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
      title: DenyDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.DenyDeviceLoginResponse:
      type: object
      title: DenyDeviceLoginResponse
      additionalProperties: false
    aladdin.identity.v1.GetAuthMethodsRequest:
      type: object
      title: GetAuthMethodsRequest
      additionalProperties: false
    aladdin.identity.v1.GetAuthMethodsResponse:
      type: object
      properties:
        methods:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.AuthMethod'
          title: methods
          description: |-
            已启用的登录渠道，顺序稳定。为空表示没有任何渠道登录方式可用，
             前端据此不渲染任何渠道入口。
        deviceLoginEnabled:
          type: boolean
          title: device_login_enabled
          description: |-
            命令行的设备码登录是否可用。

             它**不是一个渠道**，因此不在 methods 里：它不引入任何渠道身份，只是把
             一个已有主体的会话交给终端。不可用时命令行据此不去发起，而不是发起了
             再收到一次"未实现"。
      title: GetAuthMethodsResponse
      additionalProperties: false
      description: |-
        GetAuthMethodsResponse 描述服务端当前启用了哪些登录方式。

         只承载公开信息：这里出现的一切都会明文送到浏览器，因此不得放入任何
         需要保护的取值。

         返回的是**列表**而不是逐个具名字段：新增一个渠道时这里不该再改一次形状，
         前端也不该为每个渠道多写一个判断分支（见 docs/design/identity/channel-login.md）。
    aladdin.identity.v1.GetSessionPermissionsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 期望的作用域。留空时使用凭证的默认作用域。
      title: GetSessionPermissionsRequest
      additionalProperties: false
    aladdin.identity.v1.GetSessionPermissionsResponse:
      type: object
      properties:
        scope:
          type: string
          title: scope
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: 已展开的最终权限码集合。
      title: GetSessionPermissionsResponse
      additionalProperties: false
    aladdin.identity.v1.Identity:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源，如 google。
        externalId:
          type: string
          title: external_id
          description: |-
            该渠道上的身份标识。用于发起解绑；它本身不是秘密——拿到它也冒充不了
             谁，登录仍要过渠道自己的校验。
        display:
          type: string
          title: display
          description: 该渠道给出的可读标识（如邮箱），仅供展示。
      title: Identity
      additionalProperties: false
      description: |-
        Identity 是一个已绑定的登录渠道。

         **没有任何一个字段参与判定**，它们只用于展示与解绑时定位。
    aladdin.identity.v1.ListIdentitiesRequest:
      type: object
      title: ListIdentitiesRequest
      additionalProperties: false
    aladdin.identity.v1.ListIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
      title: ListIdentitiesResponse
      additionalProperties: false
    aladdin.identity.v1.LoginRequest:
      type: object
      allOf:
        - anyOf:
            - required:
                - password
            - required:
                - token
            - not:
                anyOf:
                  - required:
                      - password
                  - required:
                      - token
      anyOf:
        - required:
            - password
        - required:
            - token
        - not:
            anyOf:
              - required:
                  - password
              - required:
                  - token
      properties:
        password:
          allOf:
            - title: password
            - $ref: '#/components/schemas/aladdin.identity.v1.PasswordCredential'
        token:
          allOf:
            - title: token
            - $ref: '#/components/schemas/aladdin.identity.v1.TokenCredential'
      title: LoginRequest
      additionalProperties: false
    aladdin.identity.v1.LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
          description: ISO 8601 UTC 时间。CLI 依据它做本地过期预检（见 cli-permissions.md）。
      title: LoginResponse
      additionalProperties: false
    aladdin.identity.v1.PasswordCredential:
      type: object
      properties:
        username:
          type: string
          title: username
        password:
          type: string
          title: password
      title: PasswordCredential
      additionalProperties: false
    aladdin.identity.v1.PollDeviceLoginRequest:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
          description: 服务端在发起时交给终端的设备码。
      title: PollDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.PollDeviceLoginResponse:
      type: object
      properties:
        state:
          allOf:
            - title: state
            - $ref: '#/components/schemas/aladdin.identity.v1.DeviceLoginState'
        accessToken:
          type: string
          title: access_token
          description: 仅 state 为 APPROVED 时存在：会话凭证与它的过期时间。
        expiresAt:
          type: string
          title: expires_at
      title: PollDeviceLoginResponse
      additionalProperties: false
    aladdin.identity.v1.RefreshRequest:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
      title: RefreshRequest
      additionalProperties: false
    aladdin.identity.v1.RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          type: string
          title: expires_at
      title: RefreshResponse
      additionalProperties: false
    aladdin.identity.v1.StartDeviceLoginRequest:
      type: object
      title: StartDeviceLoginRequest
      additionalProperties: false
    aladdin.identity.v1.StartDeviceLoginResponse:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
          description: |-
            设备码：终端保管，用它轮询。不可人工输入，因此没有任何可读性要求。
             **不得进入日志**：它能换来一份会话。
        userCode:
          type: string
          title: user_code
          description: |-
            短码：给人读、给人打。大小写不敏感，连字符可有可无。
             它与设备码同级——能换来一次批准，因此**不得进入日志**。
        verificationUri:
          type: string
          title: verification_uri
          description: |-
            批准页地址。**不含短码**：短码要由人与终端上显示的比对，把短码放进地址
             会消掉这次核对，而那正是"受害者把终端登进攻击者账号"的唯一防线。
        intervalSeconds:
          type: integer
          title: interval_seconds
          format: int32
          description: 建议的轮询间隔（秒）。
        expiresAt:
          type: string
          title: expires_at
          description: ISO 8601 UTC。终端的轮询不得越过它。
      title: StartDeviceLoginResponse
      additionalProperties: false
      description: StartDeviceLoginResponse 同时承载**两份凭据**与一个给人用的地址。
    aladdin.identity.v1.TokenCredential:
      type: object
      properties:
        token:
          type: string
          title: token
      title: TokenCredential
      additionalProperties: false
    aladdin.identity.v1.UnbindIdentityRequest:
      type: object
      properties:
        source:
          type: string
          title: source
          description: 渠道来源，如 google。
        externalId:
          type: string
          title: external_id
          description: 该渠道上的身份标识。
      title: UnbindIdentityRequest
      additionalProperties: false
    aladdin.identity.v1.UnbindIdentityResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.identity.v1.Identity'
          title: identities
      title: UnbindIdentityResponse
      additionalProperties: false
    aladdin.identity.v1.WhoAmIRequest:
      type: object
      title: WhoAmIRequest
      additionalProperties: false
    aladdin.identity.v1.WhoAmIResponse:
      type: object
      properties:
        subjectId:
          type: string
          title: subject_id
        subjectType:
          type: string
          title: subject_type
          description: 主体类型：user / service_account / machine。
        defaultScope:
          type: string
          title: default_scope
          description: 凭证自身绑定的默认作用域。
      title: WhoAmIResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: aladdin.identity.v1.IdentityService
    description: |-
      IdentityService 是身份认证面。

       边界：本服务只做认证（你是谁）。判定（你能做什么）由 RBAC 负责。
       认证失败与鉴权失败必须返回不同的状态码，见 grpc-interceptor.md 的拒绝语义。

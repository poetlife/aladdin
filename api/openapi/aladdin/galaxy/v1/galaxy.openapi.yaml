openapi: 3.1.0
info:
  title: aladdin.galaxy.v1
paths:
  /aladdin.galaxy.v1.GalaxyService/GetCapabilities:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetCapabilities
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取当前部署下创作能力的边界：能不能传素材、能不能发布、各项上限。

         它是**能力下发点**，与档案的 avatar_upload_enabled 同一取向：能力由
         服务端说，客户端不猜。前端据此不渲染未启用的入口，而不是渲染一个点了
         报错的控件。它退回的每一项都是部署形态的公开事实，不因调用者而异。
      operationId: aladdin.galaxy.v1.GalaxyService.GetCapabilities
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetCapabilitiesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetCapabilitiesResponse'
  /aladdin.galaxy.v1.GalaxyService/ListProjects:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ListProjects
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出调用者自己的工程。**只有这一个列表入口，且它的范围由凭证决定。**

         刻意没有"列出所有工程"或"列出某个主体的工程"的形状：工程标识不可猜
         是发布态匿名可读的唯一防线，任何枚举入口都会把它降级成"打开就能逛"。
      operationId: aladdin.galaxy.v1.GalaxyService.ListProjects
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ListProjectsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ListProjectsResponse'
  /aladdin.galaxy.v1.GalaxyService/CreateProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: CreateProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        创建一个工程。标识由服务端分配，不可猜、不可改、不复用。

         **形态在这里定下，此后不可改**：它决定已保存版本的发布语义，改它等于让
         历史版本的产物无法复现（见 docs/design/galaxy/site-model.md）。

         名称**不参与任何查找**：不按名称查工程、不加唯一约束、不进发布地址。
         一旦名称成为查找键，它就成了一条可以被改名或抢注改写的路径。
      operationId: aladdin.galaxy.v1.GalaxyService.CreateProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.CreateProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.CreateProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/GetProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取一个工程的元数据。不含草稿清单、版本清单与资产字节。
      operationId: aladdin.galaxy.v1.GalaxyService.GetProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/UpdateProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: UpdateProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        修改工程的名称与简介。请求表达的是**期望的完整状态**，空串表示清空。

         **不含形态**：形态改不了，因此它不在这个请求的形状里。
      operationId: aladdin.galaxy.v1.GalaxyService.UpdateProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.UpdateProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.UpdateProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/DeleteProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: DeleteProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        删除一个工程。**连带删除它的全部版本、资产与发布记录**，因此已发布的
         地址立刻变成"不存在"。公开区上已上架的字节不回收（见发布一节）。
      operationId: aladdin.galaxy.v1.GalaxyService.DeleteProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/GetDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取工程的当前草稿清单，每一项带一条短时读取地址。

         草稿行是惰性创建的：从未推送过草稿时清单为空。地址由客户端直连取字节，
         服务端不代理（见 docs/design/galaxy/asset-library.md）。
      operationId: aladdin.galaxy.v1.GalaxyService.GetDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetDraftResponse'
  /aladdin.galaxy.v1.GalaxyService/PushDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: PushDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        以给定的清单**整组替换**草稿（它不产生版本）。

         它表达的是**期望的完整状态**，不是增量：清单里没有的路径就是"删掉"。
         否则"我到底删没删掉那一份"会变成一个需要读命令行实现才能回答的问题。

         **这是内容唯一的写入路径**（命令行）。网页端只读：两个入口并存会引出
         "网页上刚改的一句被一次 push 静默盖掉"这类只在两个入口之间发生的冲突，
         收成一条路径，那份冲突连同它需要的基线校验一起不存在。

         请求里的条目**只引用已经上传好的对象**（文本条目是内容摘要，资产条目是
         资产标识），因此本方法不带字节，也不触发任何上传。
      operationId: aladdin.galaxy.v1.GalaxyService.PushDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.PushDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.PushDraftResponse'
  /aladdin.galaxy.v1.GalaxyService/SaveVersion:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: SaveVersion
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        把草稿的当前清单保存成一个**不可变**版本。

         保存即冻结：此后改草稿、改工程名称、删资产都不改变这个版本读回的内容。
         连续保存两次相同清单产生两个版本，而不是"检测到重复就不新增"——两份
         看起来一样的清单对用户是两次不同的保存动作。
      operationId: aladdin.galaxy.v1.GalaxyService.SaveVersion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.SaveVersionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.SaveVersionResponse'
  /aladdin.galaxy.v1.GalaxyService/ListVersions:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ListVersions
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出工程的版本，按序号排序。清单很小，因此**列表也带清单**（不带地址）。
      operationId: aladdin.galaxy.v1.GalaxyService.ListVersions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ListVersionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ListVersionsResponse'
  /aladdin.galaxy.v1.GalaxyService/GetVersion:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetVersion
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取一个版本，含清单与每一项的短时读取地址。保存时的内容此后逐字不变。
      operationId: aladdin.galaxy.v1.GalaxyService.GetVersion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetVersionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetVersionResponse'
  /aladdin.galaxy.v1.GalaxyService/DeleteVersion:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: DeleteVersion
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        删除一个版本。**被当前发布指向的版本不可删**——那会让发布地址指向一个
         不存在的版本。序号不因删除而重排，因此删中间一个会留下空洞。
      operationId: aladdin.galaxy.v1.GalaxyService.DeleteVersion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteVersionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteVersionResponse'
  /aladdin.galaxy.v1.GalaxyService/ValidateDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ValidateDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        校验**当前草稿的清单**能不能发布。**编辑器提示与发布前置校验共用这一个
         入口。**

         前端**不得**复写一套引用解析：两端各写一份的表现是"提示说没问题、发布
         说不行"（或反过来），而用户无法从任何一个提示里知道哪句是真的。它返回的
         是一个**问题清单**而不是单个错误——界面要的是"哪几处有问题"。
         存储不可用这类故障仍然以 RPC 错误返回，与"内容有问题"分开。

         它校验的是**已保存的草稿**，请求里不带内容：写入只有一条路径（命令行
         push 整组），因此"校验一份还没保存的内容"这个形状不存在。

         它只读，但**不**标 idempotency_level：标了就等于同时接受 GET，而这条
         路径要读对象存储、可能较慢，不适合被当作可缓存的安全方法。
      operationId: aladdin.galaxy.v1.GalaxyService.ValidateDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ValidateDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ValidateDraftResponse'
  /aladdin.galaxy.v1.GalaxyService/PreviewDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: PreviewDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        把当前草稿渲染成一份可以放进沙箱 iframe 的 HTML，供**只有本人能看**的
         预览使用。

         **渲染在服务端，与发布共用同一段实现**：`docs` 形态的 markdown → HTML
         只有一处实现，网页端不再引第二个渲染器——两份实现迟早漂移，而用户看到
         的是"预览好好的、发布出来不一样"。

         它复用**编辑态**的那套地址：`asset://` 记号被换成短时预签名地址，因此
         预览里的图会随地址过期而显示不出来，刷新即得到新地址。预览不承诺与发布
         态逐像素一致（见 docs/design/galaxy/authoring.md）。
      operationId: aladdin.galaxy.v1.GalaxyService.PreviewDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.PreviewDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.PreviewDraftResponse'
  /aladdin.galaxy.v1.GalaxyService/BeginContentUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: BeginContentUpload
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        开始一次**内容对象**（文本条目）的上传：签发一份直传凭证。

         内容对象与资产走**同一条直传链路**，差别只有三处：键按内容摘要、类型由
         路径与形态派生（不存在"声明"这一层）、不进公开区。

         **按内容摘要寻址对写入提了一条硬性约束：仅当对象不存在时才允许写入。**
         否则一个伪造的摘要会落到另一个版本已经在用的键上，把那个对象改写掉——
         而那是"版本不可变"的反面。凭证带"禁止覆盖"的写入条件，提交时服务端再
         读回核对一次摘要。
      operationId: aladdin.galaxy.v1.GalaxyService.BeginContentUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.BeginContentUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.BeginContentUploadResponse'
  /aladdin.galaxy.v1.GalaxyService/CommitContentUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: CommitContentUpload
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        提交一次内容对象上传：读回对象、核对摘要。

         **摘要是寻址键，而服务端没有字节可以自己算它**——它由上传方声明。因此
         写入之后必须读回核对一遍，不一致即删除该对象并拒绝。
      operationId: aladdin.galaxy.v1.GalaxyService.CommitContentUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.CommitContentUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.CommitContentUploadResponse'
  /aladdin.galaxy.v1.GalaxyService/ListAssets:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ListAssets
      description: |-
        **鉴权**：需要权限 `galaxy.asset.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出工程资产库里的资产，含**短时有效**的读取地址。
      operationId: aladdin.galaxy.v1.GalaxyService.ListAssets
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ListAssetsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ListAssetsResponse'
  /aladdin.galaxy.v1.GalaxyService/BeginAssetUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: BeginAssetUpload
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        开始一次资产上传：分配资产标识并签发一份直传凭证。

         **字节不经过服务端**（见 docs/design/objectstore/README.md）。服务端在这里
         做三件事：校验调用的工程属于调用者、校验**声明的**内容类型在白名单内、
         按声明的大小早退；然后把"只许写这一个键、类型与大小受条件约束"的策略交给
         对象存储，由它执行。

         **类型与摘要都是上传方声明的，服务端不看字节。** 类型决定此后下发时回给
         浏览器的内容类型，而白名单里没有任何可执行类型——因此公开区上的对象永远
         以一个无害类型下发；摘要则在上架到公开区时被核对，不一致即拒绝发布。
      operationId: aladdin.galaxy.v1.GalaxyService.BeginAssetUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.BeginAssetUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.BeginAssetUploadResponse'
  /aladdin.galaxy.v1.GalaxyService/CommitAssetUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: CommitAssetUpload
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        提交一次资产上传：核对字节确实到了，写入资产元数据。

         签发之后客户端传了什么、传没传完，服务端都不知道，因此提交要对那个键做
         一次 Head：不存在即失败，字节数超过上限即失败并删除对象。**没有提交的
         上传不会进入任何清单**（元数据行不存在）。
      operationId: aladdin.galaxy.v1.GalaxyService.CommitAssetUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.CommitAssetUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.CommitAssetUploadResponse'
  /aladdin.galaxy.v1.GalaxyService/DeleteAsset:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: DeleteAsset
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        删除一个资产。**被任一版本的文件清单引用时拒绝**，错误信息指出被哪些
         版本引用。

         拒绝的理由是版本不可变的含义包括"它此后永远可以发布"：一个引用了已删
         除资产的版本必然在校验阶段失败，而那时用户看到一句"资产不存在"，却无法
         从版本内容里知道该怎么做。把问题挡在它产生的地方。
      operationId: aladdin.galaxy.v1.GalaxyService.DeleteAsset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteAssetResponse'
  /aladdin.galaxy.v1.GalaxyService/Publish:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.publish
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: Publish
      description: |-
        **鉴权**：需要权限 `galaxy.project.publish`；作用域取自凭证的默认作用域。

        发布一个版本：校验、把引用的资产上架到公开区、落库产物清单、切换发布指针。

         **只能发布版本，不能发布草稿**——草稿是可变的，"发布一个可变的东西"
         没有意义。草稿清单不会被读取。

         发布域未配置时这一项不可用（见 GetCapabilities）。
      operationId: aladdin.galaxy.v1.GalaxyService.Publish
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.PublishRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.PublishResponse'
  /aladdin.galaxy.v1.GalaxyService/Unpublish:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.publish
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: Unpublish
      description: |-
        **鉴权**：需要权限 `galaxy.project.publish`；作用域取自凭证的默认作用域。

        撤回发布：把发布指针置空，地址立刻不可达。

         发布记录保留，因此可以重新发布同一个版本；公开区的副本不因撤回而删除。
         撤回用发布那一码——它是发布的反向操作，不给它单独一码不会带来任何安全
         收益，只会让"发布得出去、收不回来"变成一个可以只授一半的组合。
      operationId: aladdin.galaxy.v1.GalaxyService.Unpublish
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.UnpublishRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.UnpublishResponse'
components:
  schemas:
    aladdin.galaxy.v1.MediaKind:
      type: string
      title: MediaKind
      enum:
        - MEDIA_KIND_UNSPECIFIED
        - MEDIA_KIND_IMAGE
        - MEDIA_KIND_VIDEO
        - MEDIA_KIND_AUDIO
        - MEDIA_KIND_FONT
      description: |-
        MediaKind 是资产按媒体分出的类别。

         它决定的是**用哪一档大小上限**：一张图与一段视频的合理体积差两个数量级，
         用同一个上限卡两者，要么放过一张过大的图，要么拒掉一段正常的视频。它同时
         是对象键里的一段（见 docs/design/galaxy/asset-library.md）。
    aladdin.galaxy.v1.SiteForm:
      type: string
      title: SiteForm
      enum:
        - SITE_FORM_UNSPECIFIED
        - SITE_FORM_STATIC
        - SITE_FORM_DOCS
      description: |-
        SiteForm 是工程的站点形态。

         它在**创建时**定下，此后不可改：形态决定已保存版本的发布语义，允许改形态
         等于让历史版本的产物无法复现。两种形态的差别落在入口、渲染与扩展名白名单
         三处（见 docs/design/galaxy/site-model.md），**没有一处在对象存储的键上**。
    aladdin.galaxy.v1.Asset:
      type: object
      properties:
        id:
          type: string
          title: id
        mediaType:
          type: string
          title: media_type
          description: |-
            媒体类型。**上传方声明的**，服务端只校验它在白名单内，并把它作为此后
             下发时回给浏览器的内容类型。声明不等于验证（见 objectstore）。
        kind:
          allOf:
            - title: kind
              description: 类别。它决定大小上限，也是对象键里的一段。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.MediaKind'
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: 字节数。它取自提交时对对象的核对，不是声明值。
        filename:
          type: string
          title: filename
          description: 原始文件名。**仅供展示与排障**：它不进对象键，不参与任何判断。
        uploadedAt:
          type: string
          title: uploaded_at
        url:
          type: string
          title: url
          description: |-
            **短时有效**的预签名读取地址，客户端直接放进 <img src>。

             这个地址在有效期内谁拿到都能用，它是一份短期凭证。这正是"未发布的资产
             里不得承载秘密"这条约束的来源。过期后重新调用 ListAssets 即得到新地址。

             未配置私有桶时为空。
      title: Asset
      additionalProperties: false
      description: |-
        Asset 是工程资产库里的一个媒体文件。

         字节在对象存储，这里只有元数据与一个短时读取地址。
    aladdin.galaxy.v1.AssetKindLimit:
      type: object
      properties:
        kind:
          allOf:
            - title: kind
            - $ref: '#/components/schemas/aladdin.galaxy.v1.MediaKind'
        maxBytes:
          type: integer
          title: max_bytes
      title: AssetKindLimit
      additionalProperties: false
      description: |-
        AssetKindLimit 是某一类资产的字节上限。

         它随能力下发，让客户端在选文件时就早退，免得把一个几十 MB 的文件整个传
         上来只为了被拒。**服务端仍然是权威**：客户端这一判断只是省一次往返，
         不是一条安全边界。
    aladdin.galaxy.v1.BeginAssetUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        contentType:
          type: string
          title: content_type
          description: '**声明**的内容类型。服务端只校验它在白名单内。'
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: |-
            **声明**的字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
             大小上限由存储侧按内容类型执行。
      title: BeginAssetUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.BeginAssetUploadResponse:
      type: object
      properties:
        assetId:
          type: string
          title: asset_id
          description: 本次上传的资产标识。提交时要把它带回来。
        upload:
          allOf:
            - title: upload
              description: 直传凭证。**只允许写、只对这一个键有效、短时有效。**
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginAssetUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.BeginContentUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        digest:
          type: string
          title: digest
          description: |-
            **声明的**内容摘要（SHA-256 十六进制）。服务端用它和工程标识组成私有区
             对象键（不跨工程共享）。已存在则不必再传。
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: |-
            **声明的**字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
             大小上限由存储侧按策略执行。
      title: BeginContentUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.BeginContentUploadResponse:
      type: object
      properties:
        alreadyExists:
          type: boolean
          title: already_exists
          description: |-
            为真表示这个内容对象已经存在，客户端无需上传（也无需提交）。

             这正是"同一份未改动的文件在多个版本之间共享一个对象"在接口上的样子：
             改一个字只产生一个新对象，没改的文件一次上传都不用做。
        upload:
          allOf:
            - title: upload
              description: |-
                直传凭证。**只允许写、只对这一个键有效、短时有效、且不允许覆盖已有
                 对象。** already_exists 为真时为空。
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginContentUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.Capabilities:
      type: object
      properties:
        assetUploadEnabled:
          type: boolean
          title: asset_upload_enabled
          description: 是否配置了对象存储桶。为假时不渲染上传入口与资产区。
        publishEnabled:
          type: boolean
          title: publish_enabled
          description: 是否可用发布。为假时不渲染发布入口。
        maxTextBytes:
          type: integer
          title: max_text_bytes
          description: 单份文本条目的字节上限。
        maxFileSetBytes:
          type: integer
          title: max_file_set_bytes
          description: 整组文件（清单里所有文本条目之和）的字节上限。
        maxFiles:
          type: integer
          title: max_files
          description: 整组的文件数上限。
        assetLimits:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.AssetKindLimit'
          title: asset_limits
          description: 各类资产的字节上限。
      title: Capabilities
      additionalProperties: false
      description: |-
        Capabilities 是当前部署下创作能力的边界。

         两个布尔项是**部署形态**的公开事实，不因调用者而异：未配置对象存储时
         素材传不了，未配置发布域时页面发不出去，而工程与版本照常可用。
    aladdin.galaxy.v1.CommitAssetUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
        contentType:
          type: string
          title: content_type
          description: |-
            **声明**的内容类型。**两次调用之间服务端不保留任何状态**（那正是"未提交
             的上传不留痕迹"的实现方式），因此它在这里被再次声明并重新校验。
        digest:
          type: string
          title: digest
          description: |-
            **声明**的内容摘要（SHA-256 的十六进制）。

             它是公开区地址的键，而服务端没有字节可以算它。**它在被使用之前会被核对**：
             上架到公开区时服务端读回对象算一遍，不一致即拒绝发布——因此一条假的摘要
             不会把公开区的地址指向别人的内容。
        filename:
          type: string
          title: filename
          description: |-
            展示用的原始文件名。**不进对象键，不参与任何判断**：它可能含路径分隔符、
             控制字符以及别人的名字，把它拼进存储路径就是把一段不可信输入拼进路径。
      title: CommitAssetUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.CommitAssetUploadResponse:
      type: object
      properties:
        asset:
          allOf:
            - title: asset
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
      title: CommitAssetUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.CommitContentUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        digest:
          type: string
          title: digest
          description: |-
            与服务端核对的那个摘要。**两次调用之间服务端不保留任何状态**（那正是
             "未提交的上传不留痕迹"的实现方式），因此它在这里被再次声明。
      title: CommitContentUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.CommitContentUploadResponse:
      type: object
      title: CommitContentUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        form:
          allOf:
            - title: form
              description: 形态。**必填**：它创建时定下、此后不可改，因此没有"以后再定"这个形状。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.SiteForm'
      title: CreateProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.CreateProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: CreateProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteAssetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
      title: DeleteAssetRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteAssetResponse:
      type: object
      title: DeleteAssetResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: DeleteProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteProjectResponse:
      type: object
      title: DeleteProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
      title: DeleteVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteVersionResponse:
      type: object
      title: DeleteVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.Draft:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
        updatedAt:
          type: string
          title: updated_at
          description: 最后一次推送的时间。从未推送过草稿时为空。
      title: Draft
      additionalProperties: false
      description: |-
        Draft 是工程当前正在编辑的文件清单。

         它不是版本：随时可改，改它不产生版本，不参与发布，也不保证可退回。
    aladdin.galaxy.v1.FileEntry:
      type: object
      allOf:
        - anyOf:
            - required:
                - assetId
            - required:
                - digest
            - not:
                anyOf:
                  - required:
                      - assetId
                  - required:
                      - digest
      anyOf:
        - required:
            - assetId
        - required:
            - digest
        - not:
            anyOf:
              - required:
                  - assetId
              - required:
                  - digest
      properties:
        path:
          type: string
          title: path
          description: |-
            相对路径。它是**公开地址的一部分**，因此字符集受 URL 安全字符集约束，
             不含 `..`、不以 `/` 开头或结尾、不含空段。
        digest:
          type: string
          title: digest
          description: |-
            文本条目：字节的内容摘要（SHA-256 十六进制）。私有区对象键由工程标识与
             它共同构成（`galaxy/<工程标识>/text/<摘要>`），不跨工程共享。
        assetId:
          type: string
          title: asset_id
          description: 资产条目：资产库里的一个资产标识。
        url:
          type: string
          title: url
          description: |-
            **短时有效**的读取地址，客户端直接取字节。只有列出清单的方法（GetDraft、
             GetVersion）会填充它；写入路径（PushDraft）忽略它。

             它是一份短期凭证，因此**未发布的资产里不得承载秘密**。过期后重新读取
             清单即得到新地址。
      title: FileEntry
      additionalProperties: false
      description: |-
        FileEntry 是文件组里的一条条目：一个路径，加上它的字节从哪来。

         两类条目恰好对应"字节在哪"的两种答案（见 docs/design/galaxy/site-model.md）：
         文本条目的字节是按**内容摘要**寻址的内容对象；资产条目的字节是资产库里的
         一个媒体文件。**清单里没有字节本身**，因此同一个工程内、同一份未改动文件在
         多个版本、多次发布之间共享同一个对象。不跨工程共享。
    aladdin.galaxy.v1.GetCapabilitiesRequest:
      type: object
      title: GetCapabilitiesRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetCapabilitiesResponse:
      type: object
      properties:
        capabilities:
          allOf:
            - title: capabilities
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Capabilities'
      title: GetCapabilitiesResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: GetDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetDraftResponse:
      type: object
      properties:
        draft:
          allOf:
            - title: draft
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Draft'
      title: GetDraftResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: GetProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: GetProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
      title: GetVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetVersionResponse:
      type: object
      properties:
        version:
          allOf:
            - title: version
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
      title: GetVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListAssetsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: ListAssetsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListAssetsResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
          title: assets
      title: ListAssetsResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListProjectsRequest:
      type: object
      title: ListProjectsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
          title: projects
      title: ListProjectsResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListVersionsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: ListVersionsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
          title: versions
      title: ListVersionsResponse
      additionalProperties: false
    aladdin.galaxy.v1.PreviewDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        path:
          type: string
          title: path
          description: |-
            `static` 形态下要预览的那一页；为空表示入口页。`docs` 形态忽略它
             ——整站被拼成一份，页间跳转靠文内锚点。
      title: PreviewDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.PreviewDraftResponse:
      type: object
      properties:
        html:
          type: string
          title: html
          description: |-
            一份可以直接放进沙箱 iframe 的 HTML。**它不改用户内容**，只把 `asset://`
             记号换成短时预签名地址，并按形态渲染 markdown。
      title: PreviewDraftResponse
      additionalProperties: false
    aladdin.galaxy.v1.Project:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |-
            工程标识。由服务端分配，不可猜、不可改、不复用。

             它是**发布地址的一部分**，而发布态是公开匿名的：拿到地址的人能看，
             猜不出地址的人看不到（见 docs/design/galaxy/README.md 的"发布即公开"）。
        name:
          type: string
          title: name
          description: 名称。可改。**仅用于本人识别**，不是查找键，不进发布地址。
        description:
          type: string
          title: description
          description: 简介。为空表示未填写。
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
        published:
          type: boolean
          title: published
          description: 当前是否处于发布态。
        publishedVersionId:
          type: string
          title: published_version_id
          description: 当前发布指向的版本标识。未发布时为空。
        publishedUrl:
          type: string
          title: published_url
          description: |-
            发布地址，形如 <发布域>/g/<工程标识>。未发布时为空。

             **地址由服务端算好**，客户端不拼：记号解析生成的地址、内容安全策略里的
             允许来源与这个地址都从同一批配置值派生，客户端再拼一份就是又一个来源。
        publishedAt:
          type: string
          title: published_at
          description: 当前发布的生效时间。未发布时为空。
        form:
          allOf:
            - title: form
              description: 形态。创建时定下，此后不可改。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.SiteForm'
        baseUrl:
          type: string
          title: base_url
          description: |-
            **发布根**，形如 <发布域>/g/<工程标识>/，供构建命令使用（vite 的 --base）。

             配置了发布域时始终有值，与是否已发布无关：构建产物里的绝对路径要成立，
             靠的是它，而不是"页面已经发出去"。未配置发布域时为空。
      title: Project
      additionalProperties: false
      description: |-
        Project 是一个创作单元的元数据。

         **不带草稿清单、版本清单与资产字节。** 列表接口会读这一行，把清单挂上来
         是一笔与列表无关的代价；整张表也不含任何字节。
    aladdin.galaxy.v1.Publication:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        publishedAt:
          type: string
          title: published_at
        url:
          type: string
          title: url
          description: 发布地址，与 Project.published_url 同一处派生。
      title: Publication
      additionalProperties: false
      description: |-
        Publication 是一次发布的产物记录。

         对外地址按**产物清单**分派：文本条目由服务端在它自己的路径上给出，资产
         条目重定向到公开区。
    aladdin.galaxy.v1.PublishRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
          description: 要发布的版本。**必填**：没有"发布当前草稿"这种形状。
      title: PublishRequest
      additionalProperties: false
    aladdin.galaxy.v1.PublishResponse:
      type: object
      properties:
        publication:
          allOf:
            - title: publication
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Publication'
        project:
          allOf:
            - title: project
              description: 生效之后的工程状态，含新的发布地址。前端据此刷新而不必再查一次。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: PublishResponse
      additionalProperties: false
    aladdin.galaxy.v1.PushDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: 期望的完整清单。条目只引用已经上传好的对象，因此这里的 url 被忽略。
      title: PushDraftRequest
      additionalProperties: false
      description: PushDraftRequest 表达的是草稿的**期望完整状态**，不是增量。
    aladdin.galaxy.v1.PushDraftResponse:
      type: object
      properties:
        draft:
          allOf:
            - title: draft
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Draft'
      title: PushDraftResponse
      additionalProperties: false
      description: |-
        返回推送之后的草稿，而不是一个成功标志：客户端刚做过一次会改变现状的
         操作，让它在同一次往返里拿到新现状，比再发一次查询更省事。
    aladdin.galaxy.v1.SaveVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: SaveVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.SaveVersionResponse:
      type: object
      properties:
        version:
          allOf:
            - title: version
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
      title: SaveVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.UnpublishRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: UnpublishRequest
      additionalProperties: false
    aladdin.galaxy.v1.UnpublishResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: UnpublishResponse
      additionalProperties: false
    aladdin.galaxy.v1.UpdateProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
          description: 期望的完整状态，空串表示清空。
        description:
          type: string
          title: description
      title: UpdateProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.UpdateProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: UpdateProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.ValidateDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: ValidateDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.ValidateDraftResponse:
      type: object
      properties:
        problems:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ValidationProblem'
          title: problems
      title: ValidateDraftResponse
      additionalProperties: false
      description: |-
        问题为空表示这份草稿可以发布。**它是发布前置校验的同一份规则**，因此
         "这里通过"与"发布能成功"是同一个结论，不会漂移。
    aladdin.galaxy.v1.ValidationProblem:
      type: object
      properties:
        message:
          type: string
          title: message
        path:
          type: string
          title: path
          description: 出问题的文件路径。与行无关的问题（如整组超限）为空。
        line:
          type: integer
          title: line
          format: int32
          description: 出问题的行号（从 1 开始）。0 表示与行无关。
      title: ValidationProblem
      additionalProperties: false
      description: |-
        ValidationProblem 是校验发现的一处问题。

         message 里**带上出问题的文件与位置**：只说"有引用不合法"会让用户在一组
         文件里自己找。
    aladdin.galaxy.v1.Version:
      type: object
      properties:
        id:
          type: string
          title: id
        seq:
          oneOf:
            - type: integer
              title: integer
              format: int64
            - type: string
              title: string
          title: seq
          description: |-
            在工程内递增的序号。**仅用于展示与排序，不是标识。**
             删除一个版本会让后续序号出现空洞，这是可接受的。
        savedAt:
          type: string
          title: saved_at
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: 保存那一刻草稿的清单。**写入后不再修改。** 地址只有 GetVersion 填充。
        renderRulesVersion:
          type: integer
          title: render_rules_version
          format: int32
          description: |-
            保存时所处的渲染规则版本。只有 `docs` 形态使用它，重新发布时按它渲染
             而不是按当前最新的——否则"撤回后重新发布同一版本，产物逐字相同"会在
             渲染器升级的那天悄悄失效。
      title: Version
      additionalProperties: false
      description: Version 是文件清单的一次不可变快照。
    aladdin.objectstore.v1.DirectUploadCredential:
      type: object
      properties:
        bucket:
          type: string
          title: bucket
          description: 桶名（含 APPID），不是地址：客户端 SDK 要的是桶名与地域。
        region:
          type: string
          title: region
          description: 桶所在地域，形如 ap-guangzhou。
        key:
          type: string
          title: key
          description: 这次唯一允许写入的对象键。由服务端分配，客户端改不了。
        secretId:
          type: string
          title: secret_id
          description: 临时凭证三元组。
        secretKey:
          type: string
          title: secret_key
        sessionToken:
          type: string
          title: session_token
        expiresAt:
          type: string
          title: expires_at
          description: 凭证的失效时刻。它是**给客户端的提示值**，实际失效以对象存储的判断为准。
        forbidOverwrite:
          type: boolean
          title: forbid_overwrite
          description: |-
            写入是否**禁止覆盖已存在的对象**。

             内容对象（galaxy 的文本条目）按**内容摘要**寻址，因此"仅当不存在时写入"
             是它成立的前提：一个伪造的摘要若落到另一个版本已经在用的键上，会把那个
             对象改写掉——而那是"版本不可变"的反面。为真时客户端在写入请求上带禁止
             覆盖的条件，由对象存储执行。

             头像与资产按标识寻址、一个标识一个对象，因此它是假。
      title: DirectUploadCredential
      additionalProperties: false
      description: |-
        DirectUploadCredential 是一次直传所需的全部取值。

         它是**一份短时凭证**：在有效期内，拿到它的人可以用它往 key 上写一次。因此
         它只下发给发起上传的那个客户端。

         **它只允许写。** 约束写在换取来的策略里，由对象存储执行：动作只有写入对象，
         资源只有 key 这一个对象，条件限定声明的内容类型与请求体长度上限。

         **它不得进日志。** 把它写进日志等于把一次写入的能力留在了日志文件里。
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.

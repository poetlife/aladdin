openapi: 3.1.0
info:
  title: aladdin.galaxy.v1
paths:
  /aladdin.galaxy.v1.GalaxyService/GetCapabilities:
    post:
      x-aladdin-auth:
        kind: authenticated_only
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetCapabilities
      description: |-
        **鉴权**：需要登录。任何已认证主体均可调用。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取当前部署下创作能力的边界：能不能传素材、能不能发布、各项上限。

         它是**能力下发点**，与档案的 avatar_upload_enabled 同一取向：能力由
         服务端说，客户端不猜。前端据此不渲染未启用的入口，而不是渲染一个点了
         报错的控件。它退回的每一项都是部署形态的公开事实，不因调用者而异。
      operationId: aladdin.galaxy.v1.GalaxyService.GetCapabilities
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetCapabilitiesRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetCapabilitiesResponse'
  /aladdin.galaxy.v1.GalaxyService/ListProjects:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ListProjects
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出调用者自己的工程。**只有这一个列表入口，且它的范围由凭证决定。**

         刻意没有"列出所有工程"或"列出某个主体的工程"的形状：工程标识不可猜
         是发布态匿名可读的唯一防线，任何枚举入口都会把它降级成"打开就能逛"。
      operationId: aladdin.galaxy.v1.GalaxyService.ListProjects
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ListProjectsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ListProjectsResponse'
  /aladdin.galaxy.v1.GalaxyService/CreateProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: CreateProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        创建一个工程，并选一个或多个**内容槽**。标识由服务端分配，不可猜、不可改、
         不复用。

         **至少选一个槽，此后只增不删**（见 AddProjectSlot）。每个槽各有自己的草稿、
         版本、发布指针与地址（见 docs/design/galaxy/site-model.md）。

         名称**不参与任何查找**：不按名称查工程、不加唯一约束、不进发布地址。
         一旦名称成为查找键，它就成了一条可以被改名或抢注改写的路径。
      operationId: aladdin.galaxy.v1.GalaxyService.CreateProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.CreateProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.CreateProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/AddProjectSlot:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: AddProjectSlot
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        给一个已有工程加一个内容槽。

         **单向**：没有"删掉一个槽"的对应方法——槽的语义与地址是固定的，已有的版本
         与地址都挂在它上面，因此删除要单独论证（见 site-model.md）。**加一个槽不
         改变另一个槽**：那个槽的草稿、版本、发布指针与地址都原样。
      operationId: aladdin.galaxy.v1.GalaxyService.AddProjectSlot
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.AddProjectSlotRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.AddProjectSlotResponse'
  /aladdin.galaxy.v1.GalaxyService/GetProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取一个工程的元数据。不含草稿清单、版本清单与资产字节。
      operationId: aladdin.galaxy.v1.GalaxyService.GetProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/UpdateProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: UpdateProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        修改工程的名称与简介。请求表达的是**期望的完整状态**，空串表示清空。

         **不含内容槽**：槽只增不删，且"有哪些槽"由 AddProjectSlot 回答，因此它不在
         这个请求的形状里。
      operationId: aladdin.galaxy.v1.GalaxyService.UpdateProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.UpdateProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.UpdateProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/DeleteProject:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: DeleteProject
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        删除一个工程。**连带删除它的全部版本、资产与发布记录**，因此已发布的
         地址立刻变成"不存在"。公开区上已上架的字节不回收（见发布一节）。
      operationId: aladdin.galaxy.v1.GalaxyService.DeleteProject
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteProjectRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteProjectResponse'
  /aladdin.galaxy.v1.GalaxyService/GetDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取工程的当前草稿清单，每一项带一条短时读取地址。

         草稿行是惰性创建的：从未推送过草稿时清单为空。地址由客户端直连取字节，
         服务端不代理（见 docs/design/galaxy/asset-library.md）。
      operationId: aladdin.galaxy.v1.GalaxyService.GetDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetDraftResponse'
  /aladdin.galaxy.v1.GalaxyService/PushDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: PushDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        以给定的清单**整组替换**草稿（它不产生版本）。

         它表达的是**期望的完整状态**，不是增量：清单里没有的路径就是"删掉"。
         否则"我到底删没删掉那一份"会变成一个需要读命令行实现才能回答的问题。

         **这是内容唯一的写入路径**（命令行）。网页端只读：两个入口并存会引出
         "网页上刚改的一句被一次 push 静默盖掉"这类只在两个入口之间发生的冲突，
         收成一条路径，那份冲突连同它需要的基线校验一起不存在。

         请求里的条目**只引用已经上传好的对象**（文本条目是内容摘要，资产条目是
         资产标识），因此本方法不带字节，也不触发任何上传。
      operationId: aladdin.galaxy.v1.GalaxyService.PushDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.PushDraftRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.PushDraftResponse'
  /aladdin.galaxy.v1.GalaxyService/SaveVersion:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: SaveVersion
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        把草稿的当前清单保存成一个**不可变**版本。

         保存即冻结：此后改草稿、改工程名称、删资产都不改变这个版本读回的内容。
         连续保存两次相同清单产生两个版本，而不是"检测到重复就不新增"——两份
         看起来一样的清单对用户是两次不同的保存动作。
      operationId: aladdin.galaxy.v1.GalaxyService.SaveVersion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.SaveVersionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.SaveVersionResponse'
  /aladdin.galaxy.v1.GalaxyService/ListVersions:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ListVersions
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出工程的版本，按序号排序。清单很小，因此**列表也带清单**（不带地址）。
      operationId: aladdin.galaxy.v1.GalaxyService.ListVersions
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ListVersionsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ListVersionsResponse'
  /aladdin.galaxy.v1.GalaxyService/GetVersion:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: GetVersion
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        读取一个版本，含清单与每一项的短时读取地址。保存时的内容此后逐字不变。
      operationId: aladdin.galaxy.v1.GalaxyService.GetVersion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.GetVersionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.GetVersionResponse'
  /aladdin.galaxy.v1.GalaxyService/DeleteVersion:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: DeleteVersion
      description: |-
        **鉴权**：需要权限 `galaxy.project.write`；作用域取自凭证的默认作用域。

        删除一个版本。**被当前发布指向的版本不可删**——那会让发布地址指向一个
         不存在的版本。序号不因删除而重排，因此删中间一个会留下空洞。
      operationId: aladdin.galaxy.v1.GalaxyService.DeleteVersion
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteVersionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteVersionResponse'
  /aladdin.galaxy.v1.GalaxyService/ValidateDraft:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.read
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ValidateDraft
      description: |-
        **鉴权**：需要权限 `galaxy.project.read`；作用域取自凭证的默认作用域。

        校验**当前草稿的清单**能不能发布。**编辑器提示与发布前置校验共用这一个
         入口。**

         前端**不得**复写一套引用解析：两端各写一份的表现是"提示说没问题、发布
         说不行"（或反过来），而用户无法从任何一个提示里知道哪句是真的。它返回的
         是一个**问题清单**而不是单个错误——界面要的是"哪几处有问题"。
         存储不可用这类故障仍然以 RPC 错误返回，与"内容有问题"分开。

         它校验的是**已保存的草稿**，请求里不带内容：写入只有一条路径（命令行
         push 整组），因此"校验一份还没保存的内容"这个形状不存在。

         它只读，但**不**标 idempotency_level：标了就等于同时接受 GET，而这条
         路径要读对象存储、可能较慢，不适合被当作可缓存的安全方法。
      operationId: aladdin.galaxy.v1.GalaxyService.ValidateDraft
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ValidateDraftRequest'

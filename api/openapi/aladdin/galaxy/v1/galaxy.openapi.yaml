          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.DeleteAssetResponse'
  /aladdin.galaxy.v1.GalaxyService/UpdateAsset:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: UpdateAsset
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        改一个资产的展示标题、标签与备注。

         **它只改"说明层"。** 资产有不可变与可变两层（见
         docs/design/galaxy/asset-library.md）：字节、内容摘要、媒体类型、类别与
         字节数在改动前后逐字不变，因此公开区地址不变、已发布页面拿到的还是同一
         份字节。接口面上不存在"替换资产字节"的方法。

         请求表达**期望的完整状态**（与 UpdateProject 同取向）：空串清空标题或
         备注，标签以请求集合**整体替换**。
      operationId: aladdin.galaxy.v1.GalaxyService.UpdateAsset
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.UpdateAssetRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.UpdateAssetResponse'
  /aladdin.galaxy.v1.GalaxyService/Publish:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.publish
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: Publish
      description: |-
        **鉴权**：需要权限 `galaxy.project.publish`；作用域取自凭证的默认作用域。

        发布一个版本：校验、把引用的资产上架到公开区、落库产物清单、切换发布指针。

         **只能发布版本，不能发布草稿**——草稿是可变的，"发布一个可变的东西"
         没有意义。草稿清单不会被读取。

         发布域未配置时这一项不可用（见 GetCapabilities）。
      operationId: aladdin.galaxy.v1.GalaxyService.Publish
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.PublishRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.PublishResponse'
  /aladdin.galaxy.v1.GalaxyService/Unpublish:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.project.publish
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: Unpublish
      description: |-
        **鉴权**：需要权限 `galaxy.project.publish`；作用域取自凭证的默认作用域。

        撤回发布：把发布指针置空，地址立刻不可达。

         发布记录保留，因此可以重新发布同一个版本；公开区的副本不因撤回而删除。
         撤回用发布那一码——它是发布的反向操作，不给它单独一码不会带来任何安全
         收益，只会让"发布得出去、收不回来"变成一个可以只授一半的组合。
      operationId: aladdin.galaxy.v1.GalaxyService.Unpublish
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.UnpublishRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.UnpublishResponse'
  /aladdin.galaxy.v1.GalaxyService/ResolveSharedPage:
    post:
      x-aladdin-auth:
        kind: public
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: ResolveSharedPage
      description: |-
        **鉴权**：公开接口，无需认证。

        把一条**主站分享路径**解析成它在发布域上的内容地址。

         主站壳（`<主站>/g/<工程标识>[/docs][/路径]`）用它问出 iframe 该指向哪里。
         **槽的判定在服务端**（与发布地址那条 HTTP 入口共用同一处形状解析），因此
         请求给的是整条路径，响应给的是整条内容地址——客户端两头都不拼。

         它是**公开**的：访客打开一条分享地址时没有会话，而"分享给没登录的人"正是
         这个入口唯一的用途（见 docs/design/rbac/server-permissions.md 的公开方法白
         名单）。它只凭工程标识作答，与发布地址那条 HTTP 入口回答的是同一件事。

         **否定结论只有一个**：未发布、已撤回、该槽未启用、工程不存在、标识没被猜
         中、路径不在集合里，一律返回空的 `content_url`，而不是 RPC 错误——错误码会
         成为一个"这个标识是真的"的第二信号（见 docs/design/galaxy/publication.md 的
         "主站壳"）。
      operationId: aladdin.galaxy.v1.GalaxyService.ResolveSharedPage
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ResolveSharedPageRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ResolveSharedPageResponse'
components:
  schemas:
    aladdin.galaxy.v1.ContentSlot:
      type: string
      title: ContentSlot
      enum:
        - CONTENT_SLOT_UNSPECIFIED
        - CONTENT_SLOT_SITE
        - CONTENT_SLOT_DOCS
      description: |-
        ContentSlot 是工程的一块独立内容。

         一个工程有一到两个槽，**创建时至少选一个，此后只增不删**。每个槽各有自己的
         草稿、版本、发布指针与地址，**两个槽互不影响**：在一个槽上的任何动作都不改变
         另一个槽。两种槽的差别落在入口、渲染与扩展名白名单三处（见
         docs/design/galaxy/site-model.md），**没有一处在对象存储的键上**。
    aladdin.galaxy.v1.MediaKind:
      type: string
      title: MediaKind
      enum:
        - MEDIA_KIND_UNSPECIFIED
        - MEDIA_KIND_IMAGE
        - MEDIA_KIND_VIDEO
        - MEDIA_KIND_AUDIO
        - MEDIA_KIND_FONT
      description: |-
        MediaKind 是资产按媒体分出的类别。

         它决定的是**用哪一档大小上限**：一张图与一段视频的合理体积差两个数量级，
         用同一个上限卡两者，要么放过一张过大的图，要么拒掉一段正常的视频。它同时
         是对象键里的一段（见 docs/design/galaxy/asset-library.md）。
    aladdin.galaxy.v1.AddProjectSlotRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 要加的槽。**必填**：没有"随便加一个"这个形状。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: AddProjectSlotRequest
      additionalProperties: false
    aladdin.galaxy.v1.AddProjectSlotResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
              description: 加完之后完整的工程状态（含两个槽各自的发布状态）。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: AddProjectSlotResponse
      additionalProperties: false
    aladdin.galaxy.v1.Asset:
      type: object
      properties:
        id:
          type: string
          title: id
        mediaType:
          type: string
          title: media_type
          description: |-
            媒体类型。**上传方声明的**，服务端只校验它在白名单内，并把它作为此后
             下发时回给浏览器的内容类型。声明不等于验证（见 objectstore）。
        kind:
          allOf:
            - title: kind
              description: 类别。它决定大小上限，也是对象键里的一段。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.MediaKind'
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: 字节数。它取自提交时对对象的核对，不是声明值。
        filename:
          type: string
          title: filename
          description: 原始文件名。**仅供展示与排障**：它不进对象键，不参与任何判断。
        uploadedAt:
          type: string
          title: uploaded_at
        url:
          type: string
          title: url
          description: |-
            **短时有效**的预签名读取地址，客户端直接放进 <img src>。

             这个地址在有效期内谁拿到都能用，它是一份短期凭证。这正是"未发布的资产
             里不得承载秘密"这条约束的来源。过期后重新调用 ListAssets 即得到新地址。

             未配置私有桶时为空。
        title:
          type: string
          title: title
          description: |-
            展示标题。**与 filename 分离**：文件名常是工具生成的乱码或不可信，
             而标题是给人看的。空表示没有标题，此时界面回退到 filename 展示。
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            标签。工程内的自由字符串，不是全局字典，也不是权限资源。

             **值已归一化**（trim、小写、去重并升序、长度与数量受限，见
             asset-library.md）：拿到的是唯一的那一份形式，调用方不必也不得自己再归一化
             或再排序一次。
        notes:
          type: string
          title: notes
          description: 备注。纯文本，不是 Markdown。**不进对象键、不进发布产物、不进日志原文**。
      title: Asset
      additionalProperties: false
      description: |-
        Asset 是工程资产库里的一个媒体文件。

         字节在对象存储，这里只有元数据与一个短时读取地址。

         元数据分**两层**（见 docs/design/galaxy/asset-library.md）：字节层
         （media_type、kind、size_bytes）**不可变**；说明层（title、tags、notes）
         **可改**，改它们不动字节层的任何一项，也不进发布产物。
    aladdin.galaxy.v1.AssetKindLimit:
      type: object
      properties:
        kind:
          allOf:
            - title: kind
            - $ref: '#/components/schemas/aladdin.galaxy.v1.MediaKind'
        maxBytes:
          type: integer
          title: max_bytes
      title: AssetKindLimit
      additionalProperties: false
      description: |-
        AssetKindLimit 是某一类资产的字节上限。

         它随能力下发，让客户端在选文件时就早退，免得把一个几十 MB 的文件整个传
         上来只为了被拒。**服务端仍然是权威**：客户端这一判断只是省一次往返，
         不是一条安全边界。
    aladdin.galaxy.v1.BeginAssetUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        contentType:
          type: string
          title: content_type
          description: '**声明**的内容类型。服务端只校验它在白名单内。'
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: |-
            **声明**的字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
             大小上限由存储侧按内容类型执行。
      title: BeginAssetUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.BeginAssetUploadResponse:
      type: object
      properties:
        assetId:
          type: string
          title: asset_id
          description: 本次上传的资产标识。提交时要把它带回来。
        upload:
          allOf:
            - title: upload
              description: 直传凭证。**只允许写、只对这一个键有效、短时有效。**
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginAssetUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.BeginContentUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        digest:
          type: string
          title: digest
          description: |-
            **声明的**内容摘要（SHA-256 十六进制）。服务端用它和工程标识组成私有区
             对象键（不跨工程共享）。已存在则不必再传。
        sizeBytes:
          oneOf:
            - type: integer
              title: integer
            - type: string
              title: string
          title: size_bytes
          description: |-
            **声明的**字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
             大小上限由存储侧按策略执行。
      title: BeginContentUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.BeginContentUploadResponse:
      type: object
      properties:
        alreadyExists:
          type: boolean
          title: already_exists
          description: |-
            为真表示这个内容对象已经存在，客户端无需上传（也无需提交）。

             这正是"同一份未改动的文件在多个版本之间共享一个对象"在接口上的样子：
             改一个字只产生一个新对象，没改的文件一次上传都不用做。
        upload:
          allOf:
            - title: upload
              description: |-
                直传凭证。**只允许写、只对这一个键有效、短时有效、且不允许覆盖已有
                 对象。** already_exists 为真时为空。
            - $ref: '#/components/schemas/aladdin.objectstore.v1.DirectUploadCredential'
      title: BeginContentUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.Capabilities:
      type: object
      properties:
        assetUploadEnabled:
          type: boolean
          title: asset_upload_enabled
          description: 是否配置了对象存储桶。为假时不渲染上传入口与资产区。
        publishEnabled:
          type: boolean
          title: publish_enabled
          description: 是否可用发布。为假时不渲染发布入口。
        previewEnabled:
          type: boolean
          title: preview_enabled
          description: |-
            是否可用预览。为假时不渲染预览：预览走发布域上的一条通道，没有发布域的
             部署就没有预览（如实缺席，而不是给一份解析不了自己引用的文档）。
        maxTextBytes:
          type: integer
          title: max_text_bytes
          description: 单份文本条目的字节上限。
        maxFileSetBytes:
          type: integer
          title: max_file_set_bytes
          description: 整组文件（清单里所有文本条目之和）的字节上限。
        maxFiles:
          type: integer
          title: max_files
          description: 整组的文件数上限。
        assetLimits:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.AssetKindLimit'
          title: asset_limits
          description: 各类资产的字节上限。
      title: Capabilities
      additionalProperties: false
      description: |-
        Capabilities 是当前部署下创作能力的边界。

         两个布尔项是**部署形态**的公开事实，不因调用者而异：未配置对象存储时
         素材传不了，未配置发布域时页面发不出去，而工程与版本照常可用。
    aladdin.galaxy.v1.CommitAssetUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
        contentType:
          type: string
          title: content_type
          description: |-
            **声明**的内容类型。**两次调用之间服务端不保留任何状态**（那正是"未提交
             的上传不留痕迹"的实现方式），因此它在这里被再次声明并重新校验。
        digest:
          type: string
          title: digest
          description: |-
            **声明**的内容摘要（SHA-256 的十六进制）。

             它是公开区地址的键，而服务端没有字节可以算它。**它在被使用之前会被核对**：
             提交时核对它是不是那份字节的摘要（让存储侧算，或读回自己算），不一致即
             删除对象并拒绝——因此一条假的摘要不会把公开区的地址指向别人的内容。
        filename:
          type: string
          title: filename
          description: |-
            展示用的原始文件名。**不进对象键，不参与任何判断**：它可能含路径分隔符、
             控制字符以及别人的名字，把它拼进存储路径就是把一段不可信输入拼进路径。
        title:
          type: string
          title: title
          description: |-
            初始的说明层元数据，都可空（见 Asset 的 title / tags / notes）。

             与"提交之后再调 UpdateAsset"结果相同，区别只是少一次往返。
        tags:
          type: array
          items:
            type: string
          title: tags
        notes:
          type: string
          title: notes
      title: CommitAssetUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.CommitAssetUploadResponse:
      type: object
      properties:
        asset:
          allOf:
            - title: asset
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
      title: CommitAssetUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.CommitContentUploadRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        digest:
          type: string
          title: digest
          description: |-
            与服务端核对的那个摘要。**两次调用之间服务端不保留任何状态**（那正是
             "未提交的上传不留痕迹"的实现方式），因此它在这里被再次声明。
      title: CommitContentUploadRequest
      additionalProperties: false
    aladdin.galaxy.v1.CommitContentUploadResponse:
      type: object
      title: CommitContentUploadResponse
      additionalProperties: false
    aladdin.galaxy.v1.CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        slots:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
          title: slots
          description: 创建时要启用的内容槽。**至少一个、不重复**，此后只增不删（见 AddProjectSlot）。
      title: CreateProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.CreateProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: CreateProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteAssetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
      title: DeleteAssetRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteAssetResponse:
      type: object
      title: DeleteAssetResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: DeleteProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteProjectResponse:
      type: object
      title: DeleteProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.DeleteVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        slot:
          allOf:
            - title: slot
              description: 该版本所属的内容槽。版本按槽隔离，因此要给。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: DeleteVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.DeleteVersionResponse:
      type: object
      title: DeleteVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.Draft:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
        updatedAt:
          type: string
          title: updated_at
          description: 最后一次推送的时间。从未推送过草稿时为空。
        slot:
          allOf:
            - title: slot
              description: 这是哪个槽的草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: Draft
      additionalProperties: false
      description: |-
        Draft 是**某个内容槽**当前正在编辑的文件清单。

         它不是版本：随时可改，改它不产生版本，不参与发布，也不保证可退回。
    aladdin.galaxy.v1.FileEntry:
      type: object
      allOf:
        - anyOf:
            - required:
                - assetId
            - required:
                - digest
            - not:
                anyOf:
                  - required:
                      - assetId
                  - required:
                      - digest
      anyOf:
        - required:
            - assetId
        - required:
            - digest
        - not:
            anyOf:
              - required:
                  - assetId
              - required:
                  - digest
      properties:
        path:
          type: string
          title: path
          description: |-
            相对路径。它是**公开地址的一部分**，因此字符集受 URL 安全字符集约束，
             不含 `..`、不以 `/` 开头或结尾、不含空段。
        digest:
          type: string
          title: digest
          description: |-
            文本条目：字节的内容摘要（SHA-256 十六进制）。私有区对象键由工程标识与
             它共同构成（`galaxy/<工程标识>/text/<摘要>`），不跨工程共享。
        assetId:
          type: string
          title: asset_id
          description: 资产条目：资产库里的一个资产标识。
        url:
          type: string
          title: url
          description: |-
            **短时有效**的读取地址，客户端直接取字节。只有列出清单的方法（GetDraft、
             GetVersion）会填充它；写入路径（PushDraft）忽略它。

             它是一份短期凭证，因此**未发布的资产里不得承载秘密**。过期后重新读取
             清单即得到新地址。
      title: FileEntry
      additionalProperties: false
      description: |-
        FileEntry 是文件组里的一条条目：一个路径，加上它的字节从哪来。

         两类条目恰好对应"字节在哪"的两种答案（见 docs/design/galaxy/site-model.md）：
         文本条目的字节是按**内容摘要**寻址的内容对象；资产条目的字节是资产库里的
         一个媒体文件。**清单里没有字节本身**，因此同一个工程内、同一份未改动文件在
         多个版本、多次发布之间共享同一个对象。不跨工程共享。
    aladdin.galaxy.v1.GetCapabilitiesRequest:
      type: object
      title: GetCapabilitiesRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetCapabilitiesResponse:
      type: object
      properties:
        capabilities:
          allOf:
            - title: capabilities
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Capabilities'
      title: GetCapabilitiesResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 要读哪个内容槽的草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: GetDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetDraftResponse:
      type: object
      properties:
        draft:
          allOf:
            - title: draft
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Draft'
      title: GetDraftResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
      title: GetProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: GetProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.GetVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        slot:
          allOf:
            - title: slot
              description: 该版本所属的内容槽。版本按槽隔离，因此要给。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: GetVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.GetVersionResponse:
      type: object
      properties:
        version:
          allOf:
            - title: version
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
      title: GetVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListAssetsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        tags:
          type: array
          items:
            type: string
          title: tags
          description: |-
            按标签筛选：精确匹配、多值取**交集**（同时带上这些标签的资产才列出）。

             取值会按同一套归一化规则处理（trim、小写），因此客户端给 "Cover" 与
             "cover" 是同一个筛选。空表示不筛。
      title: ListAssetsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListAssetsResponse:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
          title: assets
        projectTags:
          type: array
          items:
            type: string
          title: project_tags
          description: '**整个工程**已有的标签，升序。用于筛选界面的候选，**不随本次筛选收窄**。'
      title: ListAssetsResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListProjectsRequest:
      type: object
      title: ListProjectsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
          title: projects
      title: ListProjectsResponse
      additionalProperties: false
    aladdin.galaxy.v1.ListVersionsRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 列出哪个内容槽的版本。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: ListVersionsRequest
      additionalProperties: false
    aladdin.galaxy.v1.ListVersionsResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
          title: versions
      title: ListVersionsResponse
      additionalProperties: false
    aladdin.galaxy.v1.PreviewDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        path:
          type: string
          title: path
          description: |-
            要预览的那一份文件；为空表示入口。按**该槽**文件组里的路径给——
             `docs` 槽的页面由服务端渲染，因此这里也可以给它的产物路径。
        slot:
          allOf:
            - title: slot
              description: 预览哪个内容槽的草稿。凭证绑在（工程，槽）上，换一个槽要重新开一次。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: PreviewDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.PreviewDraftResponse:
      type: object
      properties:
        url:
          type: string
          title: url
          description: |-
            草稿整站在发布域上的入口地址，带短时凭证。**iframe 的 `src` 就是它**，
             页内的其余文件由浏览器按同一个地址空间自己取。

             为空表示**草稿里还没有可预览的入口**：那不是错误，而是"还没内容"。
      title: PreviewDraftResponse
      additionalProperties: false
    aladdin.galaxy.v1.Project:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |-
            工程标识。由服务端分配，不可猜、不可改、不复用。

             它是**发布地址的一部分**，而发布态是公开匿名的：拿到地址的人能看，
             猜不出地址的人看不到（见 docs/design/galaxy/README.md 的"发布即公开"）。
        name:
          type: string
          title: name
          description: 名称。可改。**仅用于本人识别**，不是查找键，不进发布地址。
        description:
          type: string
          title: description
          description: 简介。为空表示未填写。
        createdAt:
          type: string
          title: created_at
        updatedAt:
          type: string
          title: updated_at
        slots:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ProjectSlot'
          title: slots
          description: |-
            启用的内容槽，每个带它自己的发布状态与地址。**至少一个**。

             槽只增不删（见 AddProjectSlot），因此这个列表只会在后面追加。**每个槽的
             发布状态都属于它自己**：发布或撤回一个槽不改变另一个槽的任何字段。
      title: Project
      additionalProperties: false
      description: |-
        Project 是一个创作单元的元数据。

         **不带草稿清单、版本清单与资产字节。** 列表接口会读这一行，把清单挂上来
         是一笔与列表无关的代价；整张表也不含任何字节。
    aladdin.galaxy.v1.ProjectSlot:
      type: object
      properties:
        slot:
          allOf:
            - title: slot
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
        published:
          type: boolean
          title: published
          description: 这个槽当前是否处于发布态。
        publishedVersionId:
          type: string
          title: published_version_id
          description: 这个槽当前发布指向的版本标识。未发布时为空。
        publishedUrl:
          type: string
          title: published_url
          description: |-
            这个槽的**分享地址**：site 槽形如 <主站>/g/<工程标识>，docs 槽形如
             <主站>/g/<工程标识>/docs。未发布时为空。

             **它落在主站，不落在发布域**：贴给别人的是这一条，打开它由主站壳用跨源沙箱
             iframe 取发布域上的同一条路径（见 docs/design/galaxy/publication.md 的"主站
             壳"）。发布域上的内容地址由 ResolveSharedPage 给出，默认不展示。

             **地址由服务端算好**，客户端不拼：记号解析生成的地址、内容安全策略里的
             允许来源与这条分享地址都从同一批配置值派生，客户端再拼一份就是又一个来源。
        publishedAt:
          type: string
          title: published_at
          description: 这个槽当前发布的生效时间。未发布时为空。
        baseUrl:
          type: string
          title: base_url
          description: |-
            这个槽的**发布根**，形如 <发布域>/g/<工程标识>/（docs 槽到 `docs/`），
             供构建命令使用（vite 的 --base）。

             配置了发布域时始终有值，与是否已发布无关：构建产物里的绝对路径要成立，
             靠的是它，而不是"页面已经发出去"。未配置发布域时为空。
      title: ProjectSlot
      additionalProperties: false
      description: |-
        ProjectSlot 是工程的一个内容槽，以及它当前的发布状态。

         一个槽一条。**行存在即槽启用**——"这个工程有哪些内容"只有这一处回答，
         工程行上不重复存一份。
    aladdin.galaxy.v1.Publication:
      type: object
      properties:
        id:
          type: string
          title: id
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
        publishedAt:
          type: string
          title: published_at
        url:
          type: string
          title: url
          description: '**分享地址**（主站包装），与对应 ProjectSlot.published_url 同一处派生。'
        slot:
          allOf:
            - title: slot
              description: 这次发布的是哪个内容槽。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: Publication
      additionalProperties: false
      description: |-
        Publication 是一次发布的产物记录。

         发布域上的**内容地址**按产物清单分派：文本条目由服务端在它自己的路径上给出，
         资产条目重定向到公开区；对外**分享**给访问者的是主站上的包装地址。
    aladdin.galaxy.v1.PublishRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        versionId:
          type: string
          title: version_id
          description: 要发布的版本。**必填**：没有"发布当前草稿"这种形状。
        slot:
          allOf:
            - title: slot
              description: 发布哪个内容槽的版本。版本按槽隔离，因此要给。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: PublishRequest
      additionalProperties: false
    aladdin.galaxy.v1.PublishResponse:
      type: object
      properties:
        publication:
          allOf:
            - title: publication
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Publication'
        project:
          allOf:
            - title: project
              description: 生效之后的工程状态，含新的发布地址。前端据此刷新而不必再查一次。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: PublishResponse
      additionalProperties: false
    aladdin.galaxy.v1.PushDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: 期望的完整清单。条目只引用已经上传好的对象，因此这里的 url 被忽略。
        slot:
          allOf:
            - title: slot
              description: 要替换哪个内容槽的整组草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: PushDraftRequest
      additionalProperties: false
      description: PushDraftRequest 表达的是草稿的**期望完整状态**，不是增量。
    aladdin.galaxy.v1.PushDraftResponse:
      type: object
      properties:
        draft:
          allOf:
            - title: draft
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Draft'
      title: PushDraftResponse
      additionalProperties: false
      description: |-
        返回推送之后的草稿，而不是一个成功标志：客户端刚做过一次会改变现状的
         操作，让它在同一次往返里拿到新现状，比再发一次查询更省事。
    aladdin.galaxy.v1.ResolveSharedPageRequest:
      type: object
      properties:
        path:
          type: string
          title: path
          description: |-
            主站上的分享路径，以 `/g/` 开头，形如 `/g/<工程标识>`、`/g/<工程标识>/docs`
             或 `/g/<工程标识>/docs/guide`。

             给整条路径而不是（工程，槽，路径）三元组：**槽的判定只有服务端一处**，客户端
             再解析一份就是第二个形状来源。
      title: ResolveSharedPageRequest
      additionalProperties: false
    aladdin.galaxy.v1.ResolveSharedPageResponse:
      type: object
      properties:
        contentUrl:
          type: string
          title: content_url
          description: |-
            这条路径在**发布域**上的内容地址，形如
             `<发布域>/g/<工程标识>[/docs][/路径]`。壳把它放进 iframe 的 src。

             **空表示"没有这一页"**，且六种情形同此一答（未发布 / 已撤回 / 该槽未启用 /
             工程不存在 / 标识没被猜中 / 路径不在集合里）。它不是错误：调用方据此渲染
             与发布态相同的"不存在"。
      title: ResolveSharedPageResponse
      additionalProperties: false
    aladdin.galaxy.v1.SaveVersionRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 把哪个内容槽的草稿存成版本。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: SaveVersionRequest
      additionalProperties: false
    aladdin.galaxy.v1.SaveVersionResponse:
      type: object
      properties:
        version:
          allOf:
            - title: version
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Version'
      title: SaveVersionResponse
      additionalProperties: false
    aladdin.galaxy.v1.UnpublishRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 撤回哪个内容槽的发布。**另一个槽不受影响**。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: UnpublishRequest
      additionalProperties: false
    aladdin.galaxy.v1.UnpublishResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: UnpublishResponse
      additionalProperties: false
    aladdin.galaxy.v1.UpdateAssetRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        assetId:
          type: string
          title: asset_id
        title:
          type: string
          title: title
          description: 期望的展示标题。空串表示没有标题。
        tags:
          type: array
          items:
            type: string
          title: tags
          description: 期望的标签集合，**整体替换**（不在集合里的标签就是删掉）。空集表示清空。
        notes:
          type: string
          title: notes
          description: 期望的备注。空串表示清空。
      title: UpdateAssetRequest
      additionalProperties: false
      description: UpdateAssetRequest 表达的是说明层元数据的**期望完整状态**，不是增量。
    aladdin.galaxy.v1.UpdateAssetResponse:
      type: object
      properties:
        asset:
          allOf:
            - title: asset
              description: 改完之后的资产（含短时读取地址）。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Asset'
      title: UpdateAssetResponse
      additionalProperties: false
    aladdin.galaxy.v1.UpdateProjectRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        name:
          type: string
          title: name
          description: 期望的完整状态，空串表示清空。
        description:
          type: string
          title: description
      title: UpdateProjectRequest
      additionalProperties: false
    aladdin.galaxy.v1.UpdateProjectResponse:
      type: object
      properties:
        project:
          allOf:
            - title: project
            - $ref: '#/components/schemas/aladdin.galaxy.v1.Project'
      title: UpdateProjectResponse
      additionalProperties: false
    aladdin.galaxy.v1.ValidateDraftRequest:
      type: object
      properties:
        projectId:
          type: string
          title: project_id
        slot:
          allOf:
            - title: slot
              description: 校验哪个内容槽的草稿。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: ValidateDraftRequest
      additionalProperties: false
    aladdin.galaxy.v1.ValidateDraftResponse:
      type: object
      properties:
        problems:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.ValidationProblem'
          title: problems
      title: ValidateDraftResponse
      additionalProperties: false
      description: |-
        问题为空表示这份草稿可以发布。**它是发布前置校验的同一份规则**，因此
         "这里通过"与"发布能成功"是同一个结论，不会漂移。
    aladdin.galaxy.v1.ValidationProblem:
      type: object
      properties:
        message:
          type: string
          title: message
        path:
          type: string
          title: path
          description: 出问题的文件路径。与行无关的问题（如整组超限）为空。
        line:
          type: integer
          title: line
          format: int32
          description: 出问题的行号（从 1 开始）。0 表示与行无关。
      title: ValidationProblem
      additionalProperties: false
      description: |-
        ValidationProblem 是校验发现的一处问题。

         message 里**带上出问题的文件与位置**：只说"有引用不合法"会让用户在一组
         文件里自己找。
    aladdin.galaxy.v1.Version:
      type: object
      properties:
        id:
          type: string
          title: id
        seq:
          oneOf:
            - type: integer
              title: integer
              format: int64
            - type: string
              title: string
          title: seq
          description: |-
            在**本槽内**递增的序号。**仅用于展示与排序，不是标识。**
             删除一个版本会让后续序号出现空洞，这是可接受的。
        savedAt:
          type: string
          title: saved_at
        entries:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.galaxy.v1.FileEntry'
          title: entries
          description: 保存那一刻草稿的清单。**写入后不再修改。** 地址只有 GetVersion 填充。
        renderRulesVersion:
          type: integer
          title: render_rules_version
          format: int32
          description: |-
            保存时所处的渲染规则版本。只有 `docs` 槽使用它，重新发布时按它渲染
             而不是按当前最新的——否则"撤回后重新发布同一版本，产物逐字相同"会在
             渲染器升级的那天悄悄失效。
        slot:
          allOf:
            - title: slot
              description: 这个版本属于哪个槽。**版本按槽隔离**：它只在自己的槽里被列出与发布。
            - $ref: '#/components/schemas/aladdin.galaxy.v1.ContentSlot'
      title: Version
      additionalProperties: false
      description: Version 是文件清单的一次不可变快照。
    aladdin.objectstore.v1.DirectUploadCredential:
      type: object
      properties:
        bucket:
          type: string
          title: bucket
          description: 桶名（含 APPID），不是地址：客户端 SDK 要的是桶名与地域。
        region:
          type: string
          title: region
          description: 桶所在地域，形如 ap-guangzhou。
        key:
          type: string
          title: key
          description: 这次唯一允许写入的对象键。由服务端分配，客户端改不了。
        secretId:
          type: string
          title: secret_id
          description: 临时凭证三元组。
        secretKey:
          type: string
          title: secret_key
        sessionToken:
          type: string
          title: session_token
        expiresAt:
          type: string
          title: expires_at
          description: 凭证的失效时刻。它是**给客户端的提示值**，实际失效以对象存储的判断为准。
        forbidOverwrite:
          type: boolean
          title: forbid_overwrite
          description: |-
            写入是否**禁止覆盖已存在的对象**。

             内容对象（galaxy 的文本条目）按**内容摘要**寻址，因此"仅当不存在时写入"
             是它成立的前提：一个伪造的摘要若落到另一个版本已经在用的键上，会把那个
             对象改写掉——而那是"版本不可变"的反面。为真时客户端在写入请求上带禁止
             覆盖的条件，由对象存储执行。

             头像与资产按标识寻址、一个标识一个对象，因此它是假。
      title: DirectUploadCredential
      additionalProperties: false
      description: |-
        DirectUploadCredential 是一次直传所需的全部取值。

         它是**一份短时凭证**：在有效期内，拿到它的人可以用它往 key 上写一次。因此
         它只下发给发起上传的那个客户端。

         **它只允许写。** 约束写在换取来的策略里，由对象存储执行：动作只有写入对象，
         资源只有 key 这一个对象，条件限定声明的内容类型与请求体长度上限。

         **它不得进日志。** 把它写进日志等于把一次写入的能力留在了日志文件里。
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: aladdin.galaxy.v1.GalaxyService
    description: |-
      GalaxyService 是创作面：用户放下一组具名文件与素材，然后把它发布成一个
       别人能打开的站点。

       边界：它不回答"你是谁"（认证）也不回答"你能做什么"（RBAC）。**两把闸门
       各管一件事**：`galaxy.*` 权限码决定这个主体有没有资格创作，工程的拥有者
       决定他能不能碰这一个工程。后者不由 RBAC 表达，也不在本服务的请求里出现
       ——**接口面上没有"指定拥有者"这个形状**，拥有者由凭证决定。

       **"不是你的"与"不存在"返回同一个结论。** 区分它们等于提供一个工程枚举
       接口：拿着别人的工程标识反复调用，"不存在"与"无权访问"的差集就能把一个
       不可猜标识试出来。而工程标识是发布地址的一部分，猜出它就能看到别人的
       页面（见 docs/design/galaxy/project-versioning.md）。

       作用域从**凭证绑定的默认作用域**解析：请求里没有作用域字段，也不该有
       ——工程是资源归属的载体，不是作用域的载体。

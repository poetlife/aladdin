        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.ListAssetsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.ListAssetsResponse'
  /aladdin.galaxy.v1.GalaxyService/BeginAssetUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: BeginAssetUpload
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        开始一次资产上传：分配资产标识并签发一份直传凭证。

         **字节不经过服务端**（见 docs/design/objectstore/README.md）。服务端在这里
         做三件事：校验调用的工程属于调用者、校验**声明的**内容类型在白名单内、
         按声明的大小早退；然后把"只许写这一个键、类型与大小受条件约束"的策略交给
         对象存储，由它执行。

         **类型与摘要都是上传方声明的，服务端不看字节。** 类型决定此后下发时回给
         浏览器的内容类型，而白名单里没有任何可执行类型——因此公开区上的对象永远
         以一个无害类型下发；摘要则在提交时被核对（让存储侧算，存储侧给不出时读回
         自己算），不一致即拒绝提交。
      operationId: aladdin.galaxy.v1.GalaxyService.BeginAssetUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.BeginAssetUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.BeginAssetUploadResponse'
  /aladdin.galaxy.v1.GalaxyService/CommitAssetUpload:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: CommitAssetUpload
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        提交一次资产上传：核对字节确实到了、内容与声明的摘要相符，写入资产元数据。

         签发之后客户端传了什么、传没传完，服务端都不知道，因此提交要对那个键做
         一次 Head：不存在即失败，字节数超过上限即失败并删除对象；随后核对摘要，
         不符同样删除对象并拒绝。**没有提交的上传不会进入任何清单**（元数据行不存在）。

         可以顺带带上初始的标题 / 标签 / 备注（都可空）。一次带走省掉一次往返，
         而结果与"提交之后再调 UpdateAsset"完全相同。
      operationId: aladdin.galaxy.v1.GalaxyService.CommitAssetUpload
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.galaxy.v1.CommitAssetUploadRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.galaxy.v1.CommitAssetUploadResponse'
  /aladdin.galaxy.v1.GalaxyService/DeleteAsset:
    post:
      x-aladdin-auth:
        kind: requires
        permission: galaxy.asset.write
        scope-source: SCOPE_SOURCE_CREDENTIAL
      tags:
        - aladdin.galaxy.v1.GalaxyService
      summary: DeleteAsset
      description: |-
        **鉴权**：需要权限 `galaxy.asset.write`；作用域取自凭证的默认作用域。

        删除一个资产。**被任一版本的文件清单引用时拒绝**，错误信息指出被哪些
         版本引用。

         拒绝的理由是版本不可变的含义包括"它此后永远可以发布"：一个引用了已删
         除资产的版本必然在校验阶段失败，而那时用户看到一句"资产不存在"，却无法
         从版本内容里知道该怎么做。把问题挡在它产生的地方。

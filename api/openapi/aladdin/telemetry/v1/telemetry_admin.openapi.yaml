openapi: 3.1.0
info:
  title: aladdin.telemetry.v1
paths:
  /aladdin.telemetry.v1.TelemetryAdminService/ListEventStats:
    post:
      x-aladdin-auth:
        kind: requires
        permission: telemetry.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.telemetry.v1.TelemetryAdminService
      summary: ListEventStats
      description: |-
        **鉴权**：需要权限 `telemetry.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        按 `client × action × result` 统计时间窗内的事件条数。

         它是"Web/CLI 最近在干什么、失败或被拦多不多"这一眼的直接答案：三个维度
         都是写侧的有界取值，因此结果行数有上界（端 × 动作 × 结局），不需要分页。
      operationId: aladdin.telemetry.v1.TelemetryAdminService.ListEventStats
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.telemetry.v1.ListEventStatsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.telemetry.v1.ListEventStatsResponse'
  /aladdin.telemetry.v1.TelemetryAdminService/ListRecentEvents:
    post:
      x-aladdin-auth:
        kind: requires
        permission: telemetry.read
        scope-source: SCOPE_SOURCE_REQUEST_FIELD
      tags:
        - aladdin.telemetry.v1.TelemetryAdminService
      summary: ListRecentEvents
      description: |-
        **鉴权**：需要权限 `telemetry.read`；作用域取自请求字段。

        **幂等**：本方法无副作用，可安全重试；服务端在同一路径上也接受 GET。

        列出时间窗内**最新的一页**事件明细。

         只给最新的一页、条数有上限，不提供游标翻页：这一页要回答的是"刚才发生了什么"，
         而不是"把三个月的事件翻完"。要翻完就该去日志系统，那里的检索没有上限。
      operationId: aladdin.telemetry.v1.TelemetryAdminService.ListRecentEvents
      parameters:
        - name: Connect-Protocol-Version
          in: header
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
        - name: Connect-Timeout-Ms
          in: header
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aladdin.telemetry.v1.ListRecentEventsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aladdin.telemetry.v1.ListRecentEventsResponse'
components:
  schemas:
    aladdin.telemetry.v1.Client:
      type: string
      title: Client
      enum:
        - CLIENT_UNSPECIFIED
        - CLIENT_WEB
        - CLIENT_CLI
      description: |-
        Client 是上报端的标识，与每个出站请求携带的 `x-aladdin-client` 头同源。

         它同时出现在两处，各有用途：请求留痕的 `client` 字段回答"这次 RPC 是谁发的"，
         事件的 `client` 字段回答"这条本地动作是谁报的"。两处取值必须一致，由两端各自
         引用同一份常量保证（见 docs/observability.md）。
    aladdin.telemetry.v1.Result:
      type: string
      title: Result
      enum:
        - RESULT_UNSPECIFIED
        - RESULT_OK
        - RESULT_FAIL
        - RESULT_CANCEL
        - RESULT_BLOCKED
      description: |-
        Result 是一条动作的结局。四个取值互斥，且必须能区分"失败"与"被拦下"：
         前者是动作执行了但没成功，后者是动作根本没被执行——两者的修复方向完全不同。
    aladdin.telemetry.v1.Surface:
      type: string
      title: Surface
      enum:
        - SURFACE_UNSPECIFIED
        - SURFACE_WEB_AUTH
        - SURFACE_WEB_PROJECT_LIST
        - SURFACE_WEB_EDITOR
        - SURFACE_WEB_PREVIEW
        - SURFACE_CLI
      description: |-
        Surface 是一条事件发生在哪个界面/入口上（粗粒度）。

         它与 Action 是两个维度：Surface 回答"在哪"，Action 回答"做了什么"。两者都
         是有界枚举——高基数的取值（页面路径、工程标识）会随时间增长，不允许进入。
    aladdin.telemetry.v1.TimeWindow:
      type: string
      title: TimeWindow
      enum:
        - TIME_WINDOW_UNSPECIFIED
        - TIME_WINDOW_TODAY
        - TIME_WINDOW_LAST_7_DAYS
        - TIME_WINDOW_LAST_30_DAYS
      description: |-
        TimeWindow 是允许选择的观察窗口。**枚举而不是时间戳对**：有界取值让服务端不必
         校验"这个时间范围是不是过大"，也不会出现"前端算出的 from/to 与服务端的时钟差
         一点点"这类无从对账的偏差。

         三个窗口都以**服务端收到请求的那一刻**为锚：

           - TODAY：服务器本地时区当日零点到此刻；
           - LAST_7_DAYS / LAST_30_DAYS：此刻往前 7 / 30 个 24 小时。

         区间一律是半开的 `[from, to)`。事件保留 30 天（回收比窗口多留一天，见
         docs/observability.md），因此 LAST_30_DAYS 是能被完整回答的最长窗口。
    aladdin.telemetry.v1.EventStat:
      type: object
      properties:
        client:
          allOf:
            - title: client
              description: 上报端。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Client'
        action:
          type: string
          title: action
          description: |-
            动作名。取值来自写侧的动作允许清单（internal/telemetry 的动作表）。

             类型是 string 而不是 Action 枚举：动作清单会随业务扩展，而计数行是**历史
             数据**——用枚举会让"昨天记下的动作"在清单变更后变成一个无法表示的值。
             服务端保证它只会是清单内的名字。
        result:
          allOf:
            - title: result
              description: 结局。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Result'
        count:
          oneOf:
            - type: integer
              title: integer
              format: int64
            - type: string
              title: string
          title: count
          description: 该组合在窗口内的条数。
      title: EventStat
      additionalProperties: false
      description: EventStat 是一个分组维度的计数。
    aladdin.telemetry.v1.ListEventStatsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: |-
            **只用于鉴权**：判断调用方有没有在这个范围上读遥测的权限。

             事件没有归属范围（它是端上的动作，不是某个人或某个范围的资源），因此这个
             字段**不过滤结果**——与 ListRoles 的 scope 同理（见 rbac.proto）。同一主体在
             任意有读权限的范围上调用，拿到的都是同一份计数；变化的是"还能不能读"。
        window:
          allOf:
            - title: window
              description: 观察窗口。TIME_WINDOW_UNSPECIFIED 不是合法取值，会被拒绝。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.TimeWindow'
      title: ListEventStatsRequest
      additionalProperties: false
      description: ListEventStatsRequest 是一次计数查询。
    aladdin.telemetry.v1.ListEventStatsResponse:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.telemetry.v1.EventStat'
          title: stats
          description: |-
            每条是一个 (client, action, result) 组合的计数。**只返回出现过的组合**，
             计数为零的组合不占一行。
      title: ListEventStatsResponse
      additionalProperties: false
      description: ListEventStatsResponse 是分组计数结果。
    aladdin.telemetry.v1.ListRecentEventsRequest:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: 只用于鉴权，不过滤结果（同 ListEventStatsRequest.scope）。
        window:
          allOf:
            - title: window
              description: 观察窗口。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.TimeWindow'
        limit:
          type: integer
          title: limit
          description: 条数上限。0 表示用服务端默认值；超过服务端上限时按上限处理。
      title: ListRecentEventsRequest
      additionalProperties: false
      description: ListRecentEventsRequest 是一次明细查询。
    aladdin.telemetry.v1.ListRecentEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/aladdin.telemetry.v1.RecentEvent'
          title: events
          description: 按发生时间**从新到旧**排列。
        subjects:
          type: object
          title: subjects
          additionalProperties:
            allOf:
              - title: value
              - $ref: '#/components/schemas/aladdin.telemetry.v1.SubjectProfile'
          description: |-
            本页事件里出现过的主体 → 它的展示信息，键是主体标识。

             **它是读侧的附加投影，不是事件的一部分。** 事件本身仍然只存主体标识：昵称与
             头像既不写进事件、也不进日志、也不落库，它们是在这次读取时按档案模块那唯一
             一套回退规则算出来的（见 docs/observability.md 的「读侧 / 管理视图」）。

             本页出现过的每一个**非空** subject_id 都在里面，包括"没有更好的名字、展示名
             就是标识"的那些——少一个键与"这个人就叫这个"在界面上是同一种呈现，因此不必
             再分。匿名事件（subject_id 为空）不占键。

             取不到档案时整个字段为空，客户端据此回退到只显示标识。**展示信息的缺失不该
             让这一页读不出来**——排障要看的第一件事是事件本身。

             能拿到它的人与能读事件的人是同一批：整个方法就要求 `telemetry.read`，这里
             不另设一道门槛。
      title: ListRecentEventsResponse
      additionalProperties: false
      description: ListRecentEventsResponse 是最新的一页明细。
    aladdin.telemetry.v1.ListRecentEventsResponse.SubjectsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          allOf:
            - title: value
            - $ref: '#/components/schemas/aladdin.telemetry.v1.SubjectProfile'
      title: SubjectsEntry
      additionalProperties: false
    aladdin.telemetry.v1.RecentEvent:
      type: object
      properties:
        occurredAt:
          type: string
          title: occurred_at
          description: 发生时间，RFC3339（UTC）。由服务端盖章，不由上报端提供。
        client:
          allOf:
            - title: client
              description: 上报端。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Client'
        surface:
          allOf:
            - title: surface
              description: 发生在哪个界面/入口。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Surface'
        action:
          type: string
          title: action
          description: 动作名（取值语义同 EventStat.action）。
        result:
          allOf:
            - title: result
              description: 结局。
            - $ref: '#/components/schemas/aladdin.telemetry.v1.Result'
        durationMs:
          type: integer
          title: duration_ms
          description: |-
            耗时（毫秒）。0 表示上报端未提供。

             **0 是常见且正确的取值**：只有带明确起止的动作才量得出耗时（打开列表/工作台/
             预览、打开面板、登录、命令行本地失败）。被拦下、确认框被取消、纯前端切换这类
             瞬时动作没有起止，如实报 0，而不是编一个 0 毫秒的"测量结果"出来。
        clientTraceId:
          type: string
          title: client_trace_id
          description: 上报端当时所在链路的 trace_id；空表示未提供。
        subjectId:
          type: string
          title: subject_id
          description: 事件所属主体；空表示匿名（只有允许匿名的动作会是空）。
        attrs:
          type: object
          title: attrs
          additionalProperties:
            type: string
            title: value
          description: 白名单属性，键与取值都在服务端登记过（同写侧）。
      title: RecentEvent
      additionalProperties: false
      description: RecentEvent 是一条事件的明细，字段与写侧落盘的日志字段一一对应。
    aladdin.telemetry.v1.RecentEvent.AttrsEntry:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: AttrsEntry
      additionalProperties: false
    aladdin.telemetry.v1.SubjectProfile:
      type: object
      properties:
        displayName:
          type: string
          title: display_name
          description: |-
            界面应当显示的名字，由服务端按档案模块的回退规则算好，客户端**不得**自行
             拼接（规则只有那一处实现，见 docs/ssot-registry.md）。

             回退的最后一步是主体标识本身，因此它只会为空字符串之外的展示名——但客户端
             仍不得假设两者不同：相同表示"没有更好的名字"，此时只渲染标识即可。
        avatarUrl:
          type: string
          title: avatar_url
          description: |-
            头像的**短时有效**预签名读取地址，可直接放进 <img src>。空表示当前没有可
             显示的头像（真的没设、或这个部署没有配置对象存储）。

             与档案面的 avatar_url 同性质：它是一份短期凭证，地址里头不得承载任何秘密。
      title: SubjectProfile
      additionalProperties: false
      description: |-
        SubjectProfile 是一个主体在**这里**要显示的样子。

         刻意比 aladdin.profile.v1.Profile 小：只有"显示成什么"这件事需要的两个字段。
         昵称、简介、邮箱都不进这里——读侧换的是展示信息，不是把档案面整个搬过来。
    connect-protocol-version:
      type: number
      title: Connect-Protocol-Version
      enum:
        - 1
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - CodeNotFound
          enum:
            - CodeCanceled
            - CodeUnknown
            - CodeInvalidArgument
            - CodeDeadlineExceeded
            - CodeNotFound
            - CodeAlreadyExists
            - CodePermissionDenied
            - CodeResourceExhausted
            - CodeFailedPrecondition
            - CodeAborted
            - CodeOutOfRange
            - CodeInternal
            - CodeUnavailable
            - CodeDataLoss
            - CodeUnauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        detail:
          $ref: '#/components/schemas/google.protobuf.Any'
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    google.protobuf.Any:
      type: object
      properties:
        type:
          type: string
        value:
          type: string
          format: binary
        debug:
          type: object
          additionalProperties: true
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
security: []
tags:
  - name: aladdin.telemetry.v1.TelemetryAdminService
    description: |-
      TelemetryAdminService 是客户端事件的**只读管理面**。

       它与 TelemetryService 是一件事的两侧，因此拆成两个服务而不是塞进一个：

         - TelemetryService 是**公开的写侧**（登录页失败、命令行未登录退出都发生在
           拿到会话之前，要求先认证才能上报是循环依赖），任何人都能调用；
         - 本服务是**受控的读侧**，只有持有 `telemetry.read` 的主体能调用。

       两者的准入条件正相反，写在同一份接口里会让"这个服务要不要认证"变成一个需要
       逐方法去看的问题——那正是注解漏写的温床。

       三条边界同样写死在这里：

         - **事件本身的字段面不放大**。返回的都是写侧已经脱敏后的字段（有界枚举、
           服务端从会话得出的主体标识、校验过的 trace_id、白名单属性），没有请求体、
           没有自由文本。落在库里的那一条记录，读侧看见的不会比写侧多一个字段。
         - **主体标识可以在读侧换成展示信息，仅限读侧**。`subject_id` 是脱敏后的
           标识，而"这个人叫什么"是排查时要问的第一个问题（见 ListRecentEvents 的
           `subjects`）。解析发生在**读取的这一刻**：昵称与头像不写进事件、不进日志、
           不落库——写侧的脱敏硬规则一个字不改（见 docs/observability.md）。
         - **它不是第二套观测平台**。查询参数有界——时间窗是一个枚举，条数有上限，
           没有任意过滤表达式。需要那种能力的分析走外部日志系统（见
           docs/observability.md）。

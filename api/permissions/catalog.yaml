# 权限目录 —— 权限码全集的唯一信源。
#
# 本文件由 `make gen` 派生三份产物，两端都不得手工修改：
#   - internal/rbac/catalog_gen.go        （Go 常量 + 内置角色定义）
#   - web/src/gen/permission-codes.ts     （前端常量）
#   - web/src/gen/permission-catalog.ts   （码 + 说明的数据形式，供只读目录页）
#
# 新增权限的行为约定（见 docs/design/rbac/role-model.md）：
#   1. 先在本文件登记；
#   2. 再在 proto 的方法上引用（option (aladdin.rbac.v1.required_permission)）；
#   3. 一致性由 internal/rbac/catalog_test.go 在构建期强制校验。
version: 1

permissions:
  - code: "rbac.role.read"
    description: "读取角色定义与角色列表"
  - code: "rbac.role.write"
    description: "创建、修改、删除角色。属不可逆操作"
  - code: "rbac.subject.read"
    description: "读取主体的角色绑定关系"
  - code: "rbac.subject.assign"
    description: "为主体授予或回收角色，会改变权限边界"
  - code: "rbac.scope.read"
    description: "读取范围目录：这个部署里登记了哪些范围"
  - code: "rbac.scope.write"
    description: "登记范围、改显示名、删除范围。删除属不可逆操作"
  - code: "rbac.policy.publish"
    description: "使一次角色变更正式生效（缓存失效与生效确认）"
  - code: "audit.log.read"
    description: "查阅审计日志"
  - code: "audit.log.export"
    description: "导出审计日志。属批量操作"
  - code: "galaxy.project.read"
    description: "读取自己创建的工程、草稿与版本"
  - code: "galaxy.project.write"
    description: "创建、修改、删除工程，保存版本。删除属不可逆操作"
  - code: "galaxy.project.publish"
    description: "发布与撤回发布。唯一一个让内容离开私有边界的动作"
  - code: "galaxy.asset.read"
    description: "读取自己工程下的资产列表与读取地址"
  - code: "galaxy.asset.write"
    description: "上传与删除工程资产"
  - code: "*"
    description: "全部权限。仅保留给系统管理员角色，不得授予其他角色"

# 内置角色的存在是模型的一部分（代码可依赖其标识）；
# 其具体权限绑定可在部署时调整，但经本文件修改后需重新生成。
roles:
  - id: "system.admin"
    display_name: "系统管理员"
    builtin: true
    permissions:
      - "*"
  - id: "rbac.admin"
    display_name: "权限管理员"
    builtin: true
    permissions:
      - "rbac.role.read"
      - "rbac.role.write"
      - "rbac.subject.read"
      - "rbac.subject.assign"
      - "rbac.scope.read"
      - "rbac.scope.write"
      - "rbac.policy.publish"
  - id: "auditor"
    display_name: "审计员"
    builtin: true
    permissions:
      - "audit.log.read"
      - "audit.log.export"
      - "rbac.role.read"
      - "rbac.subject.read"
      # 审计要能看见"哪些范围存在"：范围名是部署内的目录，不是秘密
      # （隔离靠绑定，不靠隐藏名字，见 docs/design/rbac/scopes.md）。
      - "rbac.scope.read"
  - id: "viewer"
    display_name: "只读用户"
    builtin: true
    permissions:
      - "rbac.role.read"
      - "rbac.subject.read"
      - "rbac.scope.read"
  # 业务领域角色。随业务资源（galaxy 工程）落地而加入，见 docs/design/galaxy/README.md。
  # 角色决定"能不能创作"，资源归属决定"能创作哪些"，两把闸门都要过。
  - id: "galaxy.author"
    display_name: "创作者"
    builtin: true
    permissions:
      - "galaxy.project.read"
      - "galaxy.project.write"
      - "galaxy.project.publish"
      - "galaxy.asset.read"
      - "galaxy.asset.write"

# 权限目录 —— 权限码全集的唯一信源。
#
# 本文件由 `make gen` 派生三份产物，两端都不得手工修改：
#   - internal/rbac/catalog_gen.go        （Go 常量 + 内置角色定义）
#   - web/src/gen/permission-codes.ts     （前端常量）
#   - web/src/gen/permission-catalog.ts   （码 + 说明的数据形式，供只读目录页）
#
# 新增权限的行为约定（见 docs/design/rbac/role-model.md）：
#   1. 先在本文件登记；
#   2. 再在 proto 的方法上引用（option (aladdin.rbac.v1.required_permission)）；
#   3. 一致性由 internal/rbac/catalog_test.go 在构建期强制校验。
version: 1

permissions:
  - code: "rbac.role.read"
    description: "读取角色定义与角色列表"
  - code: "rbac.role.write"
    description: "创建、修改、删除角色。属不可逆操作"
  - code: "rbac.subject.read"
    description: "读取主体的角色绑定关系"
  - code: "rbac.subject.assign"
    description: "为主体授予或回收角色，会改变权限边界"
  - code: "rbac.scope.read"
    description: "读取范围目录：这个部署里登记了哪些范围"
  - code: "rbac.scope.write"
    description: "登记范围、改显示名、删除范围。删除属不可逆操作"
  - code: "rbac.policy.publish"
    description: "使一次角色变更正式生效（缓存失效与生效确认）"
  - code: "identity.registration.read"
    description: "读取注册策略与邀请码列表。只读"
  - code: "identity.registration.write"
    description: "改注册策略、签发与撤销邀请码。它会改变新主体的权限边界"
  - code: "audit.log.read"
    description: "查阅审计日志"
  - code: "audit.log.export"
    description: "导出审计日志。属批量操作"
  - code: "telemetry.read"
    description: "读取客户端遥测的计数与明细（Web/CLI 本地动作）。只读"
  - code: "ops.deployment.read"
    description: "读取部署信息：这个进程是哪次构建、在什么平台上跑、什么时候起来的。只读"
  - code: "galaxy.project.read"
    description: "读取自己创建的工程、草稿与版本"
  - code: "galaxy.project.write"
    description: "创建、修改、删除工程，保存版本。删除属不可逆操作"
  - code: "galaxy.project.publish"
    description: "发布与撤回发布。唯一一个让内容离开私有边界的动作"
  - code: "galaxy.asset.read"
    description: "读取自己工程下的资产列表与读取地址"
  - code: "galaxy.asset.write"
    description: "上传与删除工程资产"
  - code: "galaxy.attachment.read"
    description: "读取自己工程下的附件列表与下载地址"
  - code: "galaxy.attachment.write"
    description: "上传与删除工程附件，以及改它的说明。上传的是任意类型的构建产物"
  - code: "skill.catalog.read"
    description: "检索平台技能目录、读取技能正文、收藏技能。只读"
  - code: "skill.catalog.write"
    description: "从远端纳管技能、同步、回滚，修改说明层与标签。删除属不可逆操作"
  - code: "*"
    description: "全部权限。仅保留给系统管理员角色，不得授予其他角色"

# 内置角色的存在是模型的一部分（代码可依赖其标识）；
# 其具体权限绑定可在部署时调整，但经本文件修改后需重新生成。
roles:
  - id: "system.admin"
    display_name: "系统管理员"
    builtin: true
    permissions:
      - "*"
  - id: "rbac.admin"
    display_name: "权限管理员"
    builtin: true
    permissions:
      - "rbac.role.read"
      - "rbac.role.write"
      - "rbac.subject.read"
      - "rbac.subject.assign"
      - "rbac.scope.read"
      - "rbac.scope.write"
      - "rbac.policy.publish"
      # 注册策略决定"新来的人拿到什么"，与授予角色同属一件事：它写下的是一条
      # 真实的角色绑定。因此它归权限管理员，而不是归"能碰服务端配置文件的人"。
      - "identity.registration.read"
      - "identity.registration.write"
  - id: "auditor"
    display_name: "审计员"
    builtin: true
    permissions:
      - "audit.log.read"
      - "audit.log.export"
      # 客户端事件是审计面要看的一类运行事实：谁在什么时候被拦下、失败多不多。
      # 它是只读聚合，与审计日志同属"看得见但不改得动"。
      - "telemetry.read"
      # 部署信息同理：审计要回答"当时跑的是哪一版"——某次变更发生前后服务端到
      # 底换没换、是不是同一份构建，都在这一页上。它同样只是看，动不了任何东西。
      - "ops.deployment.read"
      - "rbac.role.read"
      - "rbac.subject.read"
      # 审计要能看见"哪些范围存在"：范围名是部署内的目录，不是秘密
      # （隔离靠绑定，不靠隐藏名字，见 docs/design/rbac/scopes.md）。
      - "rbac.scope.read"
      # 准入姿态同属"看得见但不改得动"：审计要回答"这个人当时是怎么进来的"，
      # 而注册模式与邀请码的状态正是那条路径的上下文。**明文读不回来**。
      - "identity.registration.read"
  - id: "viewer"
    display_name: "只读用户"
    builtin: true
    permissions:
      - "rbac.role.read"
      - "rbac.subject.read"
      - "rbac.scope.read"
  # 业务领域角色。随业务资源（galaxy 工程）落地而加入，见 docs/design/galaxy/README.md。
  # 角色决定"能不能创作"，资源归属决定"能创作哪些"，两把闸门都要过。
  - id: "galaxy.author"
    display_name: "创作者"
    builtin: true
    permissions:
      - "galaxy.project.read"
      - "galaxy.project.write"
      - "galaxy.project.publish"
      - "galaxy.asset.read"
      - "galaxy.asset.write"
      # 附件与资产是两类资源、两条边界：资产会被发布到公开区，附件永远只给成员
      # 下载。合成一码意味着"能传图片"必然连带"能传一个 500 MiB 的二进制"。
      - "galaxy.attachment.read"
      - "galaxy.attachment.write"
      # 创作者要能选用平台技能，否则这个目录对他不存在。**只有读**：往目录里
      # 放东西是 skill.curator 的事（见 docs/design/skill/README.md）。
      - "skill.catalog.read"
  # 技能目录的维护者。它与 galaxy.author 是两类人：前者决定目录里有什么，
  # 后者在创作时选用。合成一码会让"让创作者用上技能"必然连带"让创作者能往
  # 目录里塞东西"。
  - id: "skill.curator"
    display_name: "技能管理员"
    builtin: true
    permissions:
      - "skill.catalog.read"
      - "skill.catalog.write"

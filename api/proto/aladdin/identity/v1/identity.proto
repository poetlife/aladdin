syntax = "proto3";

package aladdin.identity.v1;

import "aladdin/rbac/v1/annotations.proto";
import "aladdin/identity/v1/registration.proto";

option go_package = "github.com/poetlife/aladdin/api/gen/aladdin/identity/v1;identityv1";

// IdentityService 是身份认证面。
//
// 边界：本服务只做认证（你是谁）。判定（你能做什么）由 RBAC 负责。
// 认证失败与鉴权失败必须返回不同的状态码，见 grpc-interceptor.md 的拒绝语义。
service IdentityService {
  // 登录并换取访问凭证。
  // 这是极少数公开方法之一，必须显式标记 public，否则鉴权拦截器默认拒绝。
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (aladdin.rbac.v1.public) = true;
  }

  // 刷新访问凭证。
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (aladdin.rbac.v1.public) = true;
  }

  // 返回当前启用的登录方式。前端据此决定渲染哪些登录入口。
  //
  // 公开是必须的：调用方尚未认证，而这正是它要回答的问题的前提。它之所以
  // 能公开，是因为返回的内容本来就会出现在浏览器里（客户端标识不是秘密）——
  // 一个不公开的"有哪些登录方式"不保护任何东西，只会迫使前端硬编码一份
  // 会漂移的副本。若它将来开始返回需要保护的内容，就必须移出公开清单。
  rpc GetAuthMethods(GetAuthMethodsRequest) returns (GetAuthMethodsResponse) {
    option (aladdin.rbac.v1.public) = true;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 返回当前凭证对应的主体标识。客户端用它验证凭证是否仍然有效。
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 返回当前主体在其可及作用域下展开后的权限码集合。
  // 这是前端会话权限的唯一来源：前端拿到的是已展开的最终集合，
  // 因此前端不需要（也不允许）自行实现继承、通配与作用域包含逻辑。
  rpc GetSessionPermissions(GetSessionPermissionsRequest) returns (GetSessionPermissionsResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 从当前主体上摘掉一个登录渠道。
  //
  // 同样只作用于当前主体。**不允许摘掉最后一个身份**：那会让这个主体再也
  // 没有任何进入方式，而它的角色绑定还在，没有人能进来清理。
  //
  // 摘掉之后该渠道不再通向这个主体，下次用它登录会登记出一个新的、零权限
  // 的主体——这是预期行为，不是权限丢失，界面必须说明这一点。
  rpc UnbindIdentity(UnbindIdentityRequest) returns (UnbindIdentityResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
  }

  // 完成一次渠道绑定。
  //
  // 渠道凭证**不在这里**：所有渠道都是重定向型，凭证经一次浏览器导航到达
  // 服务端，由回调校验过之后记成一份一次性的"待绑定凭据"，只经浏览器不可读的
  // cookie 交回。本方法只负责在**当前已认证主体**上兑换它——归属仍然只由当前
  // 凭证决定，不由请求里的任何字段决定（不存在"把身份绑到指定主体"的形状）。
  //
  // **归属由发起者决定，不由凭证决定。** 凭证只证明"发起者控制着这个身份"，
  // 因此这里只可能绑到当前凭证代表的主体上。该身份已属于另一个主体时拒绝，
  // **不转移、不合并**：转移意味着任何拿到该渠道凭证的人都能把别人的进入方式
  // 夺走一部分，而这个动作在系统里与一次正常绑定没有区别。唯一的窄口子是
  // "空主体认领"（见 docs/design/identity/identity-linking.md）：原主体只有这条
  // 身份、且没有任何角色绑定时，身份被并入当前主体。
  rpc CompleteIdentityBinding(CompleteIdentityBindingRequest) returns (CompleteIdentityBindingResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
  }

  // 列出当前主体已绑定的全部登录渠道。
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 发起一次命令行的设备码登录。
  //
  // 公开是必须的：调用方正是那个还没登录的终端。它拿到一个给人看的短码与
  // 一个给终端保管的设备码，后者是这台设备在批准之前的唯一凭据来源。
  //
  // 未配置对外地址时**本路径整体缺席**，返回"未实现"而不是"设备码无效"——
  // 把配置缺失说成凭证问题，会让排障的人去查终端拿的是什么。
  rpc StartDeviceLogin(StartDeviceLoginRequest) returns (StartDeviceLoginResponse) {
    option (aladdin.rbac.v1.public) = true;
  }

  // 轮询一次设备码登录的结果。
  //
  // 公开，理由同上。**结果是一个状态，不是一个错误**：把"还没批准"表达成
  // 一个错误码，会让"这一次轮询没结果"与"你未认证"变成同一个结论，而它们
  // 该有完全不同的走向——前者该继续等，后者该重新登录。
  //
  // 已批准时**恰好交付一次**会话凭证，此后再轮询同一份设备码只会得到
  // 非已批准的状态（见 docs/design/identity/device-login.md）。
  //
  // 它读起来像只读，实则会推进状态（上面那句"恰好交付一次"），因此**不**标
  // idempotency_level——标了就等于同时接受 GET，而 device_code 会随查询串
  // 落进访问日志，这与它"不得进入日志"的要求冲突。
  rpc PollDeviceLogin(PollDeviceLoginRequest) returns (PollDeviceLoginResponse) {
    option (aladdin.rbac.v1.public) = true;
  }

  // 批准一次设备码登录。
  //
  // **归属只由当前凭证决定**：请求里只有短码，没有主体——不存在"替某个主体
  // 批准"的形状。若存在，任何拿到别人短码的人都能让别人的终端登进自己指定
  // 的账号（见 docs/design/identity/device-login.md）。
  //
  // 交付的会话其作用域是**当前主体既有的默认作用域快照**：本方法不为这次
  // 登录新算作用域，也不接受请求里给的作用域，因此不需要声明作用域来源。
  rpc ApproveDeviceLogin(ApproveDeviceLoginRequest) returns (ApproveDeviceLoginResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
  }

  // 拒绝一次设备码登录。
  //
  // 与批准同一条归属规则。拒绝是**给使用者的出口**：短码被误输入、或这次
  // 登录不是自己发起的，人需要一个明确的"不"。
  rpc DenyDeviceLogin(DenyDeviceLoginRequest) returns (DenyDeviceLoginResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
  }
}

message LoginRequest {
  // 人类用户使用用户名口令；机器凭证使用 token 换取短期访问凭证。
  //
  // **外部身份源不在这里**：所有渠道都是重定向型，凭证由渠道直接交给服务端
  // 的一个浏览器直连端点，客户端从不经手（见 docs/design/identity/channel-login.md）。
  oneof credential {
    PasswordCredential password = 1;
    TokenCredential token = 2;
  }
}

message PasswordCredential {
  string username = 1;
  string password = 2;
}

message TokenCredential {
  string token = 1;
}

message GetAuthMethodsRequest {}

// GetAuthMethodsResponse 描述服务端当前启用了哪些登录方式。
//
// 只承载公开信息：这里出现的一切都会明文送到浏览器，因此不得放入任何
// 需要保护的取值。
//
// 返回的是**列表**而不是逐个具名字段：新增一个渠道时这里不该再改一次形状，
// 前端也不该为每个渠道多写一个判断分支（见 docs/design/identity/channel-login.md）。
message GetAuthMethodsResponse {
  // 已启用的登录渠道，顺序稳定。为空表示没有任何渠道登录方式可用，
  // 前端据此不渲染任何渠道入口。
  repeated AuthMethod methods = 1;
  // 命令行的设备码登录是否可用。
  //
  // 它**不是一个渠道**，因此不在 methods 里：它不引入任何渠道身份，只是把
  // 一个已有主体的会话交给终端。不可用时命令行据此不去发起，而不是发起了
  // 再收到一次"未实现"。
  bool device_login_enabled = 2;
  // 当前站点的准入姿态（开放注册 / 需要邀请码 / 不接受新账号）。
  //
  // 登录页要能说明白"这里需要邀请码"或"这里不接受新账号"，因此它随同一份
  // 清单下发。它同属公开取值——本来就会展示给任何一个打开登录页的人；藏起来
  // 不保护任何东西，只会让前端去硬编码一份会漂移的副本。
  //
  // **它只说准入，不说进来拿什么**：默认角色是权限信息，公开清单里不放。
  RegistrationMode registration_mode = 3;
}

// AuthMethod 是一个已启用的登录渠道。
//
// **只有一个来源标识**：所有渠道都是重定向型，入口是一个指向服务端起点的
// 导航，客户端不需要渠道的客户端标识（它由服务端持有并直接交给渠道）。
// 下发一个客户端用不上的值，只会多一处"看起来该用它"的地方。
message AuthMethod {
  // 渠道来源标识，如 google / github。前端据此决定渲染哪个入口。
  string source = 1;
}

message LoginResponse {
  string access_token = 1;
  // ISO 8601 UTC 时间。CLI 依据它做本地过期预检（见 cli-permissions.md）。
  string expires_at = 2;
}

message RefreshRequest {
  string access_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string expires_at = 2;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string subject_id = 1;
  // 主体类型：user / service_account / machine。
  string subject_type = 2;
  // 凭证自身绑定的默认作用域。
  string default_scope = 3;
}

message GetSessionPermissionsRequest {
  // 期望的作用域。留空时使用凭证的默认作用域。
  string scope = 1;
}

message GetSessionPermissionsResponse {
  string scope = 1;
  // 已展开的最终权限码集合。
  repeated string permissions = 2;
}

message CompleteIdentityBindingRequest {
  // 渠道来源，如 google。它只用于与待绑定凭据里记下的来源互相印证；
  // **不是归属输入**——目标主体只取当前凭证代表的主体。
  string source = 1;
}

// CompleteIdentityBindingResponse 返回绑定之后该主体的全部渠道。
message CompleteIdentityBindingResponse {
  repeated Identity identities = 1;
  // 本次是否认领了一个空主体上的身份。为 true 表示这个渠道此前单独登录过，
  // 客户端据此给出"已并入当前账号"的说明。
  //
  // 它只说明"发生过认领"，不告诉调用方原主体的任何标识。
  bool reclaimed = 2;
}

message UnbindIdentityRequest {
  // 渠道来源，如 google。
  string source = 1;
  // 该渠道上的身份标识。
  string external_id = 2;
}

message UnbindIdentityResponse {
  repeated Identity identities = 1;
}

message ListIdentitiesRequest {}

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

// Identity 是一个已绑定的登录渠道。
//
// **没有任何一个字段参与判定**，它们只用于展示与解绑时定位。
message Identity {
  // 渠道来源，如 google。
  string source = 1;
  // 该渠道上的身份标识。用于发起解绑；它本身不是秘密——拿到它也冒充不了
  // 谁，登录仍要过渠道自己的校验。
  string external_id = 2;
  // 该渠道给出的可读标识（如邮箱），仅供展示。
  string display = 3;
}

message StartDeviceLoginRequest {}

// StartDeviceLoginResponse 同时承载**两份凭据**与一个给人用的地址。
message StartDeviceLoginResponse {
  // 设备码：终端保管，用它轮询。不可人工输入，因此没有任何可读性要求。
  // **不得进入日志**：它能换来一份会话。
  string device_code = 1;
  // 短码：给人读、给人打。大小写不敏感，连字符可有可无。
  // 它与设备码同级——能换来一次批准，因此**不得进入日志**。
  string user_code = 2;
  // 批准页地址。**不含短码**：短码要由人与终端上显示的比对，把短码放进地址
  // 会消掉这次核对，而那正是"受害者把终端登进攻击者账号"的唯一防线。
  string verification_uri = 3;
  // 建议的轮询间隔（秒）。
  int32 interval_seconds = 4;
  // ISO 8601 UTC。终端的轮询不得越过它。
  string expires_at = 5;
}

message PollDeviceLoginRequest {
  // 服务端在发起时交给终端的设备码。
  string device_code = 1;
}

// DeviceLoginState 是一次轮询的结果。
//
// 它是一个**状态**而不是一组错误码：调用方据此决定继续等、停下、还是重新
// 发起。四种取值互斥且穷尽——分不出类别的取值会让调用方只能猜。
enum DeviceLoginState {
  DEVICE_LOGIN_STATE_UNSPECIFIED = 0;
  // 尚未批准。继续等。
  DEVICE_LOGIN_STATE_PENDING = 1;
  // 已批准。**只有这一次**返回凭证；此后同一份设备码只会得到 EXPIRED。
  DEVICE_LOGIN_STATE_APPROVED = 2;
  // 使用者拒绝了。
  DEVICE_LOGIN_STATE_DENIED = 3;
  // 已过期、已交付、或从未存在。对调用方是同一件事：重新发起。
  //
  // 三者合并为一个取值是刻意的：区分它们只会把一次失败的轮询变成对
  // "这份设备码是否曾经有效"的探测。
  DEVICE_LOGIN_STATE_EXPIRED = 4;
}

message PollDeviceLoginResponse {
  DeviceLoginState state = 1;
  // 仅 state 为 APPROVED 时存在：会话凭证与它的过期时间。
  string access_token = 2;
  string expires_at = 3;
}

message ApproveDeviceLoginRequest {
  // 要批准的短码。**不是归属输入**——目标主体只取当前凭证代表的主体。
  string user_code = 1;
}

message ApproveDeviceLoginResponse {}

message DenyDeviceLoginRequest {
  string user_code = 1;
}

message DenyDeviceLoginResponse {}

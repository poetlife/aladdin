syntax = "proto3";

package aladdin.galaxy.v1;

import "aladdin/objectstore/v1/upload.proto";
import "aladdin/rbac/v1/annotations.proto";

option go_package = "github.com/poetlife/aladdin/api/gen/aladdin/galaxy/v1;galaxyv1";

// GalaxyService 是创作面：用户放下一组具名文件与素材，然后把它发布成一个
// 别人能打开的站点。
//
// 边界：它不回答"你是谁"（认证）也不回答"你能做什么"（RBAC）。**两把闸门
// 各管一件事**：`galaxy.*` 权限码决定这个主体有没有资格创作，工程的拥有者
// 决定他能不能碰这一个工程。后者不由 RBAC 表达，也不在本服务的请求里出现
// ——**接口面上没有"指定拥有者"这个形状**，拥有者由凭证决定。
//
// **"不是你的"与"不存在"返回同一个结论。** 区分它们等于提供一个工程枚举
// 接口：拿着别人的工程标识反复调用，"不存在"与"无权访问"的差集就能把一个
// 不可猜标识试出来。而工程标识是发布地址的一部分，猜出它就能看到别人的
// 页面（见 docs/design/galaxy/project-versioning.md）。
//
// 作用域从**凭证绑定的默认作用域**解析：请求里没有作用域字段，也不该有
// ——工程是资源归属的载体，不是作用域的载体。
service GalaxyService {
  // 读取当前部署下创作能力的边界：能不能传素材、能不能发布、各项上限。
  //
  // 它是**能力下发点**，与档案的 avatar_upload_enabled 同一取向：能力由
  // 服务端说，客户端不猜。前端据此不渲染未启用的入口，而不是渲染一个点了
  // 报错的控件。它退回的每一项都是部署形态的公开事实，不因调用者而异。
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 列出调用者自己的工程。**只有这一个列表入口，且它的范围由凭证决定。**
  //
  // 刻意没有"列出所有工程"或"列出某个主体的工程"的形状：工程标识不可猜
  // 是发布态匿名可读的唯一防线，任何枚举入口都会把它降级成"打开就能逛"。
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 创建一个工程，并选一个或多个**内容槽**。标识由服务端分配，不可猜、不可改、
  // 不复用。
  //
  // **至少选一个槽，此后只增不删**（见 AddProjectSlot）。每个槽各有自己的草稿、
  // 版本、发布指针与地址（见 docs/design/galaxy/site-model.md）。
  //
  // 名称**不参与任何查找**：不按名称查工程、不加唯一约束、不进发布地址。
  // 一旦名称成为查找键，它就成了一条可以被改名或抢注改写的路径。
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 给一个已有工程加一个内容槽。
  //
  // **单向**：没有"删掉一个槽"的对应方法——槽的语义与地址是固定的，已有的版本
  // 与地址都挂在它上面，因此删除要单独论证（见 site-model.md）。**加一个槽不
  // 改变另一个槽**：那个槽的草稿、版本、发布指针与地址都原样。
  rpc AddProjectSlot(AddProjectSlotRequest) returns (AddProjectSlotResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 读取一个工程的元数据。不含草稿清单、版本清单与资产字节。
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 修改工程的名称与简介。请求表达的是**期望的完整状态**，空串表示清空。
  //
  // **不含内容槽**：槽只增不删，且"有哪些槽"由 AddProjectSlot 回答，因此它不在
  // 这个请求的形状里。
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 删除一个工程。**连带删除它的全部版本、资产与发布记录**，因此已发布的
  // 地址立刻变成"不存在"。公开区上已上架的字节不回收（见发布一节）。
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 读取工程的当前草稿清单，每一项带一条短时读取地址。
  //
  // 草稿行是惰性创建的：从未推送过草稿时清单为空。地址由客户端直连取字节，
  // 服务端不代理（见 docs/design/galaxy/asset-library.md）。
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 以给定的清单**整组替换**草稿（它不产生版本）。
  //
  // 它表达的是**期望的完整状态**，不是增量：清单里没有的路径就是"删掉"。
  // 否则"我到底删没删掉那一份"会变成一个需要读命令行实现才能回答的问题。
  //
  // **这是内容唯一的编辑路径**（命令行）。网页端不能编辑内容：两个编辑器并存会
  // 引出"网页上刚改的一句被一次 push 静默盖掉"这类只在两个入口之间发生的冲突，
  // 收成一条路径，那份冲突连同它需要的基线校验一起不存在。**唯一的例外是恢复草稿
  // 历史**（RestoreDraftSnapshot）——它不是编辑，而是一次**显式的整组替换**，并且
  // 落在这同一条路径上、同样先给被换掉的那一份留一条快照，因此它不会静默盖掉什么。
  //
  // **被换掉的那份清单会留成一条草稿快照**（见 ListDraftSnapshots）："只推不存
  // 版本"这条最常见的用法因此不会让中间过程消失。相同清单不重复留。
  //
  // 请求里的条目**只引用已经上传好的对象**（文本条目是内容摘要，资产条目是
  // 资产标识），因此本方法不带字节，也不触发任何上传。
  rpc PushDraft(PushDraftRequest) returns (PushDraftResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 列出某个槽的**草稿历史**：被替换掉的那些旧清单，最近的在前。
  //
  // 草稿快照**不是版本**：没有序号、不能发布、按保留策略过期（见
  // docs/design/galaxy/project-versioning.md）。它是"只推不存版本"这条用法的
  // 兜底——那套用法下中间过程本来一点记录都没有。
  rpc ListDraftSnapshots(ListDraftSnapshotsRequest) returns (ListDraftSnapshotsResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 把草稿**整组换回**某一条快照的清单。
  //
  // **恢复本身也留一条快照**：它是同一处草稿替换，因此恢复不会让你丢掉恢复前的
  // 内容。它不碰另一个槽。
  //
  // **引用了已删除资产的快照不能恢复**：恢复出来的会是一份必然在校验阶段失败的
  // 草稿，而用户从"恢复成功"这句话里看不出问题在哪。服务端如实拒绝并指出那一处。
  rpc RestoreDraftSnapshot(RestoreDraftSnapshotRequest) returns (RestoreDraftSnapshotResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 把草稿的当前清单保存成一个**不可变**版本。
  //
  // 保存即冻结：此后改草稿、改工程名称、删资产都不改变这个版本读回的内容。
  // 连续保存两次相同清单产生两个版本，而不是"检测到重复就不新增"——两份
  // 看起来一样的清单对用户是两次不同的保存动作。
  //
  // 两个可选入参：`description` 是这一版的一句说明（可事后改，见 UpdateVersion）；
  // `from_snapshot_id` 非空时存的是**那条草稿快照**的清单，而不是当前草稿——它
  // 回答的是"我想把那次中间态正式记下来"。
  rpc SaveVersion(SaveVersionRequest) returns (SaveVersionResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 改一个版本的**说明**。
  //
  // **它只改说明那一层。** 与资产同一条：不可变说的是**内容**（文件清单、渲染规则
  // 版本），而说明回答的是"这一版是干什么的"，它不进产物、不参与任何判定。清单、
  // 序号、保存时间在改动前后逐字不变，已发布的页面也不受影响。
  //
  // 请求表达**期望的完整状态**：空串清空说明。**两端都能改**——写错一句话与"把
  // 这一版的内容改掉"是两件事，而前者若只能靠再存一版来修，人会宁可不写。
  rpc UpdateVersion(UpdateVersionRequest) returns (UpdateVersionResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 列出工程的版本，按序号排序。清单很小，因此**列表也带清单**（不带地址）。
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 读取一个版本，含清单与每一项的短时读取地址。保存时的内容此后逐字不变。
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 删除一个版本。**被当前发布指向的版本不可删**——那会让发布地址指向一个
  // 不存在的版本。序号不因删除而重排，因此删中间一个会留下空洞。
  rpc DeleteVersion(DeleteVersionRequest) returns (DeleteVersionResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 校验**当前草稿的清单**能不能发布。**编辑器提示与发布前置校验共用这一个
  // 入口。**
  //
  // 前端**不得**复写一套引用解析：两端各写一份的表现是"提示说没问题、发布
  // 说不行"（或反过来），而用户无法从任何一个提示里知道哪句是真的。它返回的
  // 是一个**问题清单**而不是单个错误——界面要的是"哪几处有问题"。
  // 存储不可用这类故障仍然以 RPC 错误返回，与"内容有问题"分开。
  //
  // 它校验的是**已保存的草稿**，请求里不带内容：写入只有一条路径（命令行
  // push 整组），因此"校验一份还没保存的内容"这个形状不存在。
  //
  // 它只读，但**不**标 idempotency_level：标了就等于同时接受 GET，而这条
  // 路径要读对象存储、可能较慢，不适合被当作可缓存的安全方法。
  rpc ValidateDraft(ValidateDraftRequest) returns (ValidateDraftResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 给出**草稿整站的预览地址**，供只有本人能看的预览使用。
  //
  // 预览不是"把一份 HTML 塞进 iframe"：服务端把草稿整组按发布的路径形状，从
  // 发布域上一条带**短时凭证**的地址上提供（见 docs/design/galaxy/site-model.md
  // 的"预览"与 authoring.md）。页面因此有自己的源与目录，页内的相对地址、站点
  // 绝对地址与脚本里拼出来的路径都由浏览器自己解析——与发布态同一套道理。
  //
  // 凭证短时有效、随地址走；过期的表现是这一页取不到，重新调用本方法即得到新
  // 地址（与"重新读取档案即得到新地址"同源）。
  rpc PreviewDraft(PreviewDraftRequest) returns (PreviewDraftResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 开始一次**内容对象**（文本条目）的上传：签发一份直传凭证。
  //
  // 内容对象与资产走**同一条直传链路**，差别只有三处：键按内容摘要、类型由
  // 路径与内容槽派生（不存在"声明"这一层）、不进公开区。
  //
  // **按内容摘要寻址对写入提了一条硬性约束：仅当对象不存在时才允许写入。**
  // 否则一个伪造的摘要会落到另一个版本已经在用的键上，把那个对象改写掉——
  // 而那是"版本不可变"的反面。凭证带"禁止覆盖"的写入条件，提交时服务端再
  // 读回核对一次摘要。
  rpc BeginContentUpload(BeginContentUploadRequest) returns (BeginContentUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 提交一次内容对象上传：读回对象、核对摘要。
  //
  // **摘要是寻址键，而服务端没有字节可以自己算它**——它由上传方声明。因此
  // 写入之后必须读回核对一遍，不一致即删除该对象并拒绝。
  rpc CommitContentUpload(CommitContentUploadRequest) returns (CommitContentUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 列出工程资产库里的资产，含**短时有效**的读取地址。
  //
  // 可选按标签筛选（精确匹配、多值取**交集**）。响应里另给一份**整个工程**
  // 已有的标签，供筛选界面做候选——它不随本次筛选收窄，否则筛一次之后候选
  // 就只剩下筛出来的那几个，用户无法取回原来的面。
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.asset.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 开始一次资产上传：分配资产标识并签发一份直传凭证。
  //
  // **字节不经过服务端**（见 docs/design/objectstore/README.md）。服务端在这里
  // 做三件事：校验调用的工程属于调用者、校验**声明的**内容类型在白名单内、
  // 按声明的大小早退；然后把"只许写这一个键、类型与大小受条件约束"的策略交给
  // 对象存储，由它执行。
  //
  // **类型与摘要都是上传方声明的，服务端不看字节。** 类型决定此后下发时回给
  // 浏览器的内容类型，而白名单里没有任何可执行类型——因此公开区上的对象永远
  // 以一个无害类型下发；摘要则在提交时被核对（让存储侧算，存储侧给不出时读回
  // 自己算），不一致即拒绝提交。
  rpc BeginAssetUpload(BeginAssetUploadRequest) returns (BeginAssetUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.asset.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 提交一次资产上传：核对字节确实到了、内容与声明的摘要相符，写入资产元数据。
  //
  // 签发之后客户端传了什么、传没传完，服务端都不知道，因此提交要对那个键做
  // 一次 Head：不存在即失败，字节数超过上限即失败并删除对象；随后核对摘要，
  // 不符同样删除对象并拒绝。**没有提交的上传不会进入任何清单**（元数据行不存在）。
  //
  // 可以顺带带上初始的标题 / 标签 / 备注（都可空）。一次带走省掉一次往返，
  // 而结果与"提交之后再调 UpdateAsset"完全相同。
  rpc CommitAssetUpload(CommitAssetUploadRequest) returns (CommitAssetUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.asset.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 删除一个资产。**被任一版本的文件清单引用时拒绝**，错误信息指出被哪些
  // 版本引用。
  //
  // 拒绝的理由是版本不可变的含义包括"它此后永远可以发布"：一个引用了已删
  // 除资产的版本必然在校验阶段失败，而那时用户看到一句"资产不存在"，却无法
  // 从版本内容里知道该怎么做。把问题挡在它产生的地方。
  rpc DeleteAsset(DeleteAssetRequest) returns (DeleteAssetResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.asset.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 改一个资产的展示标题、标签与备注。
  //
  // **它只改"说明层"。** 资产有不可变与可变两层（见
  // docs/design/galaxy/asset-library.md）：字节、内容摘要、媒体类型、类别与
  // 字节数在改动前后逐字不变，因此公开区地址不变、已发布页面拿到的还是同一
  // 份字节。接口面上不存在"替换资产字节"的方法。
  //
  // 请求表达**期望的完整状态**（与 UpdateProject 同取向）：空串清空标题或
  // 备注，标签以请求集合**整体替换**。
  rpc UpdateAsset(UpdateAssetRequest) returns (UpdateAssetResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.asset.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 列出工程的**附件**（二进制、zip、导出文件），含**短时有效**的下载地址。
  //
  // 附件与资产并列而不混用（见 docs/design/galaxy/attachments.md）：资产会被网页
  // 引用、由浏览器渲染；附件只给工程成员下载。**类型不限**，因此这条路径上没有
  // 白名单，也没有标签与筛选——它们是构建产物，一个工程几十份就到头了。
  //
  // 它**不按任何东西筛选**：筛选是资产那边的问题（那里有几百张图与标签）。
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.attachment.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 开始一次附件上传：分配附件标识并签发一份直传凭证。
  //
  // 与 BeginAssetUpload 同构，差别有三处，都由"附件收任意类型"推出：
  //
  //   - **请求里没有内容类型**：附件的下发类型恒为中性那一档（见 Attachment），
  //     因此上传时那一次声明不产生任何对外可见的后果。存储侧的策略里仍带一条
  //     类型规则——**上限绑在它上面**；
  //   - **上限是一档**（如 500 MiB），不按类别分档；
  //   - **另有一道工程总量配额**：声明的大小加上已占用的量超过上限时被拒。
  //
  // 两者都是**按声明值早退**，不是安全边界：真正的判定在 CommitAttachmentUpload，
  // 用的是核对出来的真实字节数。
  rpc BeginAttachmentUpload(BeginAttachmentUploadRequest) returns (BeginAttachmentUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.attachment.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 提交一次附件上传：核对字节确实到了、内容与声明的摘要相符，写入附件元数据。
  //
  // 核对顺序与 CommitAssetUpload 相同（存在性 → 真实字节数 → 单文件上限 →
  // 工程配额 → 摘要），任一不过即删掉那个对象并拒绝。**配额在这里是用真实字节数
  // 复核的**：声明一个小值、传一个大值上来，走到这一步就被挡住。
  //
  // 标注的版本在这里**重新校验**：两次调用之间服务端不保留任何状态，那正是
  // "未提交的上传不留痕迹"的实现方式。
  rpc CommitAttachmentUpload(CommitAttachmentUploadRequest) returns (CommitAttachmentUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.attachment.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 改一份附件的说明。
  //
  // **它只改说明**：文件名、字节数、内容摘要、标注的版本与对象键在改动前后逐字
  // 不变，因此已经发出去的下载地址指向的还是同一份字节（与 UpdateAsset 同源）。
  // 请求表达**期望的完整状态**：空串清空说明。
  rpc UpdateAttachment(UpdateAttachmentRequest) returns (UpdateAttachmentResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.attachment.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 删除一份附件：删私有区的对象与元数据行。
  //
  // **它不被任何引用拦阻。** 附件不被文件组引用；版本标注也不构成引用——标注在
  // 版本删除时被清空，而不是反过来拦住删除（见 docs/design/galaxy/attachments.md）。
  // 这与"被引用的资产不可删"是两件事：那条的理由是版本不可变意味着"它此后永远
  // 可以发布"，而附件不参与发布。
  rpc DeleteAttachment(DeleteAttachmentRequest) returns (DeleteAttachmentResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.attachment.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 签发一份附件的**下载地址**（短时有效）。
  //
  // 它刻意**不标 idempotency_level**：签名本身是无副作用的，但这条响应里带的是
  // 一份**短时凭证**——把它标成"可安全用 GET"会让那条地址进浏览器的缓存与各级
  // 访问日志。与 PollDeviceLogin 不标是同一条理由（见 AGENTS.md 的传输方式一节）。
  //
  // 下载的响应头由签发策略固定（中性的内容类型 + `attachment`），因此不管这份
  // 字节是什么、文件名以什么结尾，浏览器都只会把它存下来。调用方拿到的是**整条
  // 地址**，不要自己拼来源头。
  rpc GetAttachmentDownloadURL(GetAttachmentDownloadURLRequest) returns (GetAttachmentDownloadURLResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.attachment.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 发布一个版本：校验、把引用的资产上架到公开区、落库产物清单、切换发布指针。
  //
  // **只能发布版本，不能发布草稿**——草稿是可变的，"发布一个可变的东西"
  // 没有意义。草稿清单不会被读取。
  //
  // 发布域未配置时这一项不可用（见 GetCapabilities）。
  rpc Publish(PublishRequest) returns (PublishResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.publish";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 撤回发布：把发布指针置空，地址立刻不可达。
  //
  // 发布记录保留，因此可以重新发布同一个版本；公开区的副本不因撤回而删除。
  // 撤回用发布那一码——它是发布的反向操作，不给它单独一码不会带来任何安全
  // 收益，只会让"发布得出去、收不回来"变成一个可以只授一半的组合。
  rpc Unpublish(UnpublishRequest) returns (UnpublishResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.publish";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 读回**某个槽当前发布**的那一份产物清单：发布记录、路径、以及每一项在**访客
  // 路径**上的读取地址。
  //
  // 它是"发布成功了"这件事的核对入口。发布物里的地址是渲染时补上的（源里、版本
  // 里都只有 `asset://` 记号），因此只拿着 Publish 的返回值证明不了引用都解开了。
  // 清单就是发布时落库的那一条记录——**不是重新算一遍**，因此它回答的正是"现在
  // 发出去的是什么"。
  //
  // **未发布不是错误**：那时 publication 与 entries 都为空，与 published_url
  // 为空是同一条取向。
  //
  // 它是**归属内的读**（发布者核对自己的产物），因此要 `galaxy.project.read` 与
  // 工程归属；发布态本身仍是公开匿名的，那是发布域那条 HTTP 入口的事。
  rpc GetPublication(GetPublicationRequest) returns (GetPublicationResponse) {
    option (aladdin.rbac.v1.required_permission) = "galaxy.project.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 把一条**主站分享路径**解析成它在发布域上的内容地址。
  //
  // 主站壳（`<主站>/g/<工程标识>[/docs][/路径]`）用它问出 iframe 该指向哪里。
  // **槽的判定在服务端**（与发布地址那条 HTTP 入口共用同一处形状解析），因此
  // 请求给的是整条路径，响应给的是整条内容地址——客户端两头都不拼。
  //
  // 它是**公开**的：访客打开一条分享地址时没有会话，而"分享给没登录的人"正是
  // 这个入口唯一的用途（见 docs/design/rbac/server-permissions.md 的公开方法白
  // 名单）。它只凭工程标识作答，与发布地址那条 HTTP 入口回答的是同一件事。
  //
  // **否定结论只有一个**：未发布、已撤回、该槽未启用、工程不存在、标识没被猜
  // 中、路径不在集合里，一律返回空的 `content_url`，而不是 RPC 错误——错误码会
  // 成为一个"这个标识是真的"的第二信号（见 docs/design/galaxy/publication.md 的
  // "主站壳"）。
  rpc ResolveSharedPage(ResolveSharedPageRequest) returns (ResolveSharedPageResponse) {
    option (aladdin.rbac.v1.public) = true;
  }

  // **工程状态变化的订阅不在本服务上。** 事件通道是**连接级**的（一条流承载多个
  // 主题，下一个要推送的业务只加主题），因此它不属于任何一个业务服务，见
  // aladdin.events.v1.EventsService 与 docs/design/events/README.md。本服务的写
  // 路径只负责往 `galaxy.project/<工程标识>` 这个主题上发一条事件。
}

// ContentSlot 是工程的一块独立内容。
//
// 一个工程有一到两个槽，**创建时至少选一个，此后只增不删**。每个槽各有自己的
// 草稿、版本、发布指针与地址，**两个槽互不影响**：在一个槽上的任何动作都不改变
// 另一个槽。两种槽的差别落在入口、渲染与扩展名白名单三处（见
// docs/design/galaxy/site-model.md），**没有一处在对象存储的键上**。
enum ContentSlot {
  CONTENT_SLOT_UNSPECIFIED = 0;
  // 整站文件原样服务。覆盖手写单页与构建产物，入口是 index.html，
  // 地址是工程根 `/g/<工程标识>/`。
  CONTENT_SLOT_SITE = 1;
  // 一组 markdown 渲染成多页，站点文件原样带上。入口是 index.md，
  // 地址是工程根下的 `docs/`。**`docs` 因此是保留首段**：site 槽的路径不得
  // 以它开头，写入期拒绝。
  CONTENT_SLOT_DOCS = 2;
}

// MediaKind 是资产按媒体分出的类别。
//
// 它决定的是**用哪一档大小上限**：一张图与一段视频的合理体积差两个数量级，
// 用同一个上限卡两者，要么放过一张过大的图，要么拒掉一段正常的视频。它同时
// 是对象键里的一段（见 docs/design/galaxy/asset-library.md）。
enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
  // 字体是随构建产物进来的那一类：任何工具产出的整站几乎都会带一份 webfont，
  // 而在文件组里它必然是二进制，因此只能作为资产。
  MEDIA_KIND_FONT = 4;
}

// FileEntry 是文件组里的一条条目：一个路径，加上它的字节从哪来。
//
// 两类条目恰好对应"字节在哪"的两种答案（见 docs/design/galaxy/site-model.md）：
// 文本条目的字节是按**内容摘要**寻址的内容对象；资产条目的字节是资产库里的
// 一个媒体文件。**清单里没有字节本身**，因此同一个工程内、同一份未改动文件在
// 多个版本、多次发布之间共享同一个对象。不跨工程共享。
message FileEntry {
  // 相对路径。它是**公开地址的一部分**，因此字符集受 URL 安全字符集约束，
  // 不含 `..`、不以 `/` 开头或结尾、不含空段。
  string path = 1;
  oneof source {
    // 文本条目：字节的内容摘要（SHA-256 十六进制）。私有区对象键由工程标识与
    // 它共同构成（`galaxy/<工程标识>/text/<摘要>`），不跨工程共享。
    string digest = 2;
    // 资产条目：资产库里的一个资产标识。
    string asset_id = 3;
  }
  // 读取地址，客户端直接取字节。**取值随调用它的方法而不同**：
  //
  //   - GetDraft / GetVersion 填的是**编辑态的短时凭证**——它是一份短期凭证，
  //     因此未发布的资产里不得承载秘密，过期后重新读取清单即得到新地址；
  //   - GetPublication 填的是**发布态的那条访客地址**（文本条目就是内容地址，
  //     资产条目由它重定向到公开区）——那条地址本来就是公开的，不是凭证。
  //
  // 写入路径（PushDraft）忽略这个字段。
  string url = 4;
}

// AssetKindLimit 是某一类资产的字节上限。
//
// 它随能力下发，让客户端在选文件时就早退，免得把一个几十 MB 的文件整个传
// 上来只为了被拒。**服务端仍然是权威**：客户端这一判断只是省一次往返，
// 不是一条安全边界。
message AssetKindLimit {
  MediaKind kind = 1;
  uint32 max_bytes = 2;
}

// Capabilities 是当前部署下创作能力的边界。
//
// 两个布尔项是**部署形态**的公开事实，不因调用者而异：未配置对象存储时
// 素材传不了，未配置发布域时页面发不出去，而工程与版本照常可用。
message Capabilities {
  // 是否配置了对象存储桶。为假时不渲染上传入口与资产区。
  bool asset_upload_enabled = 1;
  // 是否可用发布。为假时不渲染发布入口。
  bool publish_enabled = 2;
  // 是否可用预览。为假时不渲染预览：预览走发布域上的一条通道，没有发布域的
  // 部署就没有预览（如实缺席，而不是给一份解析不了自己引用的文档）。
  bool preview_enabled = 7;
  // 单份文本条目的字节上限。
  uint32 max_text_bytes = 3;
  // 整组文件（清单里所有文本条目之和）的字节上限。
  uint32 max_file_set_bytes = 4;
  // 整组的文件数上限。
  uint32 max_files = 5;
  // 各类资产的字节上限。
  repeated AssetKindLimit asset_limits = 6;
  // 是否可用附件。为假时不渲染附件入口。
  //
  // 它与 asset_upload_enabled 同源（都取决于"有没有桶"）但**分开表达**：客户端要
  // 能分别裁剪——一个部署可以只授其中一码。
  bool attachment_enabled = 8;
  // 单份附件的字节上限。
  //
  // 它比资产最高那一档大得多：附件是构建产物，一个带依赖的发布包几百 MB 是常态。
  uint64 max_attachment_bytes = 9;
  // 一个工程的**附件总量**上限。
  //
  // 它与单文件上限是两件事：前者回答"一次能传多大"，后者回答"这个工程一共能放
  // 多少"。只有一个的话，一份 500 MiB 的包重复传二十遍就把一个工程的存储吃完了，
  // 而每一次都合规。
  uint64 project_attachment_quota_bytes = 10;
}

// Project 是一个创作单元的元数据。
//
// **不带草稿清单、版本清单与资产字节。** 列表接口会读这一行，把清单挂上来
// 是一笔与列表无关的代价；整张表也不含任何字节。
message Project {
  // 工程标识。由服务端分配，不可猜、不可改、不复用。
  //
  // 它是**发布地址的一部分**，而发布态是公开匿名的：拿到地址的人能看，
  // 猜不出地址的人看不到（见 docs/design/galaxy/README.md 的"发布即公开"）。
  string id = 1;
  // 名称。可改。**仅用于本人识别**，不是查找键，不进发布地址。
  string name = 2;
  // 简介。为空表示未填写。
  string description = 3;
  string created_at = 4;
  string updated_at = 5;

  // 6–11 原先是"一个形态 + 一份发布状态"。形态与发布状态现在都**按槽**给出，
  // 见 slots，因此这几个字段号保留，不再复用。
  reserved 6, 7, 8, 9, 10, 11;

  // 启用的内容槽，每个带它自己的发布状态与地址。**至少一个**。
  //
  // 槽只增不删（见 AddProjectSlot），因此这个列表只会在后面追加。**每个槽的
  // 发布状态都属于它自己**：发布或撤回一个槽不改变另一个槽的任何字段。
  repeated ProjectSlot slots = 12;
}

// ProjectSlot 是工程的一个内容槽，以及它当前的发布状态。
//
// 一个槽一条。**行存在即槽启用**——"这个工程有哪些内容"只有这一处回答，
// 工程行上不重复存一份。
message ProjectSlot {
  ContentSlot slot = 1;
  // 这个槽当前是否处于发布态。
  bool published = 2;
  // 这个槽当前发布指向的版本标识。未发布时为空。
  string published_version_id = 3;
  // 这个槽的**分享地址**：site 槽形如 <主站>/g/<工程标识>，docs 槽形如
  // <主站>/g/<工程标识>/docs。未发布时为空。
  //
  // **它落在主站，不落在发布域**：贴给别人的是这一条，打开它由主站壳用跨源沙箱
  // iframe 取发布域上的同一条路径（见 docs/design/galaxy/publication.md 的"主站
  // 壳"）。发布域上的内容地址由 ResolveSharedPage 给出，默认不展示。
  //
  // **地址由服务端算好**，客户端不拼：记号解析生成的地址、内容安全策略里的
  // 允许来源与这条分享地址都从同一批配置值派生，客户端再拼一份就是又一个来源。
  string published_url = 4;
  // 这个槽当前发布的生效时间。未发布时为空。
  string published_at = 5;
  // 这个槽的**发布根**，形如 <发布域>/g/<工程标识>/（docs 槽到 `docs/`），
  // 供构建命令使用（vite 的 --base）。
  //
  // 配置了发布域时始终有值，与是否已发布无关：构建产物里的绝对路径要成立，
  // 靠的是它，而不是"页面已经发出去"。未配置发布域时为空。
  string base_url = 6;
}

// Draft 是**某个内容槽**当前正在编辑的文件清单。
//
// 它不是版本：随时可改，改它不产生版本，不参与发布，也不保证可退回。
message Draft {
  repeated FileEntry entries = 1;
  // 最后一次推送的时间。从未推送过草稿时为空。
  string updated_at = 2;
  // 这是哪个槽的草稿。
  ContentSlot slot = 3;
}

// Version 是文件清单的一次不可变快照。
message Version {
  string id = 1;
  // 在**本槽内**递增的序号。**仅用于展示与排序，不是标识。**
  // 删除一个版本会让后续序号出现空洞，这是可接受的。
  int64 seq = 2;
  string saved_at = 3;
  // 保存那一刻草稿的清单。**写入后不再修改。** 地址只有 GetVersion 填充。
  repeated FileEntry entries = 4;
  // 保存时所处的渲染规则版本。只有 `docs` 槽使用它，重新发布时按它渲染
  // 而不是按当前最新的——否则"撤回后重新发布同一版本，产物逐字相同"会在
  // 渲染器升级的那天悄悄失效。
  int32 render_rules_version = 5;
  // 这个版本属于哪个槽。**版本按槽隔离**：它只在自己的槽里被列出与发布。
  ContentSlot slot = 6;
  // 这一版的一句说明（"加了封面"）。空表示没有。
  //
  // **它是元数据层，与"版本不可变"不冲突**：不可变说的是清单与渲染规则版本，
  // 而说明不进产物、不参与任何判定，因此**可以事后改**（见 UpdateVersion）。
  string description = 7;
}

// DraftSnapshot 是**被替换掉的**那一份草稿清单。
//
// 它不是版本：没有序号、**不能发布**、按保留策略过期（每个槽最近 50 条且不超过
// 14 天）。它存在的理由是"只推草稿不存版本"这条最常见的误用——那种用法下中间
// 过程在改动发生的那一刻就没有任何记录（见 docs/design/galaxy/project-versioning.md）。
//
// **字节不随清单走**：条目指向的是按内容摘要寻址的不可变对象，与版本共享同一批。
message DraftSnapshot {
  // 快照标识。由服务端分配。
  //
  // **它与版本标识的段位不同**（`snp_` 对 `ver_`）：拿一条快照的标识去发布必须
  // 失败，而标识一眼看得出拿错了哪一种。
  string id = 1;
  ContentSlot slot = 2;
  // 被替换掉的那份清单。清单很小，因此随列表一起给出：界面上"这一份与现在差多少"
  // 要靠它答。
  repeated FileEntry entries = 3;
  // 替换它的那一端：`web` 或 `cli`。没带上报端标识时为空。
  string source = 4;
  // 它被替换掉的时刻。
  string created_at = 5;
}

// Asset 是工程资产库里的一个媒体文件。
//
// 字节在对象存储，这里只有元数据与一个短时读取地址。
//
// 元数据分**两层**（见 docs/design/galaxy/asset-library.md）：字节层
// （media_type、kind、size_bytes）**不可变**；说明层（title、tags、notes）
// **可改**，改它们不动字节层的任何一项，也不进发布产物。
message Asset {
  string id = 1;
  // 媒体类型。**上传方声明的**，服务端只校验它在白名单内，并把它作为此后
  // 下发时回给浏览器的内容类型。声明不等于验证（见 objectstore）。
  string media_type = 2;
  // 类别。它决定大小上限，也是对象键里的一段。
  MediaKind kind = 3;
  // 字节数。它取自提交时对对象的核对，不是声明值。
  uint64 size_bytes = 4;
  // 原始文件名。**仅供展示与排障**：它不进对象键，不参与任何判断。
  string filename = 5;
  string uploaded_at = 6;
  // **短时有效**的预签名读取地址，客户端直接放进 <img src>。
  //
  // 这个地址在有效期内谁拿到都能用，它是一份短期凭证。这正是"未发布的资产
  // 里不得承载秘密"这条约束的来源。过期后重新调用 ListAssets 即得到新地址。
  //
  // 未配置私有桶时为空。
  string url = 7;
  // 展示标题。**与 filename 分离**：文件名常是工具生成的乱码或不可信，
  // 而标题是给人看的。空表示没有标题，此时界面回退到 filename 展示。
  string title = 8;
  // 标签。工程内的自由字符串，不是全局字典，也不是权限资源。
  //
  // **值已归一化**（trim、小写、去重并升序、长度与数量受限，见
  // asset-library.md）：拿到的是唯一的那一份形式，调用方不必也不得自己再归一化
  // 或再排序一次。
  repeated string tags = 9;
  // 备注。纯文本，不是 Markdown。**不进对象键、不进发布产物、不进日志原文**。
  string notes = 10;
}

// Attachment 是工程里的一份**发布物**：二进制、zip 包、导出文件。
//
// 它与资产**并列而不混用**（见 docs/design/galaxy/attachments.md）：资产会被网页
// 引用、由浏览器渲染；附件只给工程成员下载。因此它的类型**不限**——它靠另一条
// 性质立住：下发时的响应头由签发策略固定（中性的内容类型 + `attachment`），
// 浏览器永远只把它存下来，不渲染、也不执行。
//
// **字节不可变**：没有"替换这一份的字节"这个动作，要换就重新上传一个。可变的只有
// description 那一层。**永不进公开区**，因此也不出现在发布产物里。
message Attachment {
  // 附件标识。由服务端分配，不可猜、不复用。
  string id = 1;
  string project_id = 2;
  // **标注**的版本，可空。它说明"这一份是那一版的构建产物"。
  //
  // **标注不是引用**：它不参与发布，也不拦阻版本删除——删除一个版本时指向它的
  // 标注被清空。因此这个字段可能从有值变成空，而附件本身不受影响。
  string version_id = 3;
  // 原始文件名。**仅供展示与排障**：它不进对象键，也不参与任何判断。
  //
  // 它另外会进下载响应头——那是唯一一处它对外可见的地方，而那一处会先滤掉会
  // 破坏响应头的字符（引号、反斜杠、控制字符与换行）。
  string filename = 4;
  // 字节数。它取自提交时对对象的核对，不是声明值。
  uint64 size_bytes = 5;
  // 字节的 SHA-256。**不是寻址键**（附件按标识寻址），只用于核对与展示。
  string digest = 6;
  // 说明。可改，空表示没有。
  string description = 7;
  string uploaded_at = 8;
  // **短时有效**的下载地址。响应头被固定成强制下载，因此点它只会把文件存下来。
  //
  // 未配置私有桶时为空。
  string download_url = 9;
}

// ValidationProblem 是校验发现的一处问题。
//
// message 里**带上出问题的文件与位置**：只说"有引用不合法"会让用户在一组
// 文件里自己找。
message ValidationProblem {
  string message = 1;
  // 出问题的文件路径。与行无关的问题（如整组超限）为空。
  string path = 2;
  // 出问题的行号（从 1 开始）。0 表示与行无关。
  int32 line = 3;
}

// Publication 是一次发布的产物记录。
//
// 发布域上的**内容地址**按产物清单分派：文本条目由服务端在它自己的路径上给出，
// 资产条目重定向到公开区；对外**分享**给访问者的是主站上的包装地址。
message Publication {
  string id = 1;
  string project_id = 2;
  string version_id = 3;
  string published_at = 4;
  // **分享地址**（主站包装），与对应 ProjectSlot.published_url 同一处派生。
  string url = 5;
  // 这次发布的是哪个内容槽。
  ContentSlot slot = 6;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  Capabilities capabilities = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  // 3 原先是一个必填的 SiteForm（形态）。形态现在是内容槽，见 slots。
  reserved 3;
  // 创建时要启用的内容槽。**至少一个、不重复**，此后只增不删（见 AddProjectSlot）。
  repeated ContentSlot slots = 4;
}

message CreateProjectResponse {
  Project project = 1;
}

message AddProjectSlotRequest {
  string project_id = 1;
  // 要加的槽。**必填**：没有"随便加一个"这个形状。
  ContentSlot slot = 2;
}

message AddProjectSlotResponse {
  // 加完之后完整的工程状态（含两个槽各自的发布状态）。
  Project project = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  string project_id = 1;
  // 期望的完整状态，空串表示清空。
  string name = 2;
  string description = 3;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string project_id = 1;
}

message DeleteProjectResponse {}

message GetDraftRequest {
  string project_id = 1;
  // 要读哪个内容槽的草稿。
  ContentSlot slot = 2;
}

message GetDraftResponse {
  Draft draft = 1;
}

// PushDraftRequest 表达的是草稿的**期望完整状态**，不是增量。
message PushDraftRequest {
  string project_id = 1;
  // 期望的完整清单。条目只引用已经上传好的对象，因此这里的 url 被忽略。
  repeated FileEntry entries = 2;
  // 要替换哪个内容槽的整组草稿。
  ContentSlot slot = 3;
}

// 返回推送之后的草稿，而不是一个成功标志：客户端刚做过一次会改变现状的
// 操作，让它在同一次往返里拿到新现状，比再发一次查询更省事。
message PushDraftResponse {
  Draft draft = 1;
}

message SaveVersionRequest {
  string project_id = 1;
  // 把哪个内容槽的草稿存成版本。
  ContentSlot slot = 2;
  // 这一版的一句说明，可空（见 Version.description）。写出了错可以事后用
  // UpdateVersion 改，不必为一句说明再存一版。
  string description = 3;
  // 非空时存的是**那条草稿快照**的清单，而不是当前草稿：它回答的是"我想把那次
  // 中间态正式记下来"。
  //
  // 那条快照引用的资产必须都还在：存一个"发布不出去的版本"与"版本不可变"的含义
  // （它此后永远可以发布）直接冲突，服务端因此如实拒绝。
  string from_snapshot_id = 4;
}

message SaveVersionResponse {
  Version version = 1;
}

message UpdateVersionRequest {
  string project_id = 1;
  string version_id = 2;
  // 该版本所属的内容槽。版本按槽隔离，因此要给。
  ContentSlot slot = 3;
  // 期望的说明。空串表示清空。
  string description = 4;
}

message UpdateVersionResponse {
  // 改完之后的版本（含说明）。清单、序号与保存时间逐字不变。
  Version version = 1;
}

message ListDraftSnapshotsRequest {
  string project_id = 1;
  ContentSlot slot = 2;
}

message ListDraftSnapshotsResponse {
  // 草稿历史，**最近的在前**。
  repeated DraftSnapshot snapshots = 1;
}

message RestoreDraftSnapshotRequest {
  string project_id = 1;
  ContentSlot slot = 2;
  string snapshot_id = 3;
}

message RestoreDraftSnapshotResponse {
  // 恢复之后的草稿。**恢复前的那一份已经成了一条新快照**，因此这一步不会丢掉
  // 任何内容。
  Draft draft = 1;
}

message ListVersionsRequest {
  string project_id = 1;
  // 列出哪个内容槽的版本。
  ContentSlot slot = 2;
}

message ListVersionsResponse {
  repeated Version versions = 1;
}

message GetVersionRequest {
  string project_id = 1;
  string version_id = 2;
  // 该版本所属的内容槽。版本按槽隔离，因此要给。
  ContentSlot slot = 3;
}

message GetVersionResponse {
  Version version = 1;
}

message DeleteVersionRequest {
  string project_id = 1;
  string version_id = 2;
  // 该版本所属的内容槽。版本按槽隔离，因此要给。
  ContentSlot slot = 3;
}

message DeleteVersionResponse {}

message ValidateDraftRequest {
  string project_id = 1;
  // 校验哪个内容槽的草稿。
  ContentSlot slot = 2;
}

// 问题为空表示这份草稿可以发布。**它是发布前置校验的同一份规则**，因此
// "这里通过"与"发布能成功"是同一个结论，不会漂移。
message ValidateDraftResponse {
  repeated ValidationProblem problems = 1;
}

message PreviewDraftRequest {
  string project_id = 1;
  // 要预览的那一份文件；为空表示入口。按**该槽**文件组里的路径给——
  // `docs` 槽的页面由服务端渲染，因此这里也可以给它的产物路径。
  string path = 2;
  // 预览哪个内容槽的草稿。凭证绑在（工程，槽）上，换一个槽要重新开一次。
  ContentSlot slot = 3;
}

message PreviewDraftResponse {
  // 草稿整站在发布域上的入口地址，带短时凭证。**iframe 的 `src` 就是它**，
  // 页内的其余文件由浏览器按同一个地址空间自己取。
  //
  // 为空表示**草稿里还没有可预览的入口**：那不是错误，而是"还没内容"。
  string url = 1;
}

message BeginContentUploadRequest {
  string project_id = 1;
  // **声明的**内容摘要（SHA-256 十六进制）。服务端用它和工程标识组成私有区
  // 对象键（不跨工程共享）。已存在则不必再传。
  string digest = 2;
  // **声明的**字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
  // 大小上限由存储侧按策略执行。
  uint64 size_bytes = 3;
}

message BeginContentUploadResponse {
  // 为真表示这个内容对象已经存在，客户端无需上传（也无需提交）。
  //
  // 这正是"同一份未改动的文件在多个版本之间共享一个对象"在接口上的样子：
  // 改一个字只产生一个新对象，没改的文件一次上传都不用做。
  bool already_exists = 1;
  // 直传凭证。**只允许写、只对这一个键有效、短时有效、且不允许覆盖已有
  // 对象。** already_exists 为真时为空。
  aladdin.objectstore.v1.DirectUploadCredential upload = 2;
}

message CommitContentUploadRequest {
  string project_id = 1;
  // 与服务端核对的那个摘要。**两次调用之间服务端不保留任何状态**（那正是
  // "未提交的上传不留痕迹"的实现方式），因此它在这里被再次声明。
  string digest = 2;
}

message CommitContentUploadResponse {}

message ListAssetsRequest {
  string project_id = 1;
  // 按标签筛选：精确匹配、多值取**交集**（同时带上这些标签的资产才列出）。
  //
  // 取值会按同一套归一化规则处理（trim、小写），因此客户端给 "Cover" 与
  // "cover" 是同一个筛选。空表示不筛。
  repeated string tags = 2;
}

message ListAssetsResponse {
  repeated Asset assets = 1;
  // **整个工程**已有的标签，升序。用于筛选界面的候选，**不随本次筛选收窄**。
  repeated string project_tags = 2;
}

message BeginAssetUploadRequest {
  string project_id = 1;
  // **声明**的内容类型。服务端只校验它在白名单内。
  string content_type = 2;
  // **声明**的字节数。服务端据此在签发前早退，避免让用户白传一遍；真正的
  // 大小上限由存储侧按内容类型执行。
  uint64 size_bytes = 3;
}

message BeginAssetUploadResponse {
  // 本次上传的资产标识。提交时要把它带回来。
  string asset_id = 1;
  // 直传凭证。**只允许写、只对这一个键有效、短时有效。**
  aladdin.objectstore.v1.DirectUploadCredential upload = 2;
}

message CommitAssetUploadRequest {
  string project_id = 1;
  string asset_id = 2;
  // **声明**的内容类型。**两次调用之间服务端不保留任何状态**（那正是"未提交
  // 的上传不留痕迹"的实现方式），因此它在这里被再次声明并重新校验。
  string content_type = 3;
  // **声明**的内容摘要（SHA-256 的十六进制）。
  //
  // 它是公开区地址的键，而服务端没有字节可以算它。**它在被使用之前会被核对**：
  // 提交时核对它是不是那份字节的摘要（让存储侧算，或读回自己算），不一致即
  // 删除对象并拒绝——因此一条假的摘要不会把公开区的地址指向别人的内容。
  string digest = 4;
  // 展示用的原始文件名。**不进对象键，不参与任何判断**：它可能含路径分隔符、
  // 控制字符以及别人的名字，把它拼进存储路径就是把一段不可信输入拼进路径。
  string filename = 5;
  // 初始的说明层元数据，都可空（见 Asset 的 title / tags / notes）。
  //
  // 与"提交之后再调 UpdateAsset"结果相同，区别只是少一次往返。
  string title = 6;
  repeated string tags = 7;
  string notes = 8;
}

message CommitAssetUploadResponse {
  Asset asset = 1;
}

message DeleteAssetRequest {
  string project_id = 1;
  string asset_id = 2;
}

message DeleteAssetResponse {}

// UpdateAssetRequest 表达的是说明层元数据的**期望完整状态**，不是增量。
message UpdateAssetRequest {
  string project_id = 1;
  string asset_id = 2;
  // 期望的展示标题。空串表示没有标题。
  string title = 3;
  // 期望的标签集合，**整体替换**（不在集合里的标签就是删掉）。空集表示清空。
  repeated string tags = 4;
  // 期望的备注。空串表示清空。
  string notes = 5;
}

message UpdateAssetResponse {
  // 改完之后的资产（含短时读取地址）。
  Asset asset = 1;
}

message ListAttachmentsRequest {
  string project_id = 1;
}

message ListAttachmentsResponse {
  repeated Attachment attachments = 1;
}

message BeginAttachmentUploadRequest {
  string project_id = 1;
  // 要**标注**的版本，可空（默认不标注）。非空时服务端会校验它确实属于这个工程：
  // 标注指向一个不存在的版本时拒绝，而不是记下一条悬空标注。
  string version_id = 2;
  // **声明的**字节数。服务端据此在签发前早退（单文件上限与工程总量配额各一次），
  // 避免让用户白传一遍；真正的判定在提交那一步，用的是核对出来的真实字节数。
  uint64 size_bytes = 3;
}

message BeginAttachmentUploadResponse {
  // 本次上传的附件标识。提交时要把它带回来。
  string attachment_id = 1;
  // 直传凭证。**只允许写、只对这一个键有效、短时有效。**
  //
  // 上传时声明的内容类型固定为**中性那一档**：附件的下发类型与它无关
  // （见 Attachment），因此那一次声明不产生任何对外可见的后果。
  aladdin.objectstore.v1.DirectUploadCredential upload = 2;
}

message CommitAttachmentUploadRequest {
  string project_id = 1;
  string attachment_id = 2;
  // 与服务端核对的那个声明。**两次调用之间服务端不保留任何状态**（那正是"未提交
  // 的上传不留痕迹"的实现方式），因此标注的版本在这里被再次声明并重新校验。
  string version_id = 3;
  // **声明的**内容摘要（SHA-256 的十六进制）。它在提交时被核对（让存储侧算，
  // 给不出时读回自己算），不一致即删除对象并拒绝。
  string digest = 4;
  // 展示用的原始文件名。**不进对象键，不参与任何判断**；它只进下载响应头，而那里
  // 会先滤掉会破坏响应头的字符。
  string filename = 5;
  // 初始说明，可空。与"提交之后再调 UpdateAttachment"结果相同。
  string description = 6;
}

message CommitAttachmentUploadResponse {
  Attachment attachment = 1;
}

// UpdateAttachmentRequest 表达的是说明的**期望完整状态**，不是增量。
message UpdateAttachmentRequest {
  string project_id = 1;
  string attachment_id = 2;
  // 期望的说明。空串表示清空。
  string description = 3;
}

message UpdateAttachmentResponse {
  // 改完之后的附件（含短时下载地址）。
  Attachment attachment = 1;
}

message DeleteAttachmentRequest {
  string project_id = 1;
  string attachment_id = 2;
}

message DeleteAttachmentResponse {}

message GetAttachmentDownloadURLRequest {
  string project_id = 1;
  string attachment_id = 2;
}

message GetAttachmentDownloadURLResponse {
  // 短时下载地址。**调用方不拼**：响应头是签发策略定下来的，自己拼一条就少了那
  // 一层保证（见 GetAttachmentDownloadURL 的说明）。
  string url = 1;
}

message PublishRequest {
  string project_id = 1;
  // 要发布的版本。**必填**：没有"发布当前草稿"这种形状。
  string version_id = 2;
  // 发布哪个内容槽的版本。版本按槽隔离，因此要给。
  ContentSlot slot = 3;
}

message PublishResponse {
  Publication publication = 1;
  // 生效之后的工程状态，含新的发布地址。前端据此刷新而不必再查一次。
  Project project = 2;
}

message UnpublishRequest {
  string project_id = 1;
  // 撤回哪个内容槽的发布。**另一个槽不受影响**。
  ContentSlot slot = 2;
}

message UnpublishResponse {
  Project project = 1;
}

message GetPublicationRequest {
  string project_id = 1;
  // 要读哪个内容槽**当前发布**的那一份。
  ContentSlot slot = 2;
}

message GetPublicationResponse {
  // 这个槽当前发布的记录。**未发布时为空**——那是这个槽的一种正常状态，不是错误。
  Publication publication = 1;
  // 这一份产物的清单：路径是**产物路径**（`docs` 槽的 markdown 是 `.html`，与
  // 发布域上那条地址同形），`url` 是访客走的读取地址。未发布时为空。
  repeated FileEntry entries = 2;
}

message ResolveSharedPageRequest {
  // 主站上的分享路径，以 `/g/` 开头，形如 `/g/<工程标识>`、`/g/<工程标识>/docs`
  // 或 `/g/<工程标识>/docs/guide`。
  //
  // 给整条路径而不是（工程，槽，路径）三元组：**槽的判定只有服务端一处**，客户端
  // 再解析一份就是第二个形状来源。
  string path = 1;
}

message ResolveSharedPageResponse {
  // 这条路径在**发布域**上的内容地址，形如
  // `<发布域>/g/<工程标识>[/docs][/路径]`。壳把它放进 iframe 的 src。
  //
  // **空表示"没有这一页"**，且六种情形同此一答（未发布 / 已撤回 / 该槽未启用 /
  // 工程不存在 / 标识没被猜中 / 路径不在集合里）。它不是错误：调用方据此渲染
  // 与发布态相同的"不存在"。
  string content_url = 1;
}

syntax = "proto3";

package aladdin.skill.v1;

import "aladdin/objectstore/v1/upload.proto";
import "aladdin/rbac/v1/annotations.proto";

option go_package = "github.com/poetlife/aladdin/api/gen/aladdin/skill/v1;skillv1";

// SkillService 是**技能目录的读面**：找到技能、看清它是什么、把正文取走。
//
// 边界：它不回答"你是谁"（认证）也不回答"你能做什么"（RBAC）。**目录是部署级
// 的**——技能不属于任何主体，因此这里没有第二把闸门（与 galaxy 正相反：那边
// 每一个方法都以"调用者自己的工程"为目标，归属要单独判一次）。谁能看见目录、
// 谁不能，全部由 `skill.catalog.read` 表达。
//
// **平台从不写调用方的文件系统。** 这条在接口上的表现是：没有任何一条方法要求
// 一个落点，取正文的那一条只把字节放在响应里（见
// docs/design/skill/agent-access.md）。装了本地副本之后真相源就有两份，而分叉的
// 表现不是报错，是"同一条指令在两台机器上得到不同的结果"。
service SkillService {
  // 读取当前部署下技能目录的边界：能不能用、纳得进多大的包、图集能到多少张。
  //
  // 它是**能力下发点**，与档案的 avatar_upload_enabled、galaxy 的 GetCapabilities
  // 同一取向：能力由服务端说，客户端不猜。前端据此不渲染未启用的入口，而不是渲染
  // 一个点了报错的控件；管理端据此说明"什么样的仓库纳得进来、一张图能多大"，而不是
  // 等一次写入失败才把上限讲给管理员听（见 SkillCapabilities 上的展示图那三项）。
  //
  // 它退回的每一项都是部署形态的公开事实，不因调用者而异，因此只要认证——
  // 与 galaxy 的同名方法一致。
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse) {
    option (aladdin.rbac.v1.authenticated_only) = true;
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 列出 / 搜索目录。
  //
  // 关键词是大小写不敏感的子串匹配，匹配**有效标题**与**有效简介**；标签多值
  // **取交集**；可以只看自己收藏的。结果按有效标题的字典序排，**排序是确定的**
  // ——没有"按相关度"或"按热度"这类排序，它们会让"我上次看到的第三条"变成一个
  // 无法复现的位置。
  //
  // 返回里带 `available_tags`（整个目录已有的标签，不随当前筛选收窄），因为
  // 它是这个界面的候选项来源，而"这个部署里有哪些标签"没有第二个地方回答。
  //
  // **不分页**：目录由管理员维护，规模有天然上界。条数有上限，超出时置
  // `truncated`，由调用方用关键词缩小范围。
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 读取一个技能：说明层、来源、当前版本的文件清单，以及**回退之后的展现取值**。
  //
  // **不含正文**：正文由 GetSkillFile 给出。两者分开的理由是正文是**取用**（它
  // 计一次使用），而"看清这是什么"不是——把它们合成一条会让"翻一翻目录"也变成
  // 一次使用。
  //
  // 回退在**服务端**算完才下发（`title` 与 `summary` 已经是最终展现值，同时给出
  // 说明层原值 `*_override` 与回退目标 `name` / `description`）：三端各算一遍的
  // 表现是"命令行与界面显示的标题不一样"。
  rpc GetSkill(GetSkillRequest) returns (GetSkillResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 取一条文件的字节。**这是"取用"本身**，也是一次使用的计量点。
  //
  // **刻意不标 NO_SIDE_EFFECTS。** 它是幂等的（同样的路径永远得到同样的字节），
  // 但它对平台有一个副作用——计一次使用——而那个注解的语义是"无副作用 ⇒ 可以
  // 安全地用 GET 重放"。把一个会写计数的方法标成它，等于让一次预取或一次爬虫
  // 重放也进统计。
  //
  // 路径不在这个技能的当前版本里时，结论与"技能不存在"**不同**：技能在，是那条
  // 路径不在。两者混为一谈会让调用方在拼错路径时以为整个技能没了。
  rpc GetSkillFile(GetSkillFileRequest) returns (GetSkillFileResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 列出这个技能的版本与当前指针。
  //
  // 版本**不删**，因此这个列表只增不减；`current` 标出目录对外服务的那一份。
  // 谁都读得到：知道"这个技能最近更新过几次"是选用它的一部分。
  rpc ListSkillVersions(ListSkillVersionsRequest) returns (ListSkillVersionsResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // 收藏或取消收藏。请求给出的是**期望的完整状态**，因此两个方向都不需要先查
  // 现在是什么，也不会出现"收藏两次变成取消"这类要调用方小心的形状。
  //
  // **它不放大任何能力**：收藏是读的人与技能之间的一个记号，不改变目录内容、
  // 不影响别人，因此不需要 `skill.catalog.write`——一个只有读权限的人能做的事，
  // 收藏没有超出它。
  rpc SetSkillFavorite(SetSkillFavoriteRequest) returns (SetSkillFavoriteResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.read";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }
}

// SkillAdminService 是**技能目录的维护面**：从远端纳管、同步、回滚、改说明层、
// 删除。
//
// 它与 SkillService 是一件事的两侧，因此拆成两个服务而不是塞进一个：两侧的准入
// 条件不同（读是 `skill.catalog.read`，写是 `skill.catalog.write`），写在同一份
// 接口里会让"这个服务要不要认证"变成一个需要逐方法去看的问题——那正是注解漏写
// 的温床。这与 TelemetryService / TelemetryAdminService 的拆分同源。
//
// **接口面上没有"改来源"这个方法。** 换仓库、换引用、换子路径都要重新纳管，得到
// 一个新的技能：一个技能的历次版本被要求是**同一条来源的不同时间点**，否则
// "回滚"就变成"切到另一个东西的某个版本"（见 docs/design/skill/onboarding.md）。
service SkillAdminService {
  // 从远端纳管一个新技能。
  //
  // 地址只接受 `https://github.com/<owner>/<repo>` 的形状，**取字节的地址由
  // 服务端自己拼**：允许的取值窄到可以逐条列举，是本模块唯一一处由调用方输入
  // 决定出站请求目标的地方（见 docs/design/skill/onboarding.md 的"来源的形状"）。
  //
  // 拉取、校验、落地是一个整体：**校验失败时不留任何痕迹**——库里没有新行，
  // 桶上也没有为它写的新对象。错误信息点名那一处（哪一个路径、违反了哪一条）。
  //
  // 一次纳管的时长由远端决定（没有进度、没有检查点、不重试）。它是幂等的：
  // 同样的来源与提交得到同样的内容。
  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 追远端：解析来源的引用，与已记录的提交比对，有变化则取回、校验、产生新版本
  // 并切换指针（一个事务）。
  //
  // `changed` 为假表示远端没有新提交——此时**不产生版本、不留痕、不动指针**，
  // 否则"这个技能上次真的更新是什么时候"会变成一个看不出答案的问题。
  //
  // 失败时当前指针**不动**：校验没过、远端挂了都只是"这一次没同步成功"，对外
  // 的那一份原样。来源的引用是标签或提交时，同步永远得到"没有变化"——那不是
  // 缺陷，是这种来源的应有之义。
  rpc ResyncSkill(ResyncSkillRequest) returns (ResyncSkillResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 把当前指针切到该技能已有的某个版本。
  //
  // **它只切指针，不改任何字节**：版本不可变，回滚之后读到的就是目标版本那一份。
  //
  // **回滚之后再同步不会把指针挪回去**：同步只在远端有新提交时动指针，而回滚
  // 不改变"已同步到哪个提交"。这是刻意的——一次习惯性的同步不该悄悄撤销一次刚
  // 做的回滚。要回到最新就再切一次指针。
  rpc SetCurrentSkillVersion(SetCurrentSkillVersionRequest) returns (SetCurrentSkillVersionResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 改说明层：标题、简介、标签。
  //
  // **它不改内容层任何一项**：当前版本、文件清单与所有字节在改动前后逐字不变。
  // 请求表达**期望的完整状态**（与 galaxy 的 UpdateAsset 同取向）：空串清空标题
  // 或简介（清空即回到当前版本 SKILL.md 的回退值），标签以请求集合**整体替换**，
  // 空集合表示去掉全部标签。
  rpc UpdateSkillMetadata(UpdateSkillMetadataRequest) returns (UpdateSkillMetadataResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 删除一个技能：技能行、版本行、标签、图集、收藏与使用记录一起消失。
  //
  // **桶上的内容字节不删**，而**展示图的对象一起删**。两者的区别是键的归属：内容
  // 对象按摘要全局共享，同一份字节可能正被别处引用，"哪些对象还在被引用"要一次全量
  // 对账才答得上来（因此与 galaxy 的孤儿对象回收合并处理）；展示图一张一个键、由这
  // 一个技能独占，删它不会动到别处。不可逆。
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 开始一次展示图上传播：签发一份直传凭证。
  //
  // **字节不经过服务端**（见 docs/design/objectstore/README.md）：服务端在这里
  // 校验**声明的**类型在白名单内、按声明的大小早退，然后把"只许写这个技能的某一张
  // 展示图这一个键、类型与大小受条件约束"的策略交给对象存储执行。
  //
  // 不给图标识时是**新增一张**：服务端分配标识、把它排到图集末尾。给了已有的图
  // 标识时是**换掉那一张的字节**：对象键与它在图集里的位置都不变——展示图按图标识
  // 定位，一张一个键，顺序不是键的一部分（见 docs/design/skill/catalog.md 的
  // "展示图集"）。
  rpc BeginSkillImageUpload(BeginSkillImageUploadRequest) returns (BeginSkillImageUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 提交一次展示图上传：核对字节确实到了，把它记进图集（换图时只是让它生效）。
  //
  // 签发之后客户端传了什么、传没传完，服务端都不知道，因此提交要对那个键做一次
  // Head：不存在即失败，字节数超过单张上限即失败并删除对象，**并按真实字节数复核
  // 图集的合计上限**——声明可以撒谎，而这一步服务端看得见真实的字节数。
  rpc CommitSkillImageUpload(CommitSkillImageUploadRequest) returns (CommitSkillImageUploadResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 从图集里移除一张。没有这一张时也失败（**不是幂等**：调用方给出的标识必须
  // 指向当前图集里的一张，"删一张已经不在的图"是一次拼错了标识，不是一个状态）。
  //
  // 它删的是**对象**：这个键由这一张独占，不像内容对象那样可能被别处引用。剩下的
  // 顺序保持不变——删中间一张不会让后面任何一张的地址变（见
  // docs/design/skill/catalog.md 的"展示图集"）。
  rpc DeleteSkillImage(DeleteSkillImageRequest) returns (DeleteSkillImageResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }

  // 重排图集：请求给出的是**期望的完整顺序**，与改说明层同取向。
  //
  // **第一项即首图**——"设为首图"就是把某一张排到第一位，没有第二个开关（卡片
  // 显示哪一张由它唯一决定）。给出的标识不是这个技能当前图集的一个排列（少了、
  // 多了、重复了、有别人的）时整个拒绝，顺序不变——不做"部分重排"。
  rpc ReorderSkillImages(ReorderSkillImagesRequest) returns (ReorderSkillImagesResponse) {
    option (aladdin.rbac.v1.required_permission) = "skill.catalog.write";
    option (aladdin.rbac.v1.scope_source) = SCOPE_SOURCE_CREDENTIAL;
  }
}

// Skill 是目录里的一条技能。
//
// **列表只填前八项。** 说明层原值、当前版本信息、来源、文件清单与**整个图集**只在
// 详情里给出（GetSkill）——列表会读很多行，把它们挂上来是一笔与列表无关的代价。
// 列表仍然给首图那一个地址（`cover_url`），因为卡片要用它。
message Skill {
  // 技能标识。由服务端分配、不可猜、不可改、不复用。
  string id = 1;

  // **有效标题**：说明层留空时回退到当前版本 SKILL.md 的 name。已经算好，
  // 客户端不拼。
  string title = 2;
  // **有效简介**：说明层留空时回退到当前版本 SKILL.md 的 description。
  string summary = 3;

  // 标签。**值已归一化**（trim、小写、去重并升序、长度与数量受限，见
  // docs/design/skill/catalog.md）：拿到的是唯一的那一份形式，调用方不必也不得
  // 自己再归一化或再排序一次。
  repeated string tags = 4;

  // 调用者是否收藏了它。**是调用者自己的状态**，不因别人收藏而变。
  bool favorited = 5;

  // 当前版本的文件数与字节总数。
  uint32 file_count = 6;
  uint64 total_bytes = 7;

  // 使用量。**只有计数，没有"谁"**：使用明细不是审计数据（见
  // docs/design/skill/catalog.md）。
  SkillUsage usage = 8;

  // 说明层的原值。空表示没有覆盖、走回退。
  //
  // 它与 title / summary 一起给出，是为了让编辑表单既显示"现在叫什么"，也显示
  // "清空之后会回到什么"——只给其中一个，编辑界面就只能猜另一个。
  string title_override = 9;
  string summary_override = 10;

  // 当前版本 SKILL.md 里声明的两项（回退的目标）。
  string name = 11;
  // **触发说明**：这个技能什么时候该被用上，取自 SKILL.md 的 description。
  // 它是 agent 决定要不要用它的唯一依据。
  string description = 12;

  // 当前版本。
  string current_version_id = 13;
  // 当前版本产生的时间（即它从远端纳管进来的那一刻）。
  string current_version_created_at = 14;

  // 来源。出现在详情里：**"这份内容是谁写的、从哪一版来的"是一个正当的问题**，
  // 而且它让读者能自己去看原仓库。它不参与检索。
  SkillSource source = 15;

  // 当前版本的文件清单（路径 → 字节数 + 内容摘要）。**不含正文**
  // （见 GetSkillFile）。
  repeated SkillFile files = 16;

  // 展示图集的**首图**（也就是卡片封面）的短时读取地址，列表与详情都给。空串
  // 表示这个技能没有展示图，界面据此渲染占位（标题首字 + 中性底），而不是去取
  // 一张不存在的图。
  //
  // 它是**预签名地址**：短时有效，过期后重新读一次就有新的。签名是本地计算、
  // 不发网络请求，因此列表里 N 条技能不产生 N 次往返；**列表也只签这一张**——
  // 卡片只用首图，为它把整个图集签一遍是白签。
  //
  // **展示图不是包的内容**：它属于说明层，不进文件清单、不进版本、不参与取用
  // （见 docs/design/skill/catalog.md 的"展示图集"）。
  string cover_url = 17;

  // 展示图集，**有序**：第一项即首图。**只在详情里给**（列表只给 cover_url）——
  // 列表会读很多行，为每条技能签一串地址是一笔与列表无关的代价，而卡片只用第一张。
  //
  // 每张图有它自己的标识与地址：设为首图、重排、删一张都按标识指认（见
  // SkillAdminService 的重排与删除）。每一张的地址同样是短时预签名地址。
  repeated SkillImage images = 18;
}

// SkillImage 是展示图集里的一张图。
message SkillImage {
  // 图标识。由服务端分配、不可猜、不可改、不复用。它是这一张在重排、设为首图与
  // 删除时的指认方式——**不是它的位置**：位置会随重排而变，标识不会。
  string id = 1;
  // 这一张的短时读取地址（与 cover_url 同一条模型）。
  string url = 2;
  // 字节数。界面上说明"还能再加几张"用得到它（上限见 skill.MaxImages）。
  uint64 size_bytes = 3;
}

// SkillSource 是一个技能的内容从哪来。
//
// 它在纳管之后**不可改**：换来源要重新纳管。
message SkillSource {
  // 仓库地址，形如 https://github.com/<owner>/<repo>。原样回显调用方纳管时给的
  // 那个形状（去掉结尾的 `/` 与 `.git`）。
  string repository_url = 1;
  // 引用：分支 / 标签 / 提交标识。为空表示用的是仓库的默认分支。
  string ref = 2;
  // 包在仓库里的子路径。为空表示仓库根。
  string sub_path = 3;
  // 当前版本对应的提交标识。它是"这个技能上次真的更新到哪"的唯一答案。
  string commit = 4;
}

// SkillFile 是当前版本里的一条文件。
message SkillFile {
  // 包内相对路径。
  string path = 1;
  uint64 size_bytes = 2;
  // 内容摘要。**同一份字节在目录里只有一个对象**，因此两个技能里内容相同的
  // 文件有同一个摘要。
  string digest = 3;
}

// SkillVersion 是一个技能的一份不可变快照。
message SkillVersion {
  string id = 1;
  // 这一份快照取自哪个提交。
  string commit = 2;
  uint32 file_count = 3;
  uint64 total_bytes = 4;
  string created_at = 5;
  // 是否当前对外服务的那一份。
  bool current = 6;
  // **上游有、而平台没收**的条目数。
  //
  // 平台只分发文本，因此真实仓库里那些示例图一类的东西不进包。这个计数让"平台
  // 里的包比上游少几个文件"成为一件看得见的事——静默地少才是问题（见
  // docs/design/skill/onboarding.md 的"收得下的文件"）。
  uint32 skipped_files = 7;
}

// SkillUsage 是一个技能的使用量（最近 30 天）。
//
// **按"人日"计，不按次数计**：一次取用通常连着取好几个文件，按次记的数字主要
// 由"这个包有几个文件"决定，与"有没有人在用"无关。按人日记还有一条它没有的
// 性质——**它有天然上界**：一个主体对一个技能一天最多贡献 1。
message SkillUsage {
  // 窗口内有多少个人日用过它（同一个人在同一天算一次）。
  //
  // **字段名里不带窗口长度**：窗口是一个常量（30 天），把它写进字段名会让"换一个
  // 窗口"变成一次破坏性改名，而它本来只是换一个取值。
  uint32 use_days = 1;
  // 窗口内去重之后的主体数。
  uint32 user_count = 2;
  // 最近一次使用的时间。从未被取用时为空。
  string last_used_at = 3;
}

// SkillCapabilities 是当前部署下技能目录的边界。
message SkillCapabilities {
  // 是否可用目录。为假表示这个部署没有配置对象存储——技能的字节没有地方放，
  // 检索与取用都不可用（与 galaxy 的资产同一条降级取向）。
  bool catalog_enabled = 1;
  // 是否可纳管。它比目录更严一层：还要有可用的远端拉取。
  bool import_enabled = 2;
  // 一个技能包的文件数上限。
  uint32 max_files = 3;
  // 单个文件的字节上限。
  uint32 max_file_bytes = 4;
  // 一个包的字节总数上限。
  uint32 max_package_bytes = 5;
  // 一个技能的**展示图张数**上限。
  uint32 max_images = 6;
  // **单张**展示图的字节上限（与头像同一档）。
  uint32 max_image_bytes = 7;
  // 一个技能的展示图**合计字节**上限。
  uint32 max_image_total_bytes = 8;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  SkillCapabilities capabilities = 1;
}

message ListSkillsRequest {
  // 关键词。大小写不敏感的子串匹配，匹配有效标题与有效简介。去首尾空白；
  // 空表示不筛。
  string query = 1;
  // 标签筛选。多值**取交集**：只列出同时带这些标签的技能。取值会被归一化。
  repeated string tags = 2;
  // 只看当前主体收藏过的。
  bool favorited_only = 3;
}

message ListSkillsResponse {
  repeated Skill skills = 1;
  // 整个目录已有的标签（不随当前筛选收窄），供界面给出候选项。
  repeated string available_tags = 2;
  // 是否因为条数上限而截断。为真时调用方应当用关键词缩小范围。
  bool truncated = 3;
}

message GetSkillRequest {
  string skill_id = 1;
}

message GetSkillResponse {
  Skill skill = 1;
}

message GetSkillFileRequest {
  string skill_id = 1;
  // 包内相对路径。缺失即拒绝（没有"默认取 SKILL.md"这一档：默认值会让一次
  // 拼错的路径静默地取到另一份东西）。
  string path = 2;
}

message GetSkillFileResponse {
  // 文件的文本字节。**平台不写调用方的文件系统**：这是唯一一处把正文交出去的
  // 地方，落不落盘由调用方决定。
  bytes content = 1;
  // 回显这次取的是哪一条，以及它的摘要（供调用方核对）。
  string path = 2;
  string digest = 3;
}

message ListSkillVersionsRequest {
  string skill_id = 1;
}

message ListSkillVersionsResponse {
  repeated SkillVersion versions = 1;
}

message SetSkillFavoriteRequest {
  string skill_id = 1;
  // 期望的状态：真表示收藏，假表示取消。两个方向都是幂等的。
  bool favorited = 2;
}

message SetSkillFavoriteResponse {}

message ImportSkillRequest {
  // 仓库地址，只接受 https://github.com/<owner>/<repo> 的形状。
  string repository_url = 1;
  // 引用：分支 / 标签 / 提交标识。为空表示仓库的默认分支。
  string ref = 2;
  // 包在仓库里的子路径。为空表示仓库根。
  string sub_path = 3;
  // 可选的说明层初值。留空表示走回退（用 SKILL.md 里的 name / description）。
  string title = 4;
  string summary = 5;
  // 可选的初始标签。
  repeated string tags = 6;
  // 可选的展示图来源：**包内的若干条图片路径**（如 `examples/cover.png`），
  // **顺序即图集顺序、第一张即首图**。
  //
  // 服务端把这几条逐张取回来、校验后存成展示图。**它们不进文件清单**——展示图是
  // 说明层的一项，不是包的内容（见 docs/design/skill/catalog.md 的"展示图集"）。
  // 因此这些路径多半正是"被跳过的那类二进制"，那不影响它们被取回来当展示图。
  //
  // 取不到、类型与字节不符、张数或合计字节超限时**整次纳管失败**，与别的校验
  // 同一条：不留下"技能进来了、只是没有图"这种要人去猜的状态。
  repeated string image_paths = 8;

  // 字段 7 曾经是单张的 `cover_path`。它已被 image_paths 取代（多张、且顺序
  // 显式），旧客户端不该再拿到"只认得一张"的错觉。
  reserved 7;
  reserved "cover_path";
}

message ImportSkillResponse {
  Skill skill = 1;
}

message ResyncSkillRequest {
  string skill_id = 1;
}

message ResyncSkillResponse {
  Skill skill = 1;
  // 远端是否有新提交。为假时版本没有变、指针没有动。
  bool changed = 2;
}

message SetCurrentSkillVersionRequest {
  string skill_id = 1;
  // 目标版本。必须属于这个技能。
  string version_id = 2;
}

message SetCurrentSkillVersionResponse {
  Skill skill = 1;
}

message UpdateSkillMetadataRequest {
  string skill_id = 1;
  // 空串表示清空（回到回退值）。
  string title = 2;
  string summary = 3;
  // 标签以请求集合**整体替换**，空表示去掉全部标签。
  repeated string tags = 4;
}

message UpdateSkillMetadataResponse {
  Skill skill = 1;
}

message DeleteSkillRequest {
  string skill_id = 1;
}

message DeleteSkillResponse {}

message BeginSkillImageUploadRequest {
  string skill_id = 1;
  // 目标图标识。**留空表示新增一张**（服务端分配标识、排到图集末尾）；给出现有的
  // 一张表示**换掉它的字节**（图标识、对象键与它在图集里的位置都不变）。
  string image_id = 2;
  // 上传方声明的类型。服务端只校验它在白名单内——白名单里没有任何可执行类型，
  // 而这正是这套链路能成立的原因。
  string content_type = 3;
  // 上传方声明的字节数。服务端按它早退（省一次白传），真正的边界由存储侧执行。
  uint64 size_bytes = 4;
}

message BeginSkillImageUploadResponse {
  // 这次上传对应的图标识。新增时由服务端分配，提交要用同一个值。
  string image_id = 1;
  // 直传凭证。**只允许写、只对这个技能的这一张展示图的键有效、短时有效**，且
  // 允许覆盖（换图就是覆盖那一张的字节）。
  aladdin.objectstore.v1.DirectUploadCredential upload = 2;
}

message CommitSkillImageUploadRequest {
  string skill_id = 1;
  // 签发时给出的那个图标识（新增时是响应里分配给它的那一个）。
  string image_id = 2;
}

message CommitSkillImageUploadResponse {
  // 提交之后的那一份技能，省掉一次读取：调用方多半正要刷新画廊里的缩略图。
  Skill skill = 1;
}

message DeleteSkillImageRequest {
  string skill_id = 1;
  string image_id = 2;
}

message DeleteSkillImageResponse {
  Skill skill = 1;
}

message ReorderSkillImagesRequest {
  string skill_id = 1;
  // 期望的完整顺序。必须是这个技能当前图集的一个排列（不多、不少、不重、不带
  // 别人的标识），否则整个拒绝。**第一项即首图。**
  repeated string image_ids = 2;
}

message ReorderSkillImagesResponse {
  Skill skill = 1;
}

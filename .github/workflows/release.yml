# 发布流水线：推送 vX.Y.Z tag 时触发。
#
# 顺序是刻意的：validate → gate → build → publish → publish-npm → prune。
# 门禁在构建之前，失败则不产出任何东西——宁可没有 Release，也不要半个。
# 完整说明见 docs/release.md。
#
# SDK 那个包也是在这里发的（`publish-npm`）：它排在 Release 之后，走 npm 的
# Trusted Publishing，因此仓库里没有 npm 的长期 token、也不需要谁去输一次性口令。
# 本地的 `make sdk-publish` 是**应急**（热修、或这次流水线没发成），不是主路。

name: release

on:
  push:
    tags: ['v*']

# 默认最小权限，需要写权限的 job 各自单独提升。
permissions:
  contents: read

concurrency:
  # 发布不能半途取消；两次发版串行，清理逻辑才不会读到过期的列表。
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: 校验 tag
    # 镜像钉版本的理由见 gate.yml。
    runs-on: ubuntu-24.04
    steps:
      - name: tag 必须形如 vX.Y.Z
        # `tags: ['v*']` 只是粗筛，这里才是真正的约束。
        # 不合法就立刻失败，不创建任何东西。
        #
        # 这个形状必须与**客户端解析**能接受的一模一样（internal/upgrade/version.go
        # 的 ParseVersion）：放开一点，就会发布一个客户端解析不了的 tag，而它的
        # 表现是全体用户的自更新在那之后一直失败。前导零（v01.2.3）因此不合法——
        # 同一个版本有两种写法，客户端的严格比较不接受。
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]; then
            echo "tag 必须形如 vX.Y.Z（不接受前导零），收到：${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "tag 合法：${GITHUB_REF_NAME}"

  gate:
    name: 门禁
    needs: validate
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read

  build:
    name: 构建发布产物
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 发布产物里 CLI 的默认目标地址。它是**部署实例的值**，因此不进仓库：
      # 值放在仓库设置（Settings → Variables）里，构建时注入二进制。
      # 见 docs/release.md 的"产物"。
      ALADDIN_CLI_DEFAULT_ADDRESS: ${{ vars.ALADDIN_CLI_DEFAULT_ADDRESS }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: make web-ci

      # 缺值就**不发**：默认连本机的 CLI 发出去，用户那边表现为"装完登录连不上"，
      # 而这里一切绿灯。宁可这次发版失败。
      - name: 校验 CLI 默认地址已配置
        run: |
          if [ -z "${ALADDIN_CLI_DEFAULT_ADDRESS}" ]; then
            echo "::error::仓库变量 ALADDIN_CLI_DEFAULT_ADDRESS 未配置。缺了它，发布产物里的 CLI 会默认连本机，装的人连不上官方服务。"
            exit 1
          fi

      # 交叉编译、归档与校验和都在 Makefile 里，这里不重写一遍 go build：
      # 构建命令若有第二个入口，就会与 make build 漂移。
      #
      # VERSION 由 tag 传入，与 make build 共用同一处 LDFLAGS；地址另有一处注入，
      # 只作用于 CLI 那个二进制（见 docs/release.md 的"产物"）。
      #
      # 前端也取自这个 VERSION：release-build 依赖 web-build，而 Makefile 的
      # WEB_BUILD_ENV 把同一个 VERSION / COMMIT / BUILD_TIME 传给 Vite。**这里不传
      # 构建参数**是有意的——再传一遍就等于有了第二个取值处，而两处不一致的表现是
      # 部署信息页报"前后端不是同一次构建"，却查不出为什么（见
      # docs/design/deployment/README.md）。
      - name: 构建
        run: make release-build VERSION="${GITHUB_REF_NAME}" RELEASE_CLI_ADDRESS="${ALADDIN_CLI_DEFAULT_ADDRESS}"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 必须检出仓库：--generate-notes 靠 git 历史与前一个 tag 算变更日志，
      # 没有 .git 时 gh 会直接报 "not a git repository"。
      # fetch-tags 显式打开，否则找不到上一个 tag，变更日志会退化成"从第一个提交开始"。
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: 校验产物完整性
        # 传到 Release 之前先核对一遍，避免上传半截文件。
        run: |
          cd dist
          ls -1
          sha256sum -c SHA256SUMS

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --verify-tag：tag 不存在就报错，而不是顺手新建一个指向
          # 当前默认分支的 tag。--generate-notes 依据上一个 tag 以来的提交生成变更日志。
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  publish-npm:
    name: 发布 npm 包
    # 排在 Release 之后：npm 的版本**发出去就撤不回来**，因此让它发生在"这次发布
    # 确实成立"之后——宁可出现"有 Release、npm 上还没有"，也不要反过来的那种。
    # 真的落在中间时重跑这个 job 即可补齐（它是幂等的，见下）。
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # npm 的 Trusted Publishing 走 OIDC：仓库里因此**没有 npm 的长期 token**，
      # 也没有一个能长期拿来发版的 secret 可以被读出来；provenance 由它自动生成。
      # npm 侧要配一次（包 → Settings → Trusted Publisher），见 docs/release.md。
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/package-lock.json
          # 这一行同时写出 .npmrc：registry 指向公共源。Trusted Publishing 认的
          # 是这个 registry；少了它 npm 会按 runner 上的默认配置去问。
          registry-url: https://registry.npmjs.org

      - name: 安装 SDK 依赖
        run: make sdk-ci

      - name: 确认 npm 够新
        # Trusted Publishing 要 npm ≥ 11.5.1。基础镜像轮换时，这是"某天起发布
        # 突然失败"的典型来源，因此显式断言并把话说清楚（与门禁里断言
        # golangci-lint 存在是同一条理由：静默降级等于没有这道门）。
        run: |
          set -euo pipefail
          current=$(npm --version)
          echo "npm ${current}"
          node -e '
            const need = [11, 5, 1]
            const got = process.argv[1].split(".").map(Number)
            for (let i = 0; i < need.length; i++) {
              if (got[i] > need[i]) process.exit(0)
              if (got[i] < need[i]) {
                console.error(`Trusted Publishing 需要 npm ≥ ${need.join(".")}，当前 ${process.argv[1]}`)
                process.exit(1)
              }
            }
          ' "${current}"

      - name: SDK 类型检查与测试
        run: make test-sdk

      # 版本只有一个来源：这个 tag。仓库 sdk/package.json 里那个值是占位
      # （0.0.0-development），在这里覆写它——**不维护第二处版本号**，
      # 也不允许"包里的版本"与"发布它的 tag"各说各的（见 docs/release.md）。
      - name: 版本取自 tag
        working-directory: sdk
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          node -p "'将发布：' + require('./package.json').name + '@' + require('./package.json').version"

      - name: 打包检查
        run: make sdk-check-package

      # 幂等：npm 上的版本不可回收，也没有"清理旧版本"的形态，因此**重跑一次发布
      # 流水线不该报红**。已经有这个版本就跳过（Release 那一侧由 prune 收敛数量，
      # npm 这一侧只能靠版本不重复发布）。
      #
      # `--access public` 与 provenance 都不在这里写：前者是 publishConfig 的事
      # （scoped 包默认私有），后者由 Trusted Publishing 自动生成。
      - name: 发布到 npm
        working-directory: sdk
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          if [ "$version" = "0.0.0-development" ]; then
            echo "::error::版本仍是占位值，说明上一步的 tag 覆写没生效。" >&2
            exit 1
          fi

          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} 已在 npm 上，跳过。"
            exit 0
          fi

          npm publish
          echo "::notice::registry 上若先出现 0.0.0-stage，那是 npm 处理新版本的暂存状态（真版本过一会儿才放行），不是失败。"

  prune:
    name: 清理旧版本产物
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 只保留最近若干版本的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 保留的版本数。更早的 Release 会被删掉，git tag 不受影响。
          KEEP: "5"
        # 本步骤是全流程唯一**删除**操作（另一处不可逆的是 npm 包的发布，那边靠
        # "同一个版本不发第二次"兜住），因此每一条防护都写在明面上：
        #   · 只处理 tag 形如 vX.Y.Z 的 Release，人工创建的、名字不匹配的一律不碰
        #   · 只删 Release，绝不删 git tag（不带 --cleanup-tag）
        #   · 数量未超过 KEEP 时什么也不做
        #   · isLatest 无论如何不删
        #   · 读不到列表就中止，绝不把"什么也没看见"当成"全都该删"
        #
        # 每条 gh 命令都显式带 -R：本 job 不检仓库，仓库上下文全靠环境变量推，
        # 而"环境里应该有"正是上一版 publish 出错的原因，不再依赖它。
        run: |
          set -euo pipefail

          # 候选集 = 本流水线会创建的 Release：非草稿、非预发布、tag 形如 vX.Y.Z。
          # 这里的 tag 形状判断同时保护了"非本流水线创建的 Release"。
          # 形状与 validate 步骤、与客户端解析三处一致（见 validate 步骤的说明）。
          if ! releases=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 \
                --exclude-drafts --exclude-pre-releases \
                --json tagName,createdAt,isLatest); then
            echo "读取 Release 列表失败，本次放弃清理。" >&2
            echo "发布本身已成功，产物不受影响；下次发版会重新尝试清理。" >&2
            exit 1
          fi

          candidates=$(jq '[.[] | select(.tagName | test("^v(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){2}$"))]' <<<"$releases")
          total=$(jq 'length' <<<"$candidates")

          echo "候选 Release 共 ${total} 个，保留最近 ${KEEP} 个。"
          if [ "$total" -le "$KEEP" ]; then
            echo "未超过保留数量，无需清理。"
            exit 0
          fi

          # createdAt 倒序后跳过前 KEEP 个，剩下的即溢出的部分；删除量有上界。
          to_delete=$(jq -r --argjson keep "$KEEP" \
            'sort_by(.createdAt) | reverse | .[$keep:]
             | .[] | select(.isLatest == false) | .tagName' <<<"$candidates")

          if [ -z "$to_delete" ]; then
            echo "没有需要清理的 Release。"
            exit 0
          fi

          echo "将清理以下 Release（只删 Release，不删 git tag）："
          echo "$to_delete" | sed 's/^/  - /'

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            # 幂等：并发下已被删掉的条目不应让整个 job 失败。
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes >/dev/null \
              || echo "  ${tag}：删除失败或已不存在，跳过" >&2
          done <<<"$to_delete"

          echo "清理完成，当前 Release 数：$(gh release list -R "$GITHUB_REPOSITORY" \
            --limit 1000 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq 'length')"

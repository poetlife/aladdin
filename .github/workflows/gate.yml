# 门禁（Gate）—— 「什么算通过」的唯一定义处。
#
# 常规 CI（PR / push main）与发布（tag）都调用本文件，而不是各自复制一份步骤：
# 两份定义迟早漂移，例如有人只给其中一份加了前端测试。
# 要调整门禁范围，只需改这里（见 docs/release.md 与 docs/ssot-registry.md）。
#
# 四个 job 之间没有依赖，所以并行跑。串行的总时长是四段相加，并行是最慢的那一段
# （后端单元测试）——同一套检查，墙钟时间少一半。代价是每个 job 各自检出一次、
# 各自恢复一遍缓存：这份开销本身也是并行的，不占关键路径，但机器时间确实变多
# （见 docs/release.md 的"时间花在哪里"）。
#
# 基础镜像一律钉住版本。ubuntu-latest 会在 GitHub 轮换镜像时静默换掉整个运行环境，
# 那是"某天门禁突然红了而没人改过代码"的典型来源；换镜像应当是一次有意的改动。
# 这与 Makefile 里把工具钉到具体版本是同一条理由：版本升级是有意为之，
# 不是自动发生的。
#
# 并行顺带消掉了原先两条"别随手调换"的顺序依赖里的一条：
#   · `make tools` 先于 `make lint` 与 `make check-gen` / `make check-api-docs`
#     —— 收在"静态检查与生成同步"这一个 job 内，仍然成立；
#   · 所有 Go 步骤先于 `make web-ci` —— `go test ./...` 会走进 web/node_modules，
#     而 npm 包里自带 Go 文件（flatted 就带一个）。前端现在在另一个 job 里，
#     Go 那些 job 里根本不存在 node_modules，这条已经不可能被违反。
#
# 一处有意的行为变化：并行的 job 默认不互相取消，某个 job 失败时其余照常跑完。
# 这是要的——一次推送就能看到全部结论，而不是"修完 lint 才发现测试也红"。
# 取消仍然发生在**推送**这一层：ci.yml 的 concurrency 会取消同一分支上过期的那次。

name: gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go-checks:
    name: 门禁 · 静态检查与生成同步
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 需要完整历史：make check-gen 用 git diff 判断生成产物是否同步，
          # 浅克隆会让这个判断失真。
          fetch-depth: 0

      - name: 准备 Go 环境
        # 装 Go、恢复模块与构建缓存，以及已装好的工具。三个 Go job 共用这一个
        # 动作，缓存的取法因此只有一处（理由见该文件）。
        uses: ./.github/actions/setup-go
        with:
          tools: 'true'

      # 顺序依赖：tools 必须先于 lint（buf lint）与 check-gen / check-api-docs
      # （buf generate）。
      - name: 安装代码生成与静态检查工具
        run: make tools

      - name: 确认 golangci-lint 已就位
        # make lint 在工具缺失时会静默跳过 golangci-lint。门禁里静默跳过
        # 等于没有门禁，所以这里显式断言，让"跳过"变成失败。
        run: |
          if ! command -v golangci-lint >/dev/null; then
            echo "golangci-lint 未安装，make lint 会静默跳过它，门禁不成立" >&2
            exit 1
          fi
          golangci-lint --version

      - name: 静态检查
        run: make lint

      - name: 生成产物同步校验
        run: make check-gen

      - name: OpenAPI 文档同步校验
        run: make check-api-docs

  go-test:
    name: 门禁 · 后端单元测试
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 Go 环境
        uses: ./.github/actions/setup-go

      - name: 后端单元测试（含竞态检测）
        run: make test

  go-e2e:
    name: 门禁 · 端到端测试
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 准备 Go 环境
        uses: ./.github/actions/setup-go

      # 端到端测试自带服务端（随机端口）、自带临时库，所以与另外两个 Go job
      # 同时跑互不干扰。
      - name: 端到端测试
        run: make test-e2e

  web:
    name: 门禁 · 前端
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 这三步不看历史，取满历史只为让"检出"在所有 job 里是同一种形状——
          # 多花不到一秒，好过每个 job 各有一个必须单独判断的理由。
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        run: make web-ci

      - name: 前端单元测试
        run: make test-web

      - name: 构建前端
        run: make web-build

version: v2
# 一份 proto，四份产物。两侧代码由同一次生成产出，不可能漂移。
#
# 传输方式为 Connect RPC（参考 usememos/memos）：connect-go 的 handler
# 在同一个端口上同时支持 Connect / gRPC / gRPC-Web 三种协议，因此
#   - 浏览器走 Connect（web/src/api/transport.ts）
#   - CLI 走原生 gRPC（pkg/client，grpc-go 客户端）
# 两者打的是同一个地址，不存在两套服务端。
#
# 有意不生成 grpc-gateway：那会为同一个方法再开一条 REST 路径，
# 带来"文档说 REST、实现走 Connect"这类漂移。
#
# OpenAPI 文档不在这里，而在 buf.gen.openapi.yaml（make api-docs）。分开是因为
# 它描述的就是 Connect 路径本身，不开第二条调用路径，因此不违反上面这条理由；
# 分开也让日常 make gen 不必带上文档生成的成本。
plugins:
  # Go 侧三个插件都用本地二进制（make tools 安装），离线可用。
  - local: protoc-gen-go
    out: api/gen
    opt: paths=source_relative

  # 仅用于 CLI 的 grpc-go 客户端。服务端不再实现这套接口。
  - local: protoc-gen-go-grpc
    out: api/gen
    opt: paths=source_relative

  # 服务端 handler 与客户端。
  - local: protoc-gen-connect-go
    out: api/gen
    opt: paths=source_relative

  # 前端类型与 service descriptor。
  # protoc-gen-es v2 已内置生成 service descriptor，无需 protoc-gen-connect-es。
  # 这个插件没有 Go 实现，只能走 BSR 远程插件。
  - remote: buf.build/bufbuild/es:v2.15.0
    out: web/src/gen/proto
    opt:
      - target=ts

  # 对外发布的 TS 包（sdk/）的 proto 生成产物。
  #
  # 它与 web 那一份**不能共用**：sdk 是一个独立发布出去的包，不能 import 主应用
  # 内部的路径。同一份 proto 因此派生出两份 TS——**形状只有 proto 一处来源**，
  # 这两份都是它的派生物，不是两份定义（与 api/gen 之于 proto 同一条理由）。
  #
  # import_extension=js 是 node 侧 ESM 的要求：没有它，产物里的相对 import 不带
  # 扩展名，`tsc` 按 NodeNext 编译会直接报错。web 那份不需要它，因为 web 由 vite
  # 打包，走的是 bundler 解析。
  - remote: buf.build/bufbuild/es:v2.15.0
    out: sdk/src/gen/proto
    opt:
      - target=ts
      - import_extension=js

# aladdin 服务端配置示例
#
# 用法：复制到服务端**启动目录**下、改名为 config.yml 即可生效。
# 放在别处也行，用 `aladdin-server -config /path/to/config.yml`
# 或环境变量 ALADDIN_CONFIG 指定。
#
# 个人本机改动写进同目录的 config.local.yml（已在 .gitignore 中，不提交），
# 它覆盖本文件；本文件可以提交、可以共享、可以进镜像。
#
# 完整规则见 docs/design/config/README.md。
#
# 注意：这里只放"进程如何运行"，不放"谁能做什么"。主体、角色、权限码、
# 作用域一律不得由配置提供。

# 监听地址，格式为 host:port。
#
# 默认值只对本机可达。要对外提供服务须显式写成 0.0.0.0:9090——
# 空主机名（如 ":9090"）会被拒绝，因为它读起来像"随便哪个网卡"，
# 而默认配置不该悄悄对外暴露。
address: 127.0.0.1:9090

# 日志级别，取值：debug / info / warn / error。
log_level: info

# 日志文件路径。写空值或不写这一行，表示写到标准错误。
#
# 日志文件写不进去不会让服务端退出：否则"日志写不进去"会升级成
# "服务不可用"，而后者严重得多。
log_file: ""

# 数据库后端，取值：sqlite / mysql。
#
# 默认 sqlite：不依赖任何独立服务，工作目录下建一个文件即可开始。
# 多副本部署或需要独立数据库服务时改成 mysql，并相应填写 database_dsn——
# 业务代码与迁移都不用动。
database_driver: sqlite

# 数据库连接串，形状随后端而异：
#   - sqlite：填文件路径（相对路径以启动时的工作目录为基准）。
#     也可以填完整连接串（以 file: 开头或含 ?）以自行控制底层参数；
#     填路径时服务端会补上等待锁的超时、预写日志与外键检查这三个默认参数。
#     路径的父目录必须已存在——不自动建目录，免得拼错路径后在一个奇怪的地方
#     建出个空库，看起来像数据全丢了。
#   - mysql：填完整的连接串。
#
# 注意：连接串里可能有口令，因此它**不会**出现在日志里；启动日志只记脱敏后的
# 定位信息。排查"数据写到哪去了"时看那一行，不要看这里。
database_dsn: aladdin.db

# 头像存放的腾讯云 COS 桶。填**完整的桶主机名**（含 APPID 与地域）：
#   https://<桶名>-<APPID>.cos.<地域>.myqcloud.com
#
# 留空或不写这一行表示**未启用**头像——此时昵称与简介照常可用，前端只是不
# 渲染头像上传区，与"没配 Google 客户端标识就不渲染登录入口"同一个取向。
#
# 桶必须是**私有读写**：服务端下发的是短时有效的预签名地址，这个设计的全部
# 前提就是"没有签名取不到东西"。公开读的桶等于把所有人的头像公开可列举。
#
# **两项密钥不在这里，也不该在这里**：
#   ALADDIN_COS_SECRET_ID
#   ALADDIN_COS_SECRET_KEY
# 它们只有环境变量这一个来源。配置文件会进版本库、进镜像、被贴给别人排查
# 问题，而凭证不可以。生产环境上由 systemd 的 EnvironmentFile 从
# /opt/aladdin/secrets.env（0600）读取，见 docs/deploy.md。
# GitHub 登录的客户端密钥也在**同一个文件**里——密钥只有一个来源文件。
#
# 桶地址与两项密钥必须**同时给出或同时留空**：只配一半会拒绝启动。半套配置
# 的失败方式是"看起来配好了"——界面会渲染一个传不上去的上传区，直到第一次
# 上传才以一次 403 暴露。
cos_bucket_url: ""

# galaxy 发布页面的**对外地址**（发布域），形如 https://pub.example.com。
# 留空表示**未启用发布**——工程与资产照常可用，前端只是不渲染发布入口。
# 发布**没有单独的桶**：发布物的公开区与资产私有区在 cos_bucket_url 那一个桶
# 里，靠**逐对象的公开读**区分，由发布的上架过程设置。因此**只给发布域不给桶
# 地址会拒绝启动**（有页面地址、没有放素材的地方）。
# 它还必须与 public_base_url **不同源，且不同注册域**——发布物里跑着用户写的
# 脚本，同源（或同注册域）意味着那段脚本能代表访问者向应用发起请求。
# 另外，**启用发布要求 public_base_url 已填**：对外分享的地址落在主站上（主站
# 壳包一层跨源沙箱 iframe），缺了它分享地址拼不出来，同样拒绝启动。
galaxy_publish_base_url: ""

# Google 登录的客户端标识（OAuth 2.0 客户端的 "Client ID"）。
# 留空或不写这一行表示**未启用** Google 登录——此时前端不渲染对应的登录入口。
#
# 注意：这个值**不是秘密**：它本来就明文出现在授权跳转的地址里，因此放在配置
# 文件里不违反"配置中不放凭证"。真正需要保密的是客户端密钥。
#
# Google 与 GitHub 一样是**重定向型**渠道：浏览器被交给 Google，Google 把授权码
# 送回 /auth/google/callback，服务端再用授权码与客户端密钥换回身份令牌。因此启用
# 它需要三项齐全：本项、下面的 public_base_url、以及环境变量里的
# ALADDIN_GOOGLE_CLIENT_SECRET。只给其中一部分会**拒绝启动**。
#
# **回调地址要登记在 Google 控制台**（OAuth 客户端的"已获授权的重定向 URI"），
# 取值是 <public_base_url>/auth/google/callback。反向代理必须把 /auth/ 转发到
# 服务端而不是前端静态页面，否则点登录会没反应（见 docs/deploy.md）。
# 浏览器来源白名单（已获授权的 JavaScript 来源）**不再需要**：本站不在浏览器里
# 调用 Google。
#
# 客户端密钥与 COS 密钥同理，**只有环境变量这一个来源**：
#   ALADDIN_GOOGLE_CLIENT_SECRET
google_client_id: ""

# GitHub 登录的客户端标识（OAuth App 的 "Client ID"）。
# 留空或不写这一行表示**未启用** GitHub 登录。
#
# GitHub 与 Google 同属**重定向型**渠道：它交给浏览器的是一个**授权码**，因此
# 服务端还要用客户端密钥去换令牌，且 GitHub 会把浏览器重定向回本服务的一个回调
# 地址。因此启用它需要三项齐全：本项、下面的 public_base_url、以及环境变量里的
# ALADDIN_GITHUB_CLIENT_SECRET。只给其中一部分会**拒绝启动**。
#
# **回调地址要登记在 GitHub 控制台**（OAuth App 的 Authorization callback URL），
# 取值是 <public_base_url>/auth/github/callback。反向代理必须把 /auth/ 转发到
# 服务端而不是前端静态页面，否则点登录会没反应（见 docs/deploy.md）。
#
# 客户端密钥与 COS 密钥同理，**只有环境变量这一个来源**：
#   ALADDIN_GITHUB_CLIENT_SECRET
github_client_id: ""

# 服务端的**对外地址**，用于构造重定向型登录（Google、GitHub）的回调地址与
# 回跳前端的地址、命令行登录的批准页地址，以及**已发布内容的分享地址**与发布域
# 的 `frame-ancestors`。启用重定向型渠道或启用发布时必填。
#
# 它**不是秘密**（只是一个主机名），因此留在配置文件里。写完整来源，不带路径：
#   https://aladdin.example.com
# 带路径前缀会衍生出一个同样要登记在渠道控制台里的回调地址，是部署时的陷阱，
# 因此会被拒绝启动。协议必须 https，本地回环主机（localhost / 127.0.0.1 / ::1）
# 例外允许 http，使本地开发无需证书。
#
# 它**不得由请求头推导**：用 Host / X-Forwarded-Host 构造跳转目标等于给攻击者
# 一个把会话凭证送到任意主机的原语。
public_base_url: ""

# 第一个管理员。身份指认（下面两项**互斥**，只能填一个）与作用域必须同时
# 给出或同时留空，只填一半会拒绝启动。
#
# 它只在库里**没有任何角色绑定**时生效：建立一条真实的绑定，然后就可以删掉
# 这几行——删掉不会撤销已经建立的绑定，因为判定路径只读数据库、从不读配置。
# 生效时会打一条 warn 级日志。
#
# 方式一：主体标识（由 aladdin 在首次见到一个身份时分配、分配即冻结、永不复用）。
# 登录之后界面上就显示它（页头与首页各一处），不必去日志里找。
bootstrap_admin_subject: ""
#
# 方式二：邮箱。按**已登记的身份**查，命中恰好一个才生效——0 个或多个一律
# 拒绝启动，不猜（同一个邮箱字符串可以分别挂在两个身份上，这是刻意允许的）。
# 因为它查的是已登记身份，用它之前**必须先有一次真实登录**。
#
# 它是引导专属的便利写法，**不意味着身份可以按邮箱确定**：登录与绑定两条
# 路径仍只认渠道签发的不可变标识，邮箱不参与任何一次判定
# （见 docs/design/identity/channel-login.md）。
bootstrap_admin_email: ""
#
# 这次授予的作用域。写 <global> 表示全局作用域——内部值是空串，而空串在这里
# 表示"没填"，两者不能共用一种写法，否则一次漏填会静默变成全局管理员。
bootstrap_admin_scope: ""

# OTLP/HTTP 端点，格式为 host:port。留空表示不上报。
#
# 注意：即使留空，服务端照样生成 trace_id / span_id、照样在响应头回写
# traceparent——链路标识的生成与传播跟"有没有收集端"是两件事。
# 留空只是不上报，不会刷连接错误。
otel_endpoint: ""

# 是否用明文 HTTP 连接上面的端点。本地收集端通常需要开启。
otel_insecure: false

# 采样比例，取值 (0, 1]。采样只影响 span 是否被记录与导出，
# 不影响 ID 的生成，因此调低它不会让日志失去 trace_id。
# 骨架阶段默认全采，是为了排障时不会"恰好没采到"。
otel_sample_ratio: 1

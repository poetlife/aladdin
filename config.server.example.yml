# aladdin 服务端配置示例
#
# 用法：复制到服务端**启动目录**下、改名为 config.yml 即可生效。
# 放在别处也行，用 `aladdin-server -config /path/to/config.yml`
# 或环境变量 ALADDIN_CONFIG 指定。
#
# 个人本机改动写进同目录的 config.local.yml（已在 .gitignore 中，不提交），
# 它覆盖本文件；本文件可以提交、可以共享、可以进镜像。
#
# 完整规则见 docs/design/config/README.md。
#
# 注意：这里只放"进程如何运行"，不放"谁能做什么"。主体、角色、权限码、
# 作用域一律不得由配置提供。

# 监听地址，格式为 host:port。
#
# 默认值只对本机可达。要对外提供服务须显式写成 0.0.0.0:9090——
# 空主机名（如 ":9090"）会被拒绝，因为它读起来像"随便哪个网卡"，
# 而默认配置不该悄悄对外暴露。
address: 127.0.0.1:9090

# 日志级别，取值：debug / info / warn / error。
log_level: info

# 日志文件路径。写空值或不写这一行，表示写到标准错误。
#
# 日志文件写不进去不会让服务端退出：否则"日志写不进去"会升级成
# "服务不可用"，而后者严重得多。
log_file: ""

# 数据库后端，取值：sqlite / mysql。
#
# 默认 sqlite：不依赖任何独立服务，工作目录下建一个文件即可开始。
# 多副本部署或需要独立数据库服务时改成 mysql，并相应填写 database_dsn——
# 业务代码与迁移都不用动。
database_driver: sqlite

# 数据库连接串，形状随后端而异：
#   - sqlite：填文件路径（相对路径以启动时的工作目录为基准）。
#     也可以填完整连接串（以 file: 开头或含 ?）以自行控制底层参数；
#     填路径时服务端会补上等待锁的超时、预写日志与外键检查这三个默认参数。
#     路径的父目录必须已存在——不自动建目录，免得拼错路径后在一个奇怪的地方
#     建出个空库，看起来像数据全丢了。
#   - mysql：填完整的连接串。
#
# 注意：连接串里可能有口令，因此它**不会**出现在日志里；启动日志只记脱敏后的
# 定位信息。排查"数据写到哪去了"时看那一行，不要看这里。
database_dsn: aladdin.db

# OTLP/HTTP 端点，格式为 host:port。留空表示不上报。
#
# 注意：即使留空，服务端照样生成 trace_id / span_id、照样在响应头回写
# traceparent——链路标识的生成与传播跟"有没有收集端"是两件事。
# 留空只是不上报，不会刷连接错误。
otel_endpoint: ""

# 是否用明文 HTTP 连接上面的端点。本地收集端通常需要开启。
otel_insecure: false

# 采样比例，取值 (0, 1]。采样只影响 span 是否被记录与导出，
# 不影响 ID 的生成，因此调低它不会让日志失去 trace_id。
# 骨架阶段默认全采，是为了排障时不会"恰好没采到"。
otel_sample_ratio: 1

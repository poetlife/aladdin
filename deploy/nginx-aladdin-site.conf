# aladdin 的 nginx 站点配置（模板）。
#
# **部署前必须替换占位符 __SITE_DOMAIN__**，做法见 docs/deploy.md。
#
# 这份配置假设本机的 443 由 nginx 直接对外。若 443 上已经有别的 TLS 服务在跑，
# 如何与之共存属于那台宿主的既有约束——由部署者按自己的情况决定，本文不涉及，
# 也不会为某一种共存方式提供模板：那是环境适配，不是 aladdin 的部署需求。

# 公开文档区的**内容协商**：请求头里要 Markdown 时，`/docs/<章>` 直接给
# `/docs/<章>.md`。
#
# 生产里的对应物是 web/vite.config.ts 的 serveDocsArtifacts()——dev 与线上
# 各写一份就会漂，而漂的表现是"线上取到的是文档、本地取到的是首页"。
#
# 只对**章**这一级生效（下面那条 rewrite 里的 `[a-z-]+`）：放开到任意路径会让
# 一个带该请求头的浏览器把整个应用取成 404。
map $http_accept $aladdin_docs_markdown {
    default            "";
    "~*text/markdown"  ".md";
}

server {
    listen 80;
    server_name __SITE_DOMAIN__;

    # Let's Encrypt 从公网发起验证，certbot 的续期也走这里。
    # 这个 location 不能删，否则三个月后证书会安静地续不上。
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    # 其余一律跳 https，不留任何明文入口：
    # 会话凭证是 Authorization: Bearer，明文端口等于让凭证以明文过境。
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/aladdin.access.log;
    error_log  /var/log/nginx/aladdin.error.log;
}

server {
    listen 443 ssl http2;
    server_name __SITE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__SITE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SITE_DOMAIN__/privkey.pem;

    # 刻意比 nginx 全局默认更严（全局还留着 TLSv1/1.1）：
    # aladdin 是签发会话凭证的服务，为兼容早已淘汰的客户端而放宽协议，
    # 收益是零，代价是给凭证多开两条旁路。
    ssl_protocols TLSv1.3 TLSv1.2;

    # 站点监听非标准端口时（例如 443 被别的 TLS 服务占用、流量经 SNI 分流
    # 转发到 4443），不关掉这一项，nginx 生成的重定向会带上它自己监听的端口，
    # 而那个端口对外不可达。表现是"访问 /api-docs 被送到一个连不上的地址"——
    # 目录补斜杠这类自动重定向才会触发，业务路径看不出来。
    # 关掉后用 Host 头构造重定向，不带端口。
    port_in_redirect off;

    root /opt/aladdin/web;
    index index.html;

    # HTML 不缓存：它们引用带 hash 的 assets，缓存 HTML 会让"部署完了用户还
    # 看着上一版"。assets 靠文件名 hash 区分，不需要动。
    #
    # add_header 不继承：只要子 location 里写了 add_header，server 级那些就
    # 不再往下传，所以 HSTS 在这里重复一遍。
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000";
    }

    # 前端是 createBrowserRouter（history 模式，web/src/routes.tsx），
    # 直接访问 /roles 这类路径必须回落到 index.html。少了这一行，
    # 刷新页面就是 404 —— 而 Vite 的 dev server 自带这个回落，
    # 本地永远复现不出来，所以它只能在部署形态上保证。
    #
    # **文档区那几页现在不靠这条回落**：它们在构建时被预渲染成
    # `docs/<章>/index.html`，上面那行 `$uri/index.html` 就把它们找到了。
    # 这意味着"未登录也能读到正文"不需要 JS 也成立
    #（见 docs/design/web/agent-readable.md）。
    location / {
        # 要 Markdown 的请求直接落到那一份 `.md` 上（map 与这条 rewrite 是一对）。
        # `if` + `rewrite ... last` 是 nginx 明确允许的两种安全用法之一：
        # last 会重走一遍 location 匹配，于是 /docs/cli.md 落到下面那条资源规则上。
        if ($aladdin_docs_markdown) {
            rewrite ^/docs/([a-z-]+)/?$ /docs/$1.md last;
        }

        # `$uri/index.html` **排在 `$uri` 前面**，这不是随手写的顺序。
        #
        # 预渲染出来的文档页是一批 `docs/<章>/index.html`，而它们的地址
        # （也是写进 head 里那条 canonical 的地址）**不带斜杠**。nginx 遇到
        # 请求路径是一个目录时，默认行为是 301 到带斜杠的那一份——于是
        # `curl /docs/galaxy` 拿回一个 301，正文在第二跳里；canonical 指着的
        # 那个地址自己也成了个重定向。
        #
        # 先试 `$uri/index.html` 就绕开了"这是个目录"的判断：直接命中那个文件，
        # 不发 301。剩下的顺序照旧（普通文件命中 `$uri`，其余回落 SPA）。
        try_files $uri/index.html $uri $uri/ /index.html;
    }

    # 送给 agent 的产物：`/llms.txt`、`/llms-full.txt`、`/docs/<章>.md`。
    #
    # **必须是正则 location，而且必须带 `=404`。** 少了这一条，未知的
    # `/docs/does-not-exist.md` 会被上面 `location /` 的 SPA 兜底接走，返回一份
    # 200 的 index.html——那是个软 404，会让抓取方以为地址存在、拿到的却是应用空壳。
    #
    # 正则 location 优先于前缀 location，所以这两条一定先命中；`/aladdin.` 那些
    # `^~` 前缀不受影响（`^~` 命中时 nginx 不再看正则）。
    #
    # 分成两条只为一件事：`.md` 要显式给 content-type。**nginx 自带的 mime.types
    # 里没有 md**（1.24 也没有），不指定就退成 `application/octet-stream`——内容读
    # 得到，"这是一份 Markdown"这件事却丢了。`.txt` 不必指定，mime.types 里有。
    #
    # add_header 不继承：只要这里写了，server 级那些就不再来，所以 HSTS 重复一遍。
    location ~* \.md$ {
        default_type text/markdown;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000";
    }

    location ~* \.txt$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000";
    }

    # CLI 自更新的兜底镜像（见 docs/design/cli/self-update.md）。
    #
    # 它**只留最新一份**，路径固定、里面没有版本号字面量：发布流水线不碰它，
    # 由 deploy.sh 在部署收尾时从 GitHub 的 latest 覆盖写一次。
    #
    # 用 alias 而不是 root：/cli/latest/X 要落到 /opt/aladdin/cli/latest/X，
    # 而 root 会把它拼成 /opt/aladdin/cli/cli/latest/X。
    #
    # 这条**必须**是 ^~ 前缀：少了它，请求会被上面 `location /` 的 SPA 兜底
    # 接走，返回一份 200 的 index.html——客户端拿到的就不是元数据，而是前端页面，
    # 而表象只是"升级时 JSON 解析失败"。
    location ^~ /cli/latest/ {
        alias /opt/aladdin/cli/latest/;
        autoindex off;
    }

    # RPC。Connect 的 handler 挂在过程名本身
    # （/aladdin.<领域>.<版本>.<Service>/<Method>），没有 /api 之类的统一前缀，
    # 所以按包名前缀匹配。前缀同时被 web/vite.config.ts 的开发代理使用，
    # 两侧是同一个约定。
    #
    # 浏览器与命令行都走 Connect，因此这一条按 HTTP/1.1 转发上游就够。
    # 不要改成 grpc_pass：nginx 转发 gRPC 时会丢掉空正文响应的 trailers，
    # 也就是所有错误响应（见 docs/debugging/registry.md）。
    #
    # **proxy_buffering 必须关。** 工作台订阅工程状态变化走的是 server stream
    # （见 docs/design/events/README.md），而默认的响应缓冲会把事件攒在 nginx
    # 里、凑够一批才往下发——表现是"事件不来"或晚来一大批，且只在部署形态上
    # 复现（本地 vite 代理不缓冲）。关了之后 nginx 收到一段转发一段。
    #
    # 上游那条流每 25 秒发一次心跳，正是为了不撞 nginx 默认的
    # proxy_read_timeout（60 秒）——空闲超过它，nginx 会把连接判死。心跳与这个
    # 超时是一对，改其一要先看另一处。
    location ^~ /aladdin. {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 健康检查端点挂在 /grpc.health.v1.Health/，不在 /aladdin. 前缀下。
    # 不显式代理的话它会被 SPA 兜底吃掉——POST 到静态文件被 nginx 拒成 405，
    # 表现是"从外部看不出后端到底活没活"，监控没法做。
    location ^~ /grpc.health.v1.Health/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 重定向型登录渠道的浏览器直连端点（GitHub 的 /auth/github/start 与
    # /auth/github/callback）。它们**不是 RPC**，因此不在 /aladdin. 前缀下，
    # 但同样必须转发到服务端。
    #
    # **约定：/auth/ 整段属于服务端，前端不放任何路由在这里。** 因此这一条用
    # 整段前缀而不是逐个端点——但代价是前端若在 /auth/ 下放页面路由，它会被
    # 转发到服务端并返回 404。前端的回跳落点因此在 /login/callback。
    #
    # 漏掉这一条的后果比上面那条更隐蔽：浏览器会被 SPA 兜底送回 index.html
    # （200，一份看起来正常的页面），于是"点 GitHub 登录没反应"，而日志里
    # 连一条错误都没有。
    #
    # 部署 GitHub 登录时还要做两件事：换域名时改 GitHub 控制台里的授权回调
    # 地址；把服务端配置里的 public_base_url 设成这个域名。见 docs/deploy.md。
    #
    # 注意：**不要**加 X-Forwarded-Host 之类的头。服务端的回调地址与回跳前端的
    # 地址只从配置里的 public_base_url 构造，绝不读请求头——用请求头构造跳转
    # 目标等于给攻击者一个把会话凭证送到任意主机的原语。
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 默认的访问日志格式含整个请求行，而回调请求是
        # `/auth/github/callback?code=…&state=…`——授权码与登录凭据会被原样写进
        # 日志（见 docs/design/identity/github-login.md 的约束）。这里关掉访问
        # 日志，只保留 error_log。
        #
        # 关掉的代价很小：**只有走对了的请求才不记**。这条路配错时（location 缺失），
        # 请求落到 `location /` 被 SPA 兜底吃掉，那条访问日志仍然会记下来——而那正是
        # 需要日志的那个故障。走对了的请求则由服务端自己留痕（登录成功/未完成都带
        # 主体标识与失败类别，不含凭证）。
        access_log off;
    }

    access_log /var/log/nginx/aladdin.access.log;
    error_log  /var/log/nginx/aladdin.error.log;

    # 不加 includeSubDomains：这条头的作用域是整个域名，一旦被浏览器记住，
    # 撤销的代价远高于撤销一个子域。
    add_header Strict-Transport-Security "max-age=31536000";
}
